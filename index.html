<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="교회학교 교육부 주일 출석·달란트·명단 관리">
<meta name="theme-color" content="#18856B">
<meta name="apple-mobile-web-app-title" content="출석부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="신당중앙교회">
<meta property="og:description" content="교회학교 교육부 주일 출석·달란트·명단 관리">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>신당중앙교회 교육팀 출석부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F1F5F2; --surface:#FFFFFF; --sunk:#E6ECE8; --line:#D5DED9;
  --ink:#17302B; --muted:#5F726D; --accent:#18856B; --accent-ink:#FFFFFF; --accent-soft:#D4EDE4;
  --gold:#C98A0E; --gold-soft:#FBEFD2; --teacher:#F1EAFC; --teacher-line:#D9C9F2; --new:#B4476A; --new-soft:#F8E1E9; --danger:#B3261E;
  --shadow:0 1px 2px rgba(23,48,43,.06),0 4px 14px rgba(23,48,43,.06);
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1614; --surface:#18221F; --sunk:#202C28; --line:#2C3A35;
    --ink:#E3EDE9; --muted:#93A7A1; --accent:#3BC49C; --accent-ink:#06231B; --accent-soft:#173B31;
    --gold:#F0BD4B; --gold-soft:#3A2E12; --teacher:#251E33; --teacher-line:#40345A; --new:#EE8AAB; --new-soft:#3D1D29; --danger:#F2867E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1614; --surface:#18221F; --sunk:#202C28; --line:#2C3A35;
  --ink:#E3EDE9; --muted:#93A7A1; --accent:#3BC49C; --accent-ink:#06231B; --accent-soft:#173B31;
  --gold:#F0BD4B; --gold-soft:#3A2E12; --teacher:#251E33; --teacher-line:#40345A; --new:#EE8AAB; --new-soft:#3D1D29; --danger:#F2867E;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:12px}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar .arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.datebar .date{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.datebar .date strong{font-size:16px}
.datebar .date input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.today-tag{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:99px;font-weight:600}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;background:var(--sunk);border-radius:12px;padding:3px}
.teams button{border:0;background:none;border-radius:9px;padding:7px 2px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.teams button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:380px){.teams button{font-size:12px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center}
.chip .c{font-size:12px;color:var(--muted)}
.chip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.75}

.summary{display:flex;align-items:center;gap:14px;margin-block:14px 8px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--ground);display:grid;place-items:center;font-size:13px;font-weight:700}
.summary .big{font-size:26px;font-weight:700;line-height:1.1}
.summary .big em{font-style:normal;color:var(--muted);font-size:16px;font-weight:500}
.summary .sub{color:var(--muted);font-size:13px}
.summary .spacer{flex:1}
.summary .btn{white-space:nowrap;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}

.group-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-block:18px 8px;font-family:var(--display);font-size:18px}
.group-h .c{font-family:var(--body);font-size:13px;color:var(--muted)}
.homeroom{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:14px}
.homeroom .lbl{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 8px;flex:none}
.homeroom b{font-weight:600}
.homeroom .none{color:var(--muted)}
.homeroom .spacer{flex:1}
.hr-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hr-chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:14px;font-weight:600}
.hr-chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 6px;cursor:pointer}
.hr-chip.pick{background:var(--surface);font-weight:500;padding:4px 12px;cursor:pointer}
.hr-add{display:flex;gap:6px}.hr-add input{flex:1;min-width:0}
.homeroom button{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 2px}
.group-h .mini{margin-left:auto;font-family:var(--body);font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:99px;padding:3px 10px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px 2px;font-weight:700;font-size:15px}
.sec-h .c{font-size:12px;color:var(--muted);font-weight:500}
.sec-h .badge{background:var(--ink);color:var(--ground);border-radius:6px;padding:0 7px;font-size:13px}
.split-n{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border-radius:10px;padding:3px;margin-top:12px}
.split-n button{border:0;background:none;border-radius:8px;padding:8px 2px;font-size:13px;font-weight:600;color:var(--muted)}
.split-n button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.assign{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:44vh;overflow:auto}
.assign .ar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--ground);border-radius:10px}
.assign .ar .nm{flex:1;min-width:0;font-size:14px;font-weight:600}
.assign .ar .opts{display:flex;gap:4px}
.assign .ar .opts button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.assign .ar .opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.split-tools{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;flex-wrap:wrap}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bhead{display:flex;align-items:center;gap:10px}
.bhead b{font-size:16px}
.bhead .muted{font-size:12px}
.bhead .sp{flex:1}
.bline{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.bline .k{width:52px;flex:none;font-size:12px;color:var(--muted)}
.bline .v{flex:1;min-width:120px;user-select:text;word-break:break-all}
.bline .none{color:var(--muted);font-size:13px}
.rep-tel{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:0;opacity:.55}
.bline .rep-tel{padding:0;border:1px dashed var(--line);background:transparent;color:var(--muted)}
.rep-tel svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rep-tel.on,.bline .rep-tel.on{opacity:1;border:1px solid var(--accent);color:var(--accent);background:var(--surface)}
button.rep-tel{cursor:pointer}
.pc-rep{display:flex;align-items:center;gap:6px}
.bline a,.bline button{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:8px;padding:3px 8px;text-decoration:none}
.a2hs{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.a2hs svg{width:34px;height:34px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.a2hs .tx{flex:1;min-width:0}
.a2hs .tx b{display:block;font-size:15px}
.a2hs .tx span{font-size:12px;color:var(--muted)}
.a2hs .x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
.steps{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps b{color:var(--accent)}
.urlbox{display:flex;gap:8px;align-items:center;margin-top:12px;background:var(--ground);border-radius:10px;padding:8px 10px}
.urlbox code{flex:1;min-width:0;font-size:12px;word-break:break-all;user-select:all}
.role-badge{display:inline-block;vertical-align:middle;margin-left:8px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 9px}
.brand h1{font-size:clamp(17px,4.8vw,24px)}
#brandTitle{cursor:pointer}
nav.tabs button{font-size:11px;white-space:nowrap}
.icon-btn{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0;text-decoration:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.tel{color:var(--accent)}
.icon-btn.has{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.memo-line{color:var(--gold)!important;font-size:12px;font-weight:600}
@media (max-width:440px){.row{gap:6px}.row .avatar{width:34px;height:34px;font-size:12px}.who b{font-size:15px}}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipset button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px}
.cal-head{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.cal-head b{flex:1;text-align:center;font-family:var(--display);font-size:20px;font-weight:400}
.cal{display:grid;grid-template-columns:1.9fr repeat(6,minmax(0,1fr));gap:3px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);padding:2px 0}
.cal .wd.sun{color:var(--danger);font-weight:700}
.cal-cell{min-height:60px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.cal-cell.sun{min-height:84px;background:color-mix(in srgb,var(--danger) 5%,var(--surface))}
.cal-cell .dn{font-size:12px;font-weight:600}
.cal-cell.sun .dn{color:var(--danger);font-size:14px}
.cal-cell.out{opacity:.4}
.cal-cell.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cal-cell.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 5px;align-self:flex-start}
.cal-cell .ev{font-size:10px;line-height:1.3;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell.sun .ev{font-size:11px}
.cal-cell .more{font-size:10px;color:var(--muted)}
.ev-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.ev-card b{font-size:15px}
.ev-card span{font-size:12px;color:var(--muted)}
.file-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.file-row .nm{flex:1;min-width:120px;word-break:break-all}
.guide ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6}
.guide h4{margin:16px 0 0;font-size:15px}
.hist-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-item .when{flex:none;width:86px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist-item .what{flex:1;min-width:0}
.hist-item .by{display:block;font-size:11px;color:var(--muted)}
.hist-kind{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;margin-right:4px;background:var(--sunk);color:var(--muted)}
.hist-kind.t{background:var(--gold-soft);color:var(--gold)}
.yr-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .check,.row .icon-btn.big{width:44px;height:44px;border-radius:12px}
.icon-btn.big{border-width:2px}
.icon-btn.big svg{width:20px;height:20px}
.icon-btn.nonum{opacity:.45}
.act-box{flex:none;display:flex;flex-direction:column;align-items:center}
.act-box .act-lbl{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;font-weight:600}
.act-box .act-lbl.memo{color:var(--gold)}
.roster-wrap{display:flex;flex-direction:column}
.roster-wrap>.homeroom{order:3}
.roster-wrap>.list{margin-bottom:12px}
.roster-wrap>.list,.roster-wrap>.empty{order:2}
.call-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.call-row .k{width:52px;font-size:12px;color:var(--muted)}
.call-row .v{flex:1;min-width:120px;font-size:17px;font-weight:700;letter-spacing:.02em;user-select:all}
.call-row a.btn{text-decoration:none}
.vis-badge{display:inline-block;font-size:11px;font-weight:700;color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);border-radius:99px;padding:0 7px;margin-right:4px}
.pv-table{border-collapse:collapse;font-size:12px}
.pv-table td,.pv-table th{border:1px solid #ddd;padding:3px 6px;white-space:nowrap}
.pv-doc table{border-collapse:collapse}.pv-doc td,.pv-doc th{border:1px solid #ccc;padding:3px 6px}
.pv-doc img{max-width:100%}
.group-empty{font-size:13px;color:var(--muted);padding:4px 4px 2px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px;transition:background .15s,border-color .15s}
.row.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.row.tch{background:var(--teacher);border-color:var(--teacher-line)}
.row.tch.on{background:color-mix(in srgb,var(--teacher) 55%,var(--accent-soft));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.check{flex:none;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--ground);display:grid;place-items:center}
.check svg{width:26px;height:26px;opacity:0;transform:scale(.6);transition:.15s}
.row.on .check{background:var(--accent);border-color:var(--accent)}
.row.on .check svg{opacity:1;transform:none;stroke:var(--accent-ink)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;background:none;border:0;text-align:left;padding:0}
.who b{font-size:16px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who span{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;line-height:18px}
.tag.new{background:var(--new-soft);color:var(--new)}
.tag.bd{background:var(--gold-soft);color:var(--gold)}
.tag.role{background:var(--sunk);color:var(--muted)}
.talent{flex:none;display:flex;align-items:center;gap:2px;background:var(--gold-soft);border-radius:10px;padding:2px 2px 2px 4px}
.talent-box{flex:none}
.talent .arrows{display:flex;flex-direction:column;gap:2px}
.talent .arrows button{width:34px;height:22px;border:0;background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold);border-radius:6px;display:grid;place-items:center;padding:0}
.talent .arrows svg{width:16px;height:16px}
.talent .arrows button:active{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.talent input{width:40px;height:46px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:center;font-weight:700;color:var(--gold);font-size:16px;padding:0;-moz-appearance:textfield}
.talent input::-webkit-outer-spin-button,.talent input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.talent input:focus{background:var(--surface);border-color:var(--gold);outline:none}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);overflow:hidden}
.avatar.lg{width:96px;height:96px;font-size:24px}
.who-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:0}
.photo-field{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.photo-field .btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-field input[type=file]{display:none}
.sheet-head{display:flex;align-items:center;gap:14px}
.check-box{flex:none;display:flex;flex-direction:column;align-items:center}
.check-lbl{font-size:10px;color:var(--accent);text-align:center;margin-top:2px;font-weight:600}
.talent-lbl{font-size:10px;color:var(--gold);text-align:center;margin-top:-2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;margin-top:14px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:56px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
h2.sec{font-family:var(--display);font-weight:400;font-size:19px;margin:22px 0 10px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
details.fold>summary h2.sec{margin-bottom:6px}
details.fold .fold-sum{font-size:13px;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"펼치기 ▾";margin-left:auto;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
details.fold[open]>summary::after{content:"접기 ▴"}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.brand .left{display:flex;align-items:center;gap:8px;min-width:0}
.back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center;flex:none}
.home-intro{margin-block:18px 12px}
.home-intro .yr{font-family:var(--display);font-size:30px;line-height:1.1;margin:0}
.home-intro p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dept-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.dept-grid{grid-template-columns:1fr}}
.dept{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 14px;min-height:132px;box-shadow:var(--shadow)}
.dept .top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.dept .name{font-family:var(--display);font-size:clamp(16px,4.6vw,20px);line-height:1.2;word-break:keep-all}
.dept .range{font-size:13px;color:var(--muted)}
.dept .stat{margin-top:auto;word-break:keep-all;font-size:13px;font-weight:600;color:var(--accent)}
.dept .lock{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:99px;padding:1px 7px}
.lock-ic{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.admin-list{display:flex;flex-direction:column;padding:4px 14px}
.admin-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:0}
.admin-row b{min-width:92px}
.admin-row .code{flex:1;font-size:17px;font-weight:700;letter-spacing:.12em;min-width:80px}
.admin-row .code.none{letter-spacing:0;font-size:13px;font-weight:500;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin:8px 0 0}
.promo-card{display:flex;flex-direction:column;gap:10px}
.promo-card .line{font-size:14px}
.promo-card .btns{display:flex;gap:8px;flex-wrap:wrap}
.move-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:46vh;overflow:auto}
.move{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 10px;background:var(--ground);border-radius:10px}
.move .arrow{color:var(--muted)}
.move .n{margin-left:auto;font-weight:700}
.run{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font:inherit;color:inherit;padding:10px 12px;background:var(--ground);border:2px solid transparent;border-radius:12px;cursor:pointer}
.run[aria-pressed="true"]{border-color:var(--danger);background:var(--surface)}
.run:disabled{cursor:default;opacity:.6}
.run .h{display:flex;gap:8px;align-items:center;font-weight:600}
.run .h .st{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.run .d{font-size:13px;color:var(--muted)}
.move.grad .to{color:var(--new);font-weight:600}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
body.home nav.tabs,body.home #datebar,body.home #chips{display:none}
body.home .app{padding-block-end:32px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,20,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pc-h{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form .name-sex{display:flex;gap:6px}
.form .name-sex input{flex:1;min-width:0}
.form .name-sex select{flex:none;width:72px;padding:0 6px}
.form input,.form select,.form textarea{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:0 10px;font-size:15px;font-weight:400;color:var(--ink)}
.form textarea{height:70px;padding:8px 10px;resize:vertical}
.form .inline{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.form .inline input{height:20px;width:20px}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.actions .spacer{flex:1}
.contact{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.contact div{display:flex;align-items:center;gap:8px;font-size:14px}
.contact .k{width:64px;color:var(--muted);font-size:12px;flex:none}
.contact .v{flex:1;user-select:text;word-break:break-all}
.boot-loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ground);color:var(--ink);text-align:center;padding:16px;transition:opacity .25s}
.boot-loader.out{opacity:0;pointer-events:none}
.boot-loader .spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:bootspin .9s linear infinite}
.boot-loader b{font-family:var(--display);font-size:24px;font-weight:400}
.boot-loader span{color:var(--muted);font-size:14px}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.boot-loader .spin{animation-duration:2.5s}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:99px;font-size:13px;z-index:30}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
#pform .form{grid-template-columns:1fr}
#pform .form label.full{grid-column:auto}
.form label .rep-chk{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:12px;font-weight:600;color:var(--accent)}
.form label .rep-chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.form .pc-rep{justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="boot-loader" id="bootLoader" role="status" aria-live="polite"><div class="spin" aria-hidden="true"></div><b>신당중앙교회</b><span id="bootMsg">출석부를 불러오는 중이에요…</span></div>

<div class="app">
  <header class="top">
    <div class="brand"><div class="left"><button class="back" id="homeBtn" aria-label="메인 화면으로" hidden>‹</button><h1 id="brandTitle" title="메인 화면으로">신당중앙교회 교육팀 출석부</h1></div><small id="sync" class="muted">불러오는 중…</small></div>
    <div class="datebar" id="datebar">
      <button class="arrow" id="prev" aria-label="지난 주일">‹</button>
      <div class="date"><strong id="dateLabel" class="num"></strong><span id="todayTag" class="today-tag" hidden>오늘</span>
        <input type="date" id="datePick" aria-label="날짜 선택"></div>
      <button class="arrow" id="next" aria-label="다음 주일">›</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs"><div>
  <button data-tab="schedule"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M9 3.5v3M15 3.5v3M8 13h2M12 13h2M8 16.5h2"/></svg>일정</button>
  <button data-tab="check"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/></svg>출결메모</button>
  <button data-tab="roster"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3.1 4 1.6 4.5 4.3"/></svg>명단</button>
  <button data-tab="bday"><svg viewBox="0 0 24 24"><path d="M5 20h14v-7H5z"/><path d="M4 13h16M12 13V9M9 9h6"/><path d="M12 6.5c-.8-.8-.8-2 0-3 .8 1 .8 2.2 0 3z"/></svg>생일</button>
  <button data-tab="talent"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5v9M9.5 9.5h3.8a1.7 1.7 0 010 3.4h-2.6a1.7 1.7 0 000 3.4h3.8"/></svg>달란트</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>통계</button>
</div></nav>

<script>
const TEAMS={
  infant:{label:"영아교육팀",short:"영아",unit:"영아",groups:[["0","0세"],["1","1세"],["2","2세"],["3","3세"],["4","4세"]]},
  toddler:{label:"유아교육팀",short:"유아",unit:"어린이",groups:[["5","5세"],["6","6세"],["7","7세"]]},
  youth:{label:"유소년교육팀",short:"유소년",unit:"학생",groups:[["1","1학년"],["2","2학년"],["3","3학년"],["4","4학년"],["5","5학년"],["6","6학년"]]},
  teen:{label:"중고등교육팀",short:"중고등",unit:"학생",groups:[["m1","중1"],["m2","중2"],["m3","중3"],["h1","고1"],["h2","고2"],["h3","고3"]]},
};
const teamOf=p=>p.team||"youth";
/* 영아교육팀은 나이와 관계없이 반을 편성해요. 반 목록은 부서 설정(classes), 나이는 사람마다 따로(age).
   반을 아직 안 정한 아이는 "_"(미배정). 유아·유소년·중고등은 반 = 나이·학년 그대로. */
const FLEX_TEAMS=["infant"];
const isFlex=t=>FLEX_TEAMS.includes(t);
/* 반 이름: 영아는 반 목록 전체를, 나머지 부서는 나이·학년 순서는 그대로 두고 이름만 바꿔요 */
const classesOf=t=>{const c=((S.settings||{})[t]||{}).classes;
  if(isFlex(t))return Array.isArray(c)&&c.length?c:TEAMS[t].groups;
  const nm=Object.fromEntries((Array.isArray(c)?c:[]).filter(x=>x&&x[1]));return TEAMS[t].groups.map(([k,l])=>[k,nm[k]||l])};
const hasUnassigned=t=>[...S.people.values()].some(p=>teamOf(p)===t&&p.group==="_");
const groupsOf=t=>[...classesOf(t),...(isFlex(t)&&hasUnassigned(t)?[["_","미배정"]]:[]),["T","교사"]];
const pickGroupsOf=t=>[...classesOf(t),...(isFlex(t)?[["_","미배정"]]:[]),["T","교사"]];
const isClassKey=g=>g!=="T"&&g!=="_";
const ageLabel=p=>isFlex(teamOf(p))&&p.group!=="T"&&p.age?(Object.fromEntries(TEAMS[teamOf(p)].groups.concat(...FLEX_TEAMS.map(t=>TEAMS[t].groups)))[p.age]||""):"";
let GROUPS,GL;
const S={promos:new Map(),view:"home",depts:new Map(),codes:{},isAdmin:false,people:new Map(),att:new Map(),classes:new Map(),date:null,team:"youth",group:"all",tab:"check",q:"",statMode:"week",db:null,ready:false,editable:true,fold:{}};
function setTeam(t){S.team=TEAMS[t]?t:"youth";const sc=(S.scope||{})[S.team];GROUPS=groupsOf(S.team).filter(([g])=>!sc||sc.level!=="grade"||sc.grades.includes(g));GL=Object.fromEntries(groupsOf(S.team));if(S.group!=="all"&&!GROUPS.some(x=>x[0]===S.group))S.group="all"}
const TL=(t=S.team)=>((S.settings||{})[t]||{}).talentLabel||"달란트";
const talentOn=(t=S.team)=>((S.settings||{})[t]||{}).talent!==false;
/* 대표전화: 학생마다 [수정]에서 체크한 번호. 정하지 않았으면 영아·유아는 부모, 그 외는 학생 */
const CALL_CHOICE_TEAMS=["youth"];
const callChoiceOn=(t=S.team)=>CALL_CHOICE_TEAMS.includes(t);
const callFirst=(t=S.team)=>{if(t==="infant"||t==="toddler")return "parent";if(!callChoiceOn(t))return "student";const v=((S.settings||{})[t]||{}).callFirst;return v==="parent"||v==="student"?v:"student"};
const classCallFirst=(g,t=S.team)=>{if(!callChoiceOn(t))return "";const v=(((S.settings||{})[t]||{}).callFirstByClass||{})[g];return v==="parent"||v==="student"?v:""};
const personCallOn=()=>true;
const personCallFirst=(id,t=S.team)=>{if(!id||!personCallOn(t))return "";const v=(((S.settings||{})[t]||{}).callFirstByPerson||{})[id];return v==="parent"||v==="student"?v:""};
const callFirstOf=(g,t=S.team,id)=>personCallFirst(id,t)||classCallFirst(g,t)||callFirst(t);
const studentNums=(c,t=S.team,g,id)=>{const P=["부모",c.parentPhone],K=["학생",c.phone];return callFirstOf(g,t,id)==="parent"?[P,K]:[K,P]};
/* 번호 순서는 늘 부모 → 학생, 대표전화 쪽에 전화기 아이콘이 가요 */
const fixedNums=c=>[["부모",c.parentPhone,"parent"],["학생",c.phone,"student"]];
function setPersonCall(p,next){const t=teamOf(p);const cur=(S.settings||{})[t]||{};
  S.settings={...(S.settings||{}),[t]:{...cur,callFirstByPerson:{...(cur.callFirstByPerson||{}),[p.id]:next}}};
  return tracked(call("setPersonCallFirst",p.id,next))}
const myScope=()=>(S.scope||{})[S.team]||{level:"dept",grades:[]};
const isHomeroom=()=>myScope().level==="grade";
const canManageGrades=()=>S.isAdmin||(myScope().level==="dept"&&deptLocked(S.team));
function roleLabel(){if(S.isAdmin)return "총관리자";const sc=myScope();if(sc.level==="grade")return "담임 · "+sc.grades.map(g=>GL[g]).join(", ");return deptLocked(S.team)?"팀 관리자":""}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const START_KEY="2027-01-03";const START=new Date(2027,0,3);
function realSunday(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d}
function lastSunday(){const d=realSunday();return d<START?new Date(START):d}
function toSunday(d){d=new Date(d);d.setDate(d.getDate()-d.getDay());return d<START?new Date(START):d}
S.date=keyOf(lastSunday());
try{const t=localStorage.getItem("ya-team");if(t)S.team=t;const g=localStorage.getItem("ya-group");if(g)S.group=g}catch(e){}
setTeam(S.team);

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ---------- derived ---------- */
function activePeople(group){
  return [...S.people.values()].filter(p=>teamOf(p)===S.team&&p.active!==false&&(group==="all"||!group||p.group===group))
    .sort((a,b)=>GROUPS.findIndex(g=>g[0]===a.group)-GROUPS.findIndex(g=>g[0]===b.group)||(a.order??999)-(b.order??999)||a.name.localeCompare(b.name,"ko"));
}
const attOf=k=>S.att.get(k)||{p:{},t:{}};
const isOn=(k,id)=>!!(attOf(k).p||{})[id];
const talentOf=(k,id)=>Number((attOf(k).t||{})[id]||0);
function bdInWeek(p,k){
  if(!p.birthday||!/^\d{1,2}\/\d{1,2}$/.test(p.birthday))return false;
  const [m,d]=p.birthday.split("/").map(Number);const s=parseKey(k);
  for(let i=0;i<7;i++){const x=new Date(s);x.setDate(s.getDate()+i);if(x.getMonth()+1===m&&x.getDate()===d)return true}
  return false;
}

/* ---------- writes ---------- */
const queues={};
function enqueue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(onWriteError);return queues[key]}
function onWriteError(e){
  console.error(e);
  toast((e&&e.message)||"저장하지 못했어요. 잠시 후 다시 시도해 주세요");load();
}
function writeAtt(k,body){
  const cur=S.att.get(k)||{date:k,p:{},t:{}};
  const next={...cur,p:{...cur.p,...(body.p||{})},t:{...cur.t,...(body.t||{})},m:{...(cur.m||{}),...(body.m||{})}};
  S.att.set(k,next);render();
  if(!S.db)return;
  enqueue("att/"+k,async()=>{
    const ref=S.db.doc("att/"+k);
    try{await ref.update(body)}
    catch(e){if(e&&e.code==="invalid_argument"){const snap=await ref.get();if(snap.exists)throw e;await ref.set({date:k,p:body.p||{},t:body.t||{}})}else throw e}
  });
}
function togglePresent(id){if(!S.editable)return;writeAtt(S.date,{p:{[id]:isOn(S.date,id)?0:1}})}
const talentTimers={};
function bumpTalent(id,delta){
  if(!S.editable)return;
  const k=S.date;const v=Math.max(0,talentOf(k,id)+delta);
  const cur=S.att.get(k)||{date:k,p:{},t:{}};S.att.set(k,{...cur,t:{...cur.t,[id]:v}});render();
  clearTimeout(talentTimers[k+id]);
  talentTimers[k+id]=setTimeout(()=>writeAtt(k,{t:{[id]:talentOf(k,id)}}),500);
}
async function markAll(group){
  if(!S.editable)return;
  const ids=activePeople(group).map(p=>p.id);const allOn=ids.every(id=>isOn(S.date,id));
  const p={};ids.forEach(id=>p[id]=allOn?0:1);writeAtt(S.date,{p});
}

/* ---------- render ---------- */
/* 명단 탭 칩: 지금 보는 목록([출석]/[제적]/[졸업])의 인원. '전체'는 교사 빼고 */

const safePhoto=v=>typeof v==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)?v:"";
const avatar=(p,cls="")=>{const ph=safePhoto(p.photo);return ph?`<img class="avatar ${cls}" src="${ph}" alt="${esc(p.name)} 사진">`:`<span class="avatar ${cls}" aria-hidden="true">${esc((p.name||"?").slice(-2))}</span>`};
function resizeImage(file,max=200){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};img.src=fr.result};fr.readAsDataURL(file)});
}

const classKey=g=>S.team+"_"+g;
const SEC_LETTERS=["A","B","C","D"];
const classOfKey=(t,g)=>S.classes.get(t+"_"+g)||{};
const classOf=g=>classOfKey(S.team,g);
const sectionsOfKey=(t,g)=>{const x=classOfKey(t,g).sections;return Array.isArray(x)?x.filter(v=>SEC_LETTERS.includes(v)):[]};
const sectionsOf=g=>sectionsOfKey(S.team,g);
const secOf=p=>{const ss=sectionsOfKey(teamOf(p),p.group);return ss.includes(p.section)?p.section:""};
const classLabel=p=>(GL[p.group]||"")+(secOf(p)?" "+secOf(p)+"반":"");
/* 나이로 반을 나누는 부서(영아)는 명단에 "3세 · 2세반"처럼 나이 먼저, 반 이름 뒤에 "반" */
const banOf=p=>{const l=classLabel(p);return ageLabel(p)&&l&&p.group!=="_"&&!/반$/.test(l)?l+"반":l};
const ageClassLabel=p=>[ageLabel(p),banOf(p)].filter(Boolean).join(" · ");
const homeroomOf=(g,sec)=>{const c=classOf(g);return (sec?(c.teachers||{})[sec]:c.teacher)||""};
/* 담임은 여러 명일 수 있어요. 저장은 "김은혜, 박요한"처럼 쉼표로 이어서 한 칸에 */
const hrNames=v=>[...new Set(String(v||"").split(/\s*[,，]\s*/).map(x=>x.trim()).filter(Boolean))];
const hrJoin=list=>hrNames(list.join(",")).join(", ");
const hrText=v=>hrNames(v).join("·");
function homeroomBar(g,sec=""){
  const t=hrNames(homeroomOf(g,sec));
  return `<div class="homeroom"><span class="lbl">${sec?sec+"반 담임":"담임"}</span>${t.length?`<b>${t.map(esc).join("·")} 선생님</b>`:`<span class="none">아직 지정 안 됨</span>`}<span class="spacer"></span>${S.editable?`<button data-homeroom="${g}" data-sec="${sec}">${t.length?"추가·삭제":"지정"}</button>`:""}</div>`;

/* 담임 선생님 출결: 각 반 담임 칸 바로 아래에서 체크 (교사 명단에 같은 이름이 있을 때) */
const hrPeople=(g,sec)=>{const ns=hrNames(homeroomOf(g,sec));return ns.length?[...S.people.values()].filter(p=>teamOf(p)===S.team&&p.group==="T"&&p.active!==false&&ns.includes(p.name)):[]};
const hrRows=(g,sec="")=>{const ts=hrPeople(g,sec);return ts.length?`<div class="list" style="margin-bottom:8px">${ts.map(personRow).join("")}</div>`:""};
function saveClass(g,patch){
  const key=classKey(g);const body={...classOf(g),team:S.team,group:g,...patch};
  S.classes.set(key,body);render();
  if(S.db)enqueue("classes/"+key,()=>S.db.doc("classes/"+key).set(body));
}
function openHomeroom(g,sec=""){
  let list=hrNames(homeroomOf(g,sec));const orig=hrJoin(list);
  const names=[...S.people.values()].filter(p=>teamOf(p)===S.team&&p.group==="T"&&p.active!==false).map(p=>p.name).sort((a,b)=>a.localeCompare(b,"ko"));
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<form class="sheet" role="dialog" aria-label="담임교사 추가·삭제"><h3>${TEAMS[S.team].short} ${GL[g]}${sec?" "+sec+"반":""} 담임</h3>
    <p class="muted" style="margin:0;font-size:14px">담임을 여러 명 둘 수 있어요. 이름 옆 ×를 누르면 빠져요.</p>
    <div class="hr-list" id="hr-cur"></div>
    <div class="form"><label class="full">담임 추가<span class="hr-add"><input id="f-homeroom" list="hr-list" placeholder="예: 김은혜" autocomplete="off"><button type="button" class="btn" data-add>추가</button></span></label>
    <datalist id="hr-list">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>
    <div id="hr-pick"></div>
    <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button class="btn primary" type="submit">저장</button></div></form>`;
  document.body.appendChild(ov);
  const inp=ov.querySelector("#f-homeroom");
  const draw=()=>{
    ov.querySelector("#hr-cur").innerHTML=list.length?list.map((n,i)=>`<span class="hr-chip">${esc(n)}<button type="button" data-del="${i}" aria-label="${esc(n)} 담임에서 빼기">×</button></span>`).join(""):`<span class="muted" style="font-size:13px">아직 담임이 없어요</span>`;
    const rest=names.filter(n=>!list.includes(n));
    ov.querySelector("#hr-pick").innerHTML=rest.length?`<p class="muted" style="font-size:12px;margin:8px 0 4px">교사 명단에서 누르면 바로 추가돼요</p><div class="hr-list">${rest.map(n=>`<button type="button" class="hr-chip pick" data-pick="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>`:"";
  };
  const add=v=>{const add=hrNames(v).filter(n=>!list.includes(n));if(add.length){list=list.concat(add);draw()}inp.value="";inp.focus()};
  draw();
  ov.addEventListener("click",e=>{
    if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
    const d=e.target.closest("[data-del]");if(d){list.splice(Number(d.dataset.del),1);draw();return}
    const pk=e.target.closest("[data-pick]");if(pk)return add(pk.dataset.pick);
    if(e.target.closest("[data-add]"))add(inp.value);
  });
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add(inp.value)}});
  ov.querySelector("form").addEventListener("submit",e=>{e.preventDefault();
    if(inp.value.trim())add(inp.value);
    const v=hrJoin(list);ov.remove();if(v===orig)return;
    saveClass(g,sec?{teachers:{...(classOf(g).teachers||{}),[sec]:v}}:{teacher:v});
    toast(v?`담임을 저장했어요 (${list.length}명)`:"담임을 모두 지웠어요");
  });
  inp.focus();
}
function openSplit(g){
  if(!S.editable)return;
  const studs=activePeople(g);
  const cur=sectionsOf(g);let n=Math.max(1,cur.length);
  const assign=new Map(studs.map(p=>[p.id,secOf(p)]));
  const letters=()=>n>1?SEC_LETTERS.slice(0,n):[];
  const balance=all=>{const L=letters();if(!L.length){studs.forEach(p=>assign.set(p.id,""));return}
    const cnt=Object.fromEntries(L.map(l=>[l,0]));
    if(!all)studs.forEach(p=>{const v=assign.get(p.id);if(L.includes(v))cnt[v]++;else assign.set(p.id,"")});
    else studs.forEach(p=>assign.set(p.id,""));
    [...studs].sort((a,b)=>a.name.localeCompare(b.name,"ko")).forEach(p=>{if(assign.get(p.id))return;const l=L.reduce((m,x)=>cnt[x]<cnt[m]?x:m,L[0]);assign.set(p.id,l);cnt[l]++});
  };
  const ov=document.createElement("div");ov.className="overlay";
  const draw=()=>{
    const L=letters();const count=l=>studs.filter(p=>assign.get(p.id)===l).length;
    ov.innerHTML=`<div class="sheet" role="dialog" aria-label="분반 나누기와 합치기"><h3>${TEAMS[S.team].short} ${GL[g]} 분반</h3>
      <p class="muted" style="margin:0;font-size:14px">반 개수를 고르고 학생마다 반을 정하세요. "1개 반"을 고르면 분반을 합쳐요.</p>
      <div class="split-n">${[1,2,3,4].map(k=>`<button type="button" data-n="${k}" aria-pressed="${n===k}">${k===1?"1개 반":SEC_LETTERS.slice(0,k).join("·")}</button>`).join("")}</div>
      ${L.length?`<div class="split-tools"><button type="button" class="btn" data-balance>가나다순 골고루 나누기</button><span class="muted num">${L.map(l=>`${l}반 ${count(l)}명`).join(" · ")}</span></div>`:""}
      <div class="assign">${studs.length?studs.map(p=>`<div class="ar">${avatar(p)}<span class="nm">${esc(p.name)}</span>${L.length?`<span class="opts">${L.map(l=>`<button type="button" data-as="${p.id}" data-l="${l}" aria-pressed="${assign.get(p.id)===l}" aria-label="${esc(p.name)} ${l}반">${l}</button>`).join("")}</span>`:`<span class="muted" style="font-size:12px">한 반</span>`}</div>`).join(""):`<p class="muted">이 학년에 학생이 없어요.</p>`}</div>
      <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button type="button" class="btn primary" data-save>저장</button></div></div>`;
  };
  if(n>1)balance(false);
  draw();document.body.appendChild(ov);
  ov.addEventListener("click",async e=>{
    if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
    const nb=e.target.closest("[data-n]");if(nb){n=Number(nb.dataset.n);balance(false);draw();return}
    if(e.target.closest("[data-balance]")){balance(true);draw();return}
    const as=e.target.closest("[data-as]");if(as){assign.set(as.dataset.as,as.dataset.l);draw();return}
    if(!e.target.closest("[data-save]"))return;
    const L=letters();const c=classOf(g);
    const teachers=Object.fromEntries(Object.entries(c.teachers||{}).filter(([k])=>L.includes(k)));
    const patch={sections:L,teachers};
    if(!L.length)patch.teacher=hrJoin([c.teacher||""].concat(Object.values(c.teachers||{})));
    if(L.length&&!teachers.A&&c.teacher)patch.teachers={...teachers,A:c.teacher};
    const changed=studs.filter(p=>(p.section||"")!==(assign.get(p.id)||""));
    ov.remove();saveClass(g,patch);
    for(const p of changed){const v=assign.get(p.id)||"";S.people.set(p.id,{...S.people.get(p.id),section:v});
      if(S.db)enqueue("people/"+p.id,()=>writeWithRetry(S.db.doc("people/"+p.id),{section:v}));}
    render();toast(L.length?`${GL[g]}을(를) ${L.join("·")}반으로 나눴어요`:`${GL[g]} 분반을 합쳤어요`);
  });
}

const telOf=v=>String(v||"").replace(/[^0-9+]/g,"");
function bookLine(k,v,tel,rep){
  const ic=rep==="rep"?`<span class="rep-tel on" title="대표전화" aria-label="대표전화">${PHONE_SVG}</span>`:rep?`<button class="rep-tel" data-rep-set="${esc(rep)}" data-rep-v="${k==="부모"?"parent":"student"}" title="대표전화로 정하기" aria-label="${k} 번호를 대표전화로 정하기">${PHONE_SVG}</button>`:"";
  if(!v)return `<div class="bline">${ic}<span class="k">${k}</span><span class="v none">없음</span></div>`;
  return `<div class="bline">${ic}<span class="k">${k}</span><span class="v num">${esc(v)}</span>${tel&&telOf(v).length>=9?`<a href="tel:${telOf(v)}">전화</a>`:""}<button data-copy-c="${esc(v)}">복사</button></div>`;
}
/* 생일은 MM/DD로 맞춰 저장해요 (3/5, 0305, 3월 5일 → 03/05) */
function normBirthday(v){
  v=String(v||"").trim();if(!v)return "";
  const m=v.match(/^(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})\s*일?$/)||v.match(/^(\d{2})(\d{2})$/);
  if(!m)return null;const mm=Number(m[1]),dd=Number(m[2]);
  if(mm<1||mm>12||dd<1||dd>31)return null;
  return String(mm).padStart(2,"0")+"/"+String(dd).padStart(2,"0");
}

  const frame=html=>`<div style="max-height:66vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111">${html}</div>`;
  try{
    if(kind==="img")box.innerHTML=`<img src="${url}" alt="${esc(name)}" style="display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:8px">`;
    else if(kind==="text"){let t="";try{t=new TextDecoder("utf-8").decode(u8)}catch(_){t=bin}box.innerHTML=`<pre style="white-space:pre-wrap;word-break:break-all;max-height:66vh;overflow:auto;background:var(--ground);padding:10px;border-radius:8px;margin:0;font-size:13px">${esc(t.slice(0,200000))}</pre>`}
    else if(kind==="pdf"){
      const lib=await pdfLib();const pdf=await lib.getDocument({data:u8}).promise;const n=Math.min(pdf.numPages,30);
      box.innerHTML=frame(`<div id="pvPages" style="padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center"></div>`)+(pdf.numPages>30?`<p class="muted" style="font-size:12px;margin:6px 0 0">앞 30쪽까지 보여요. 전체는 [내려받기]로 받아 주세요.</p>`:`<p class="muted" style="font-size:12px;margin:6px 0 0">모두 ${pdf.numPages}쪽</p>`);
      const wrap=box.querySelector("#pvPages");const W=Math.min(box.clientWidth||600,900)-20;
      for(let k=1;k<=n;k++){const pg=await pdf.getPage(k);const v0=pg.getViewport({scale:1});const sc=Math.max(.5,W/v0.width)*(window.devicePixelRatio>1?1.5:1);const vp=pg.getViewport({scale:sc});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.cssText="width:100%;max-width:"+W+"px;box-shadow:0 1px 4px rgba(0,0,0,.2)";wrap.appendChild(c);
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;if(!document.body.contains(ov))return}
    }
    else if(kind==="sheet"){
      await loadXLSX();
      const wb=XLSX.read(u8,{type:"array"});
      ov._sheets=wb.SheetNames.map(sn=>{const h=XLSX.utils.sheet_to_html(wb.Sheets[sn],{header:"",footer:""});return h.replace("<table","<table class=\"pv-table\"")});
      box.innerHTML=(wb.SheetNames.length>1?`<div class="chipset" style="margin:0 0 8px">${wb.SheetNames.map((sn,k)=>`<button type="button" data-sheet="${k}" aria-pressed="${k===0}">${esc(sn)}</button>`).join("")}</div>`:"")+frame(`<div id="pvSheet">${ov._sheets[0]||""}</div>`);
    }
    else if(kind==="docx"){
      await loadScript("mammoth@1.6.0/mammoth.browser.min.js");
      const r=await window.mammoth.convertToHtml({arrayBuffer:u8.buffer});
      box.innerHTML=frame(`<div class="pv-doc" style="padding:14px 16px;font-size:14px;line-height:1.7">${r.value||"<p>(내용이 없어요)</p>"}</div>`)+`<p class="muted" style="font-size:12px;margin:6px 0 0">글꼴·쪽 나눔은 원본과 조금 다를 수 있어요.</p>`;
    }
    else box.innerHTML=`<p style="margin:0;font-size:14px">${ext==="hwp"||ext==="hwpx"?"한글(hwp) 파일은":ext==="pptx"||ext==="ppt"?"파워포인트 파일은":"이 형식("+esc(ext||"파일")+")은"} 앱에서 미리 볼 수 없어요. [내려받기]로 받아서 열어 주세요.</p><p class="muted" style="font-size:12px;margin:6px 0 0">미리 보고 싶다면 PDF로 저장해서 올려 주세요.</p>`;
  }catch(e){box.innerHTML=`<p style="margin:0;font-size:14px">미리보기를 만들지 못했어요. [내려받기]로 받아서 열어 주세요.</p><p class="muted" style="font-size:12px;margin:6px 0 0">${esc(e.message||"")}</p>`}
}
function openEvent(id,date){
  const E=S.ev;if(!E)return;const ev=id?E.list.find(x=>x.id===id):{id:"",date:date||S.date,title:"",memo:"",files:[]};if(!ev)return;
  const edit=E.canEdit;const ov=document.createElement("div");ov.className="overlay";
  const draw=()=>{ov.innerHTML=`<form class="sheet" role="dialog" aria-label="일정"><h3>${ev.id?(edit?"일정 수정":"일정"):"새 일정"}</h3>
    <div class="form"><label class="full">제목<input id="f-evt" maxlength="80" value="${esc(ev.title)}" ${edit?"":"readonly"} required></label>
    <label class="full">날짜<input id="f-evd" type="date" value="${esc(ev.date)}" ${edit?"":"readonly"} required></label>
    <label class="full">내용<textarea id="f-evm" maxlength="2000" ${edit?"":"readonly"}>${esc(ev.memo)}</textarea></label></div>
    ${ev.id?`<h4 style="margin:16px 0 4px;font-size:15px">공유 문서</h4><div>${(ev.files||[]).map(f=>`<div class="file-row"><span class="nm">${f.vis==="admin"?`<span class="vis-badge">관리자만</span>`:""}${esc(f.name)}<br><span class="muted" style="font-size:12px">${f.size?Math.max(1,Math.round(f.size/1024))+"KB · ":""}${esc(f.updated||"")}</span></span><button type="button" class="btn primary" data-fview="${f.id}">보기</button><button type="button" class="btn" data-fdl="${f.id}">내려받기</button>${edit?`<button type="button" class="btn" data-fvis="${f.id}" data-v="${f.vis==="admin"?"all":"admin"}">${f.vis==="admin"?"전체 공개로":"관리자만으로"}</button><button type="button" class="btn" data-frep="${f.id}">바꾸기</button><button type="button" class="btn danger" data-fdel="${f.id}">삭제</button>`:""}</div>`).join("")||`<p class="muted" style="margin:4px 0">올린 문서가 없어요.</p>`}</div>
    ${edit?`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><select id="f-fvis" aria-label="공개 범위" style="height:38px;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:0 8px;color:var(--ink)"><option value="all">전체 보기</option><option value="admin">관리자만 보기</option></select><button type="button" class="btn" id="fAdd">+ 문서 올리기 (10MB까지)</button></div><p class="muted" style="font-size:12px;margin:6px 0 0">전체 보기: 담임도 볼 수 있어요 · 관리자만 보기: 팀 관리자와 총관리자만</p>`:""}`:(edit?`<p class="muted" style="font-size:13px">저장한 뒤 공유 문서를 올릴 수 있어요.</p>`:"")}
    <div class="actions">${ev.id&&edit?`<button type="button" class="btn danger" data-evdel>일정 삭제</button>`:""}<div class="spacer"></div><button type="button" class="btn" data-close>${edit?"취소":"닫기"}</button>${edit?`<button class="btn primary" type="submit">저장</button>`:""}</div></form>`};
  draw();document.body.appendChild(ov);
  const pickFile=replaceId=>{const vis=replaceId?"":((ov.querySelector("#f-fvis")||{}).value||"all");const inp=document.createElement("input");inp.type="file";inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;if(f.size>10*1024*1024){alertBox("파일이 너무 커요","10MB까지 올릴 수 있어요.");return}
    try{toast("올리는 중…");const files=await tracked(call("uploadFile",S.team,ev.id,{name:f.name,mime:f.type,b64:await fileToB64(f),replaceId:replaceId||"",vis}));ev.files=files;const x=E.list.find(y=>y.id===ev.id);if(x)x.files=files;draw();toast(replaceId?"문서를 바꿨어요":"문서를 올렸어요")}catch(e){alertBox("올리지 못했어요",e.message)}};inp.click()};
  ov.addEventListener("click",async e=>{
    if(e.target===ov||e.target.closest("[data-close]")){ov.remove();render();return}
    const fv=e.target.closest("[data-fview]");if(fv)return viewShared(fv.dataset.fview);
    const dl=e.target.closest("[data-fdl]");if(dl)return downloadShared(dl.dataset.fdl);
    const vb=e.target.closest("[data-fvis]");if(vb){try{const files=await tracked(call("setFileVis",S.team,ev.id,vb.dataset.fvis,vb.dataset.v));ev.files=files;const x=E.list.find(y=>y.id===ev.id);if(x)x.files=files;draw();toast(vb.dataset.v==="admin"?"관리자만 볼 수 있게 했어요":"전체 공개로 바꿨어요")}catch(err){alertBox("바꾸지 못했어요",err.message)}return}
    const rp=e.target.closest("[data-frep]");if(rp)return pickFile(rp.dataset.frep);
    if(e.target.closest("#fAdd"))return pickFile("");
    const fd=e.target.closest("[data-fdel]");if(fd){if(!fd.dataset.armed){fd.dataset.armed="1";fd.textContent="한 번 더";return}
      try{const files=await tracked(call("deleteFile",S.team,ev.id,fd.dataset.fdel));ev.files=files;const x=E.list.find(y=>y.id===ev.id);if(x)x.files=files;draw();toast("문서를 삭제했어요")}catch(err){alertBox("삭제하지 못했어요",err.message)}return}
    const dv=e.target.closest("[data-evdel]");if(dv){if(!dv.dataset.armed){dv.dataset.armed="1";dv.textContent="한 번 더 누르면 삭제";return}
      try{await tracked(call("deleteEvent",S.team,ev.id));E.list=E.list.filter(y=>y.id!==ev.id);ov.remove();render();toast("일정을 삭제했어요")}catch(err){alertBox("삭제하지 못했어요",err.message)}}
  });
  ov.addEventListener("submit",async e=>{
    e.preventDefault();if(!edit)return;
    const body={id:ev.id,title:ov.querySelector("#f-evt").value.trim(),date:ov.querySelector("#f-evd").value,memo:ov.querySelector("#f-evm").value};
    if(!body.title||!body.date)return;
    try{const saved=await tracked(call("saveEvent",S.team,body));const i=E.list.findIndex(y=>y.id===saved.id);if(i>=0)E.list[i]=saved;else E.list.push(saved);
      const isNew=!ev.id;Object.assign(ev,saved);S.calSel=saved.date;S.calMonth=saved.date.slice(0,7);toast("일정을 저장했어요");if(isNew)draw();else{ov.remove();render()}}
    catch(err){alertBox("저장하지 못했어요",err.message)}
  });
}

function openGuide(){
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet guide" role="dialog" aria-label="반 담임 사용 설명서"><h3>반 담임 사용 설명서</h3>
    <p class="muted" style="margin:0;font-size:14px">팀 관리자에게 받은 <b>담임 번호</b>로 들어가면 우리 반만 보여요.</p>
    <h4>1. 앱 설치 (처음 한 번)</h4><ol><li>주소 <b class="guide-url">팀 관리자가 알려 준 앱 주소</b> 를 열어요. 팀 관리자가 보낸 링크를 눌러도 돼요.</li><li><b>안드로이드</b>: 크롬 오른쪽 위 <b>︙</b> → <b>홈 화면에 추가</b> (또는 앱 설치)</li><li><b>아이폰</b>: 사파리 아래 <b>공유 버튼</b> → <b>홈 화면에 추가</b></li><li>카카오톡에서 열었다면 먼저 <b>다른 브라우저로 열기</b>를 눌러요.</li></ol>
    <h4>2. 들어가기</h4><ol><li>메인에서 <b>우리 부서</b> 카드 → <b>담임 번호</b> 넣기</li><li>제목 옆에 "담임 · 2학년"처럼 보이면 성공!</li><li>내 휴대폰이면 "이 기기에서 번호 기억하기"를 켜 두세요. 다음부터 바로 들어가요.</li></ol>
    <h4>3. 출결메모 (주일 출석)</h4><ol><li>위쪽 날짜가 오늘 주일인지 확인해요. ‹ › 로 다른 주일로 가요.</li><li><b>체크 칸</b>: 누르면 출석, 다시 누르면 취소</li><li><b>메모</b>: 결석 이유 적기 ("감기·아픔" 같은 버튼도 있어요)</li><li><b>전화</b>: 누르면 그 학생의 <b>대표전화</b>로 바로 걸려요. 대표전화는 학생마다 명단 [수정]에서 <b>[대표]</b>에 체크한 번호예요. 체크하지 않았으면 영아·유아부는 부모님, 유소년·중고등부는 학생 번호예요 (없으면 다른 번호). 컴퓨터에서는 번호 창이 떠요.</li><li>숫자 칸(달란트 등): ▲▼ 를 누르거나 숫자를 눌러 적어요. 달란트는 여기서만 줘요.</li><li><b>담임 선생님 출석</b>: 우리 반 담임 줄 바로 아래에 선생님 이름이 <b>연보라색 줄</b>로 나와요. 거기서 선생님 출석·메모도 체크해요. (교사 명단의 이름과 담임 이름이 같아야 나와요)</li></ol>
    <h4>4. 명단 (연락처 포함)</h4><ol><li><b>[+ 사람 추가]</b>로 새 학생을 넣어요. 연락처·주소도 같이 적을 수 있어요.</li><li>이름을 누르면 보호자·부모 연락처와 주소가 보여요. <b>[전화]</b>, <b>[복사]</b>도 여기서.</li><li><b>[수정]</b>: 사진·반·생일·메모·연락처·주소를 한 창에서 위에서 아래로 차례대로 고쳐요.</li><li><b>[삭제]</b>: 이름을 누른 창에서 눌러요. 한 번 더 눌러야 지워지고, 되돌릴 수 없어요.</li><li>사람 정보는 <b>명단 탭에서만</b> 고칠 수 있어요. 다른 탭에서는 보기만 해요.</li><li><b>대표전화</b>: [수정]에서 부모 연락처·학생 연락처 옆 <b>[대표]</b> 중 하나에 체크하고 저장해요. 출결메모의 <b>[전화]</b>를 누르면 그 번호로 바로 걸려요. 이름을 누른 창에서 전화기 아이콘을 눌러 바꿀 수도 있어요.</li><li>명단에서 <b>연보라색</b> 줄은 선생님이에요.</li><li>연락처가 잠겨 있으면 명단 위쪽 <b>연락처</b> 줄의 <b>[번호 입력]</b>에 담임 번호를 넣어요.</li></ol>
    <h4>5. 생일 · 달란트</h4><ol><li><b>생일</b>: 이번 주·이번 달·다음 달 생일. 생일이 없는 사람은 맨 아래에 모여요.</li><li><b>달란트</b>: 올해 누적 순위를 보는 화면이에요 (고치기는 출결메모에서).</li><li>달란트·생일·일정 엑셀은 <b>통계</b> 탭의 <b>[엑셀로 내보내기]</b> 파일에 들어 있어요.</li></ol>
    <h4>6. 출석 · 제적 · 졸업</h4><ol><li>명단 위쪽 <b>[출석] [제적] [졸업]</b> 을 눌러 나눠 봐요.</li><li>더 이상 안 나오는 학생: 이름 → [수정] → 상태를 <b>제적</b>으로. 졸업한 학생은 <b>졸업</b>으로.</li><li>제적·졸업 학생은 출석 명단에서 빠지지만 기록은 그대로 남아요.</li><li>다시 나오면 [제적] 목록에서 <b>[출석으로]</b>를 눌러요.</li></ol>
    <h4>7. 엑셀로 한 번에 (명단 · 연락처)</h4><ol><li>명단 탭 <b>엑셀</b> 줄의 <b>[양식 받기]</b>로 파일을 받아요. 지금 명단이 채워져 있어요.</li><li>'명단' 시트에 이름·반·생일·연락처·주소를 적어요. 생일은 03/15 처럼. 빈 칸은 원래 값을 그대로 둬요.</li><li><b>[올리기]</b>로 파일을 고르고 확인. 이름과 반이 같은 사람은 고쳐지고, 없는 사람은 새로 들어가요.</li><li>담임은 <b>우리 반</b> 학생만 올라가요. 파일에서 줄을 지워도 앱에서는 지워지지 않아요.</li><li>출석부 전체를 저장해 두려면 <b>통계</b> 탭의 <b>[엑셀로 내보내기]</b>를 눌러요.</li></ol>
    <h4>8. 일정 · 공유 파일</h4><ol><li><b>일정</b> 탭 <b>[달력]</b>: 날짜를 누르면 그날 일정, 일정 카드를 누르면 공유 문서가 보여요.</li><li><b>[자료실]</b>: 공과 교재·양식 같은 부서 파일</li><li><b>[보기]</b>: 받지 않고 바로 봐요 (PDF·엑셀·워드·사진). 한글·파워포인트는 <b>[내려받기]</b>로 열어요.</li><li>일정과 파일 올리기는 팀 관리자가 해요. 올릴 파일은 팀 관리자에게 보내 주세요.</li></ol>
    <h4>9. 반 이름 · 반 편성 (팀 관리자)</h4><ol><li>화면 위쪽 반(학년) 칩을 <b>더블클릭</b>(휴대폰은 <b>두 번 톡톡</b>)하면 그 반 이름을 바꿀 수 있어요. 예: 1학년 → 1학년 사랑반</li><li>명단 탭 <b>[반 관리]</b>·<b>[이름 바꾸기]</b>와 같은 이름이라, 한쪽에서 바꾸면 다른 쪽에도 그대로 보여요.</li><li>이름만 바뀌고 출석·담임·담임 번호는 그대로 이어져요. 담임 번호로 들어오면 바꿀 수 없어요.</li><li><b>영아교육팀</b>은 나이와 관계없이 반을 만들어요. 명단 탭 <b>[반 관리]</b>에서 반 추가·삭제·순서, <b>[반 배정]</b>에서 아이마다 반을 골라요. 나이는 사람 [수정] 창에서 따로 적어요.</li></ol>
    <h4>10. 지켜 주세요</h4><ol><li>담임 번호와 연락처는 다른 사람에게 알려 주지 마세요.</li><li>같이 쓰는 기기면 끝난 뒤 메인의 <b>이 기기 번호 지우기</b>를 눌러요.</li><li>잘 안 되면 새로 고치거나 크롬·사파리에서 열어 보세요.</li></ol>

function AUTH(){let admin=S._admin||"",codes={...(S._codes||{})},gcodes={...(S._gcodes||{})};try{admin=localStorage.getItem("ya-admin")||admin;codes={...codes,...(JSON.parse(localStorage.getItem("ya-codes")||"null")||{})};gcodes={...gcodes,...(JSON.parse(localStorage.getItem("ya-gcodes")||"null")||{})}}catch(_){}return{admin,codes,gcodes}}
let pending=0;
// GitHub 페이지에서 열면 google.script.run 이 없으므로 웹앱 주소(doPost)로 직접 보낸다.
const API_URL="https:"+"/"+"/script.google.com/macros/s/AKfycbxAIzrJ4PjqNm4lo-1iC88RjRV56JTSkug5moMo_a-x7Im4v98XxCZ0Z-Gm0Y2FaUGt/exec";
const HAS_GS=typeof google!=="undefined"&&!!(google.script&&google.script.run);
async function callFetch(op,args){
  let t;
  try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op,auth:AUTH(),args}),redirect:"follow"});
    if(!r.ok)throw new Error("HTTP "+r.status);t=await r.text()}
  catch(e){throw new Error("연결하지 못했어요. 인터넷 연결을 확인해 주세요")}
  let x;try{x=JSON.parse(t)}catch(_){throw new Error("서버 응답을 읽지 못했어요")}
  if(!x.ok)throw new Error(x.error);return x.data;
}
function call(op,...args){
  if(!HAS_GS)return callFetch(op,args);
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(r=>{let x;try{x=JSON.parse(r)}catch(_){return rej(new Error("서버 응답을 읽지 못했어요"))}x.ok?res(x.data):rej(new Error(x.error))})
      .withFailureHandler(e=>rej(new Error((e&&e.message)||"연결하지 못했어요. 인터넷 연결을 확인해 주세요")))
      .api(op,AUTH(),...args);
  });
}

async function load(){
  if(loading)return loading;
  const slow=setTimeout(()=>{if(!S.ready){slowNotice(true,"구글 시트에서 불러오는 데 시간이 걸리고 있어요.");hideBootLoader()}},12000);
  const slowMsg=setTimeout(()=>{if(!S.ready&&$("#bootMsg"))$("#bootMsg").textContent="조금만 기다려 주세요. 처음 열 때는 시간이 걸려요…"},5000);
  loading=call("boot").then(d=>{applyBoot(d);saveBootCache(d);slowNotice(false);$("#sync").textContent="구글 시트에 저장됨";render();hideBootLoader()})
    .catch(e=>{console.error(e);$("#sync").textContent="연결 안 됨";if(!S.ready){slowNotice(true,"불러오지 못했어요: "+e.message);hideBootLoader()}else toast(e.message)})
    .finally(()=>{clearTimeout(slow);clearTimeout(slowMsg);loading=null});
  return loading;
}

  if(document.hidden||pending||document.querySelector(".overlay"))return;
  const a=document.activeElement;if(a&&a.dataset&&(a.dataset.tv||a.dataset.total))return;
  if(a&&a.id==="q")return; // 이름 검색 중에는 새로 불러오지 않아요 (한글 입력이 끊기지 않게)
  load();
},25000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!pending)load()});
</script>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
