    +(isFlex(t)?`<br>반은 그대로예요. 새 반이 필요하면 등반 뒤 [명단 → 반 배정]에서 옮겨 주세요.`:"");
  const na=noAgeKids(t);
  const warn=(na.length?`<p class="err">나이가 적혀 있지 않은 ${na.length}명은 등반에서 빠져요: ${na.slice(0,6).map(p=>esc(p.name)).join(", ")}${na.length>6?" …":""}. 명단에서 나이를 먼저 적어 주세요.</p>`:"")+(promoDone(t)?`<p class="err">이미 ${y}년 연말 ${esc(TEAMS[t].short)} 등반을 했어요. 지금 남은 대상은 그 뒤에 들어온 학생들이에요.</p>`:"");
  const listHtml=()=>{const o=promoGroups(t);return o.map(m=>promoMoveRow(m,t)).join("")+promoSkipRow(t)||`<p class="muted">등반할 학생이 없어요. 이번 연말에 이미 등반한 학생은 다시 올라가지 않아요.</p>`};
  const list=`<p class="muted" style="font-size:12px;margin:10px 0 0">이름을 누르면 이번 등반에서 빼요. 뺀 학생을 다시 누르면 넣어요.</p><div class="move-list" id="pList">${listHtml()}</div>`;
  const ov=document.createElement("div");ov.className="overlay";ov.dataset.team=t;
  ov.innerHTML=sheetShell(`${TEAMS[t].label} ${y}년 연말 학년 등반`,intro,warn+list,plan.length||promoSkipped(t).length?"등반 실행":"","primary",t);
  document.body.appendChild(ov);
  const refresh=()=>{if(!ov.isConnected){document.removeEventListener("promo-skip",refresh);return}
    plan=planPromotion(t);ov.querySelector("#pList").innerHTML=listHtml();ov.querySelector("#pCount").textContent=plan.length;
    const go=ov.querySelector("#pGo");if(go&&!go.disabled){delete go.dataset.armed;go.textContent=plan.length?"등반 실행":"등반할 학생 없음";go.disabled=false}};
  document.addEventListener("promo-skip",refresh);
  runSheet(ov,"한 번 더 누르면 실행",async prog=>{
    plan=planPromotion(t);if(!plan.length){toast("등반할 학생이 없어요");return}
    const moves=[],list=[];
    for(const {p,next} of plan){
      moves.push({id:p.id,team:t,group:p.group,age:p.age||"",section:p.section||"",active:p.active!==false,leftType:p.leftType||"",note:p.note||"",promotedYear:p.promotedYear??null});
      list.push([p.id,next==="grad"?{active:false,leftType:"졸업",note:(p.note?p.note+" · ":"")+`${y}년 졸업`,promotedYear:y,section:""}:promoBody(next,y)]);
    }
    const first=!liveRuns(promoRec(t)).length; // 그해 첫 등반일 때만 담임을 비운다 (뒤늦게 온 학생 등반 때 새 담임을 지우지 않게)
    const failed=await applyMoves(list,(d,n)=>prog(d,n,"올리는 중…"));
    const done=moves.filter(m=>!failed.includes(m.id));

    const runs=runsOfRec(promoRec(t)).concat(done.length?[{id:"r"+Date.now(),at:new Date().toISOString(),count:done.length,moves:done,undone:false,...(Object.keys(hr).length?{hr}:{})}]:[]);
    const rec=recOf(t,y,runs);

    toast(failed.length?`${plan.length-failed.length}명 등반, ${failed.length}명은 저장하지 못했어요. 다시 누르면 남은 학생만 올라가요`:`${TEAMS[t].short} ${plan.length}명 등반을 마쳤어요`);
  });
}
function openUndoPromotion(t){

  const runRow=x=>{

function render(){

  renderTeams();
  {const tt=document.querySelector('[data-tab="talent"]');if(tt)tt.hidden=!talentOn();if(S.tab==="talent"&&!talentOn())S.tab="check";}
  {const pt=document.querySelector('[data-tab="prenew"]');if(pt)pt.hidden=!preNewOn();if(S.tab==="prenew"&&!preNewOn())S.tab="check";}
  /* 보조교사: 일정 탭만 */
  {const sub=isSub();document.querySelectorAll("nav.tabs button").forEach(b=>{const k=b.dataset.tab;if(k==="schedule")return;if(sub)b.hidden=true;else if(k!=="talent"&&k!=="prenew")b.hidden=false});if(sub)S.tab="schedule"}

  v.innerHTML=S.tab==="schedule"?renderSchedule():S.tab==="check"?renderCheck():S.tab==="roster"?renderRoster():S.tab==="stats"?renderStats():S.tab==="talent"?renderTalent():S.tab==="prenew"?renderPreNew():renderBday();

}

    svg.setAttribute("viewBox",`${z.x} ${z.y} ${z.w} ${h}`);svg.style.touchAction=z.w<W-.5?"none":"pan-y";const il=svg.querySelector(".bm-il");if(il)il.style.display=z.w<W-.5?"none":"";
    const s=W/z.w,VH=H,sc=p=>[(p.x-z.x)*s,(p.y-z.y)*s],seen=pins.filter(p=>{const [a,b]=sc(p);return a>=-4&&a<=W+4&&b>=-4&&b<=VH+4}),boxes=seen.map(p=>{const [a,b]=sc(p);return[a-7,b-7,a+7,b+7]});
    if(il&&il.dataset.ilx&&z.w>=W-.5){const a=+il.dataset.ilx,b=+il.dataset.ily;boxes.push([a-10,b-10,a+74,b+20])}
    const hit=b=>boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]);
    pins.forEach(p=>{p.hit.setAttribute("r",15/s);p.dot.setAttribute("r",(p.on?7:4.5)/s);p.dot.style.strokeWidth=1.5/s;p.t.style.fontSize=11.5/s+"px";p.t.style.strokeWidth=3/s+"px";p.t.style.display="none"});
    seen.forEach(p=>{const [a,b]=sc(p),w=p.t.textContent.length*11.5+2;
      const c=[[a+8,b+4,"start",a+7,b-7,a+8+w,b+7],[a-8,b+4,"end",a-8-w,b-7,a-7,b+7],[a,b-9,"middle",a-w/2,b-22,a+w/2,b-8],[a,b+18,"middle",a-w/2,b+7,a+w/2,b+21]].concat([-30,-16,16,30].flatMap(o=>[[a+8,b+4+o,"start",a+7,b-7+o,a+8+w,b+7+o],[a-8,b+4+o,"end",a-8-w,b-7+o,a-7,b+7+o]]));
      const ok=c.filter(o=>o[3]>=1&&o[5]<=W-1&&o[4]>=1&&o[6]<=VH-1),t=ok.find(o=>!hit(o.slice(3)))||(v.k==="all"?null:ok[0]);
      if(!t&&!p.on)return;const u=t||c[0];boxes.push(u.slice(3));p.t.style.display="";p.t.setAttribute("x",z.x+u[0]/s);p.t.setAttribute("y",z.y+u[1]/s);p.t.setAttribute("text-anchor",u[2])});

  const zoomAt=(f,px,py)=>{const nw=Math.min(W,Math.max(minW,z.w*f)),k=nw/z.w;z.x=px-(px-z.x)*k;z.y=py-(py-z.y)*k;z.w=nw;draw()};

  document.querySelectorAll("[data-mz]").forEach(b=>b.onclick=()=>{const k=b.dataset.mz;if(k==="fit"){z.x=0;z.y=0;z.w=W;draw();return}const p=pins.find(x=>x.on);if(p&&k==="in"){z.x=p.x-z.w/2;z.y=p.y-z.w*H/W/2}zoomAt(k==="in"?.6:1/.6,z.x+z.w/2,z.y+z.w*H/W/2)});

    const dx=e.clientX-o[0],dy=e.clientY-o[1];if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;if(z.w>=W-.5)return;

};

/* ---------- 게임 판 ---------- */
function newGame(){
  const ks=shuf(Object.keys(G).flatMap(k=>[k,k,k,k]));
  let gi=0;const cells=[];
  for(let i=0;i<24;i++)cells.push(CORNER[i]||{t:"game",k:ks[gi],p:PLACES[gi++]});
  B={v:2,lv:CFG.lv,turns:TURNS,round:1,cur:0,cells,phase:"roll",dice:[1,1],used:{},pending:null,msg:"",
    players:[{color:COLORS[0],pos:0,score:0,skip:false}]};
  save();
}
function openOv(){
  const ov=document.createElement("div");ov.className="overlay bm-ov";V.ov=ov;document.body.appendChild(ov);
  const mo=new MutationObserver(()=>{if(!ov.isConnected){mo.disconnect();stopAll();if(V.ov===ov)V.ov=null;if(S.view==="bible")render()}});
  mo.observe(document.body,{childList:true});
  ov.addEventListener("click",onAct);
}
function openBoard(){if(live())return;A=B;openOv();resume()}
function openSolo(k){
  if(live())return;
  A={solo:true,lv:CFG.lv,used:SOLO[CFG.lv],phase:"intro",pending:{k,m:1,p:""},cur:0,players:[{color:COLORS[0],score:0}]};
  openOv();intro();
}
function resume(){
  drawBoard();
  if(B.phase==="move")land();
  else if(B.phase==="intro")intro();
  else if(B.phase==="end")drawEnd();
}
function onAct(e){
  const b=e.target.closest("[data-bm]");if(!b)return;
  const a=b.dataset.bm;
  if(a==="exit")V.ov.remove();
  else if(a==="roll")roll();
  else if(a==="next")nextTurn();
  else if(a==="start")startMini();
  else if(a==="again"){stopAll();A.phase="intro";startMini()}
  else if(a==="board"){stopAll();drawBoard()}
  else if(a==="done"){B=null;A=null;save();V.ov.remove()}
}
function cellRC(i){if(i<=6)return[6-i,0];if(i<=12)return[0,i-6];if(i<=18)return[i-12,6];return[6,24-i]}
const tokStyle=(pi,pos)=>{const [r,c]=cellRC(pos),dx=.74,dy=.28;return `left:${(c+dx)/7*100}%;top:${(r+dy)/7*100}%`};
const pips=n=>({0:[],1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]})[n].map(p=>`<i style="grid-area:${Math.ceil(p/3)}/${(p-1)%3+1}"></i>`).join("");
function midHtml(){
  const p=curP();
  const dice=`<div class="bm-dice"><div id="bmD1">${pips(B.dice[0])}</div><div id="bmD2">${pips(B.dice[1]??1)}</div></div>`;
  if(B.phase==="next")return `<p class="bm-msg">${esc(B.msg)}</p>${dice}<button type="button" class="btn primary" data-bm="next">다음으로</button>`;
  return `<p class="bm-msg" id="bmMsg"><b>${Math.min(B.round,B.turns)}라운드</b>${B.msg?`<br><small>${esc(B.msg)}</small>`:""}</p>${dice}<button type="button" class="btn primary" data-bm="roll" id="bmRoll">주사위 굴리기</button>`;
}
function scoreHtml(){const p=curP();return `<div class="bm-sc on">점수 <b class="num">${p.score}</b>${p.skip?" 🏜️":""}</div>`}
function drawBoard(){
  const cells=B.cells.map((c,i)=>{const [r,co]=cellRC(i);
    return `<div class="bm-cell ${c.t==="game"?"bm-k-"+c.k:"bm-corner"}" style="grid-row:${r+1};grid-column:${co+1}"><span>${c.t==="game"?G[c.k].i:c.i}</span><em>${esc(c.p)}</em></div>`}).join("");
  V.ov.innerHTML=`<div class="bm-wrap"><div class="bm-top"><button type="button" class="btn" data-bm="exit">나가기</button><b>${BOARD_NAME}</b><span class="num">${LV[B.lv].n} ${Math.min(B.round,B.turns)}/${B.turns}</span></div>
    <div class="bm-scores" id="bmScores">${scoreHtml()}</div>
    <div class="bm-board" id="bmBoard">${cells}<div class="bm-mid" id="bmMid">${midHtml()}</div>
    ${B.players.map((p,i)=>`<div class="bm-tok" id="bmTok${i}" style="${tokStyle(i,p.pos)};background:${p.color}"></div>`).join("")}</div></div>`;
}
function roll(){
  if(B.phase!=="roll")return;
  let d1=0,d2=0;while(!d1&&!d2){d1=rnd(4);d2=rnd(4)} /* 0,0은 나오지 않아요 */
  const sum=d1+d2,p=curP(),from=p.pos,to=(from+sum)%24,passed=from+sum>=24;
  p.pos=to;if(passed)p.score+=10;
  B.dice=[d1,d2];B.phase="move";B.passed=passed;B.msg="";save();
  const btn=q("#bmRoll");if(btn)btn.disabled=true;
  const a=q("#bmD1"),b=q("#bmD2");a.parentNode.classList.add("spin");let n=0;
  const id=every(80,()=>{a.innerHTML=pips(rnd(4));b.innerHTML=pips(rnd(4));if(++n<9)return;
    clearInterval(id);V.t.delete(id);a.innerHTML=pips(d1);b.innerHTML=pips(d2);a.parentNode.classList.remove("spin");
    const msg=q("#bmMsg");if(msg)msg.innerHTML=`<b>${sum}칸</b> 이동`;
    let step=0;const tok=q("#bmTok"+B.cur);
    const walk=()=>{if(step>=sum)return after(280,land);step++;tok.setAttribute("style",tokStyle(B.cur,(from+step)%24)+";background:"+p.color);after(170,walk)};
    after(300,walk)});
}
function land(){
  const p=curP(),c=B.cells[p.pos],pre=B.passed?"출발을 지나 +10점! ":"";B.passed=false;
  const fin=m=>{B.msg=pre+m;B.phase="next";save();drawBoard()};
  if(c.t==="game"){B.pending={k:c.k,m:1,p:c.p,pre};B.phase="intro";save();drawBoard();intro()}
  else if(c.t==="lot"){const ks=Object.keys(G);B.pending={k:ks[rnd(ks.length)],m:2,p:c.p,pre};B.phase="intro";save();drawBoard();intro()}
  else if(c.t==="start"){p.score+=10;fin("출발 칸에 딱 멈췄어요! +10점 더")}
  else if(c.t==="rest"){p.skip=true;fin("광야에 들어섰어요. 다음 라운드는 쉬어요")}
  else{p.score+=20;fin("은혜의 샘! +20점")}
}
function nextTurn(){
  if(B.phase!=="next")return;
  B.msg="";
  const notes=[];
  for(;;){
    B.cur++;if(B.cur>=B.players.length){B.cur=0;B.round++}
    if(B.round>B.turns){B.phase="end";save();drawBoard();drawEnd();return}
    const p=curP();if(!p.skip)break;
    p.skip=false;notes.push("광야에서 한 라운드 쉬었어요");
  }
  B.msg=notes.join(" · ");B.phase="roll";save();drawBoard();
}
function stageOpen(title){
  const old=q(".bm-stage");if(old)old.remove();
  const s=document.createElement("div");s.className="bm-stage";
  s.innerHTML=`<div class="bm-sh"><button type="button" class="btn" data-bm="exit" aria-label="나가기">✕</button><b>${title}</b><span id="bmInfo" class="num"></span></div><div class="bm-sb" id="bmSb"></div>`;
  V.ov.appendChild(s);return s.querySelector("#bmSb");
}
function intro(){
  const d=A.pending,g=G[d.k];
  const el=stageOpen(g.i+" "+g.n);
  el.innerHTML=`<div class="bm-card"><div class="bm-emoji">${g.i}</div><p class="muted">${A.solo?LV[A.lv].n:`${esc(d.pre||"")}${esc(d.p)} 칸${d.m>1?" · 점수 2배":""}`}</p><h3>${g.n}</h3><p>${g.r}</p><button type="button" class="btn primary bm-big" data-bm="start">시작하기</button></div>`;
}
function startMini(){
  if(A.phase!=="intro"||!A.pending)return;
  const k=A.pending.k,el=stageOpen(G[k].i+" "+G[k].n);
  ({quiz:()=>miniQuiz(el),race:()=>miniRace(el),map:()=>miniMap(el),type:()=>miniType(el),cross:()=>miniCross(el),twenty:()=>miniTwenty(el),shoot:()=>miniShoot(el)})[k]();
}
function finish(pts,note){
  stopAll();if(A.phase!=="intro")return;
  const d=A.pending,got=pts*d.m,g=G[d.k],face=got>=20?"🎉":got>0?"👏":"🙏";
  if(A.solo){A.phase="done";
    stageOpen(g.i+" "+g.n).innerHTML=`<div class="bm-card"><div class="bm-emoji">${face}</div><h3 class="num">${got}점</h3><p>${esc(note)}</p><div id="bmRk"></div><button type="button" class="btn primary bm-big" data-bm="again">다시 하기</button><button type="button" class="btn bm-big" data-bm="exit">목록으로</button></div>`;
    showRank(d.k,A.lv,got);return}
  const p=curP();p.score+=got;B.pending=null;B.phase="next";B.msg=`${g.n} +${got}점`;save();
  stageOpen(g.i+" "+g.n).innerHTML=`<div class="bm-card"><div class="bm-emoji">${face}</div><h3 class="num">+${got}점</h3><p>${esc(note)}${d.m>1?" (점수 2배)":""}</p><button type="button" class="btn primary bm-big" data-bm="board">판으로 돌아가기</button></div>`;
}
function drawEnd(){
  const p=curP(),el=stageOpen("🏆 게임 끝");
  el.innerHTML=`<div class="bm-card"><div class="bm-emoji">🏆</div><h3 class="num">${p.score}점</h3><p>${BOARD_NAME} ${LV[B.lv].n} 완주!</p><div id="bmRk"></div><button type="button" class="btn primary bm-big" data-bm="done">마치기</button></div>`;
  showRank("board",B.lv,p.score);
}
/* 점수를 서버에 올리고 그 게임·단계의 랭킹을 받아 교사 이름으로 보여 줘요 */
function showRank(k,lv,got){
  const box=q("#bmRk");if(!box)return;
  box.innerHTML=`<p class="muted">랭킹 불러오는 중…</p>`;
  const row=(rk,n,sc,me)=>`<div class="${me?"me":""}"><span class="num">${rk}</span>${esc(n)}<b class="num">${sc}점</b></div>`;
  call("gameScore",k,lv,got).then(r=>{
    if(!box.isConnected)return;
    const inTop=r.top.some(x=>x.n===r.name);
    box.innerHTML=`<h4>${k==="board"?BOARD_NAME:G[k].n} ${LV[lv].n} 랭킹</h4>${r.newBest?`<p class="bm-new">내 최고 기록!</p>`:""}
      <div class="bm-rank">${r.top.map(x=>row(x.r,x.n,x.s,x.n===r.name)).join("")}${inTop?"":row(r.rank,r.name,r.best,true)}</div>`;
  }).catch(()=>{if(box.isConnected)box.innerHTML=`<p class="muted">랭킹을 불러오지 못했어요. 이번 점수는 저장되지 않았어요.</p>`});
}
/* 같은 게임에서 문제가 되풀이되지 않게 쓴 번호를 기억해요 */
function pick(key,pool,n){
  let used=A.used[key]||[];let left=pool.map((_,i)=>i).filter(i=>!used.includes(i));
  if(left.length<n){used=[];left=pool.map((_,i)=>i)}
  const got=shuf(left).slice(0,n);A.used[key]=used.concat(got);save();return got.map(i=>pool[i]);
}

/* ---------- 성경퀴즈 · 넌센스 성경퀴즈 ---------- */
function miniQuiz(el){
  const L=LV[A.lv],[nq,nf]=A.solo?[3,2]:[2,1],items=shuf(pick("quiz",QUIZ[A.lv],nq).concat(pick("fun",FUN[A.lv],nf)));let i=0,pts=0,right=0;
  const ask=()=>{
    if(i>=items.length)return finish(pts,`${items.length}문제 가운데 ${right}문제를 맞혔어요`);
    const it=items[i],opts=shuf(it.slice(1,5)),t0=performance.now(),T=L.qt*1000;let over=false;
    el.innerHTML=`<div class="bm-q"><div class="bm-bar"><div id="bmBar"></div></div><p class="muted num">${i+1} / ${items.length}${FUN[A.lv].includes(it)?" · 😜 넌센스":""}</p><h3>${esc(it[0])}</h3>
      <div class="bm-opts">${opts.map((o,n)=>`<button type="button" data-o="${n}">${esc(o)}</button>`).join("")}</div><div id="bmAfter"></div></div>`;
    const bar=el.querySelector("#bmBar");
    const pickIt=o=>{if(over)return;over=true;clearInterval(id);V.t.delete(id);
      const rem=Math.max(0,1-(performance.now()-t0)/T),ok=o===it[1];
      if(ok){right++;pts+=10+(rem>.5?5:0)}
      el.querySelectorAll("[data-o]").forEach(b=>{const v=opts[+b.dataset.o];b.disabled=true;if(v===it[1])b.classList.add("ok");else if(v===o)b.classList.add("no")});
      el.querySelector("#bmAfter").innerHTML=`<p class="bm-note">${ok?"정답이에요!":o===null?"시간이 다 됐어요.":"아쉬워요."} ${esc(it[5])}</p><button type="button" class="btn primary bm-big" id="bmNext">${i+1<items.length?"다음 문제":"결과 보기"}</button>`;
      el.querySelector("#bmNext").onclick=()=>{i++;ask()}};
    el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>pickIt(opts[+b.dataset.o]));
    const id=every(100,()=>{const r=1-(performance.now()-t0)/T;bar.style.width=Math.max(0,r*100)+"%";if(r<=0)pickIt(null)});
  };
  ask();
}

/* ---------- 말씀레이싱 ---------- */
function miniRace(el){
  const L=LV[A.lv],[v]=pick("race",VERSE[A.lv],1),words=v[1].split(" "),K=Math.min(L.ck,words.length),chunks=[];
  for(let i=0;i<K;i++)chunks.push(words.slice(Math.floor(i*words.length/K),Math.floor((i+1)*words.length/K)).join(" "));
  const order=shuf(chunks.map((c,i)=>({c,i}))),T=K*L.rc*1000,t0=performance.now();let at=0,lock=0,over=false;
  el.innerHTML=`<div class="bm-q"><div class="bm-track"><div class="bm-lane"><span id="bmMe">🏎️</span></div><div class="bm-lane"><span id="bmFoe">🌪️</span></div></div>
    <p class="muted">${esc(v[0])}</p><p class="bm-verse" id="bmVerse">&nbsp;</p><div class="bm-chips">${order.map((o,n)=>`<button type="button" data-c="${n}">${esc(o.c)}</button>`).join("")}</div></div>`;
  const me=el.querySelector("#bmMe"),foe=el.querySelector("#bmFoe"),verse=el.querySelector("#bmVerse");
  const end=win=>{if(over)return;over=true;const left=Math.max(0,1-(performance.now()-t0)/T);
    if(win)finish(20+Math.round(left*10),"바람보다 먼저 도착했어요! "+v[0]);else finish(Math.round(15*at/K),`바람이 먼저 도착했어요. ${K}조각 가운데 ${at}조각을 놓았어요. ${v[0]}`)};
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    if(over||performance.now()<lock)return;
    const o=order[+b.dataset.c];
    if(o.c===chunks[at]){b.disabled=true;b.classList.add("ok");at++;verse.textContent=chunks.slice(0,at).join(" ");me.style.left=at/K*88+"%";if(at>=K)end(true)}
    else{lock=performance.now()+700;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),700);
      if(A.lv===1){const nx=[...el.querySelectorAll("[data-c]")].find(x=>!x.disabled&&order[+x.dataset.c].c===chunks[at]);if(nx)nx.classList.add("hint")}}
  });
  every(60,()=>{const r=(performance.now()-t0)/T;foe.style.left=Math.min(1,r)*88+"%";if(r>=1)end(false)});
}

/* ---------- 말씀타자 : 떨어지는 성경 낱말을 입력해서 없애요 ---------- */
function miniType(el){
  const P=LV[A.lv].ty,stage=el.parentNode;el.style.padding="0";el.style.overflow="hidden";

  const area=el.querySelector("#bmRain"),inp=el.querySelector("#bmTyI"),vv=window.visualViewport;
  /* 휴대폰 자판이 올라오면 보이는 높이에 맞춰 판을 줄여요 */
  const fit=()=>{if(vv){stage.style.bottom="auto";stage.style.height=vv.height+"px";stage.style.top=vv.offsetTop+"px"}};
  fit();if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);V.off.push(()=>{vv.removeEventListener("resize",fit);vv.removeEventListener("scroll",fit)})}
  let bag=[],live_=[],lives=3,time=45,spawn=.2,cleared=0,keys=0,tries=0,last=performance.now(),over=false,info="";
  const nextWord=()=>{for(let i=0;i<40;i++){if(!bag.length)bag=shuf(WORD[A.lv].map(x=>x[0]));const w=bag.pop();if(!live_.some(o=>o.w===w))return w}return bag.pop()};

    const room=Math.max(0,area.clientWidth-n.offsetWidth-12);n.style.left=6+Math.random()*room+"px";live_.push({w,n,y:-36})};
  const end=()=>{if(over)return;over=true;const acc=tries?Math.round(cleared/tries*100):0,tasu=Math.round(keys/Math.max(1,45-Math.max(0,time))*60);
    finish(Math.min(45,cleared*2+(lives>0?5:0)),`낱말 ${cleared}개 · ${tasu}타 · 정확도 ${acc}%${lives>0?" · 끝까지 버텨서 +5점!":""}`)};
  const mark=()=>{const v=inp.value.trim();live_.forEach(o=>o.n.classList.toggle("on",!!v&&o.w.startsWith(v)))};

    const hit=live_.filter(o=>o.w===v).sort((a,b)=>b.y-a.y)[0];

    else{inp.classList.add("no");setTimeout(()=>inp.classList.remove("no"),300)}
    mark()};
  inp.oninput=()=>{if(inp.value.endsWith(" "))shoot();else mark()};

  el.querySelector("#bmTyB").onpointerdown=e=>e.preventDefault();
  inp.focus();

    if(!live()||over)return;

    if(spawn<=0){spawn=P.gap*(1-Math.min(.35,(45-time)/130));add()}

    if(lives<=0||time<=0)return end();

/* ---------- 성경지도 찾기 : 표시가 이름 없이 나오고 알맞은 곳을 눌러요. 고급은 지명 없이 설명만 ---------- */
const MAP_LV={1:{v:["abraham","exodus","nativity","jesus"],pins:3},2:{v:["kingdom","exile","jesus","church"],pins:4},3:{v:["kingdom","church","paul1","paul2","paul3","rome","rev"],pins:6}};
function miniMap(el){

  const pins=(v,id)=>{const {P}=mapGeo(v),at=k=>P(MAPP[k][2],MAPP[k][1]),far=(a,b)=>Math.hypot(at(a)[0]-at(b)[0],at(a)[1]-at(b)[1])>=34,got=[id];

/* ---------- 가로세로 낱말퀴즈 : 낱말을 겹쳐 판을 그때그때 만들어요 ---------- */
function cwBuild(pool,n,maxW){
  const words=shuf(pool).sort((a,b)=>(b[0].length>2)-(a[0].length>2)),pl=[{w:words[0][0],c:words[0][1],r:0,col:0,d:0}],map=new Map();
  const key=(r,c)=>r+","+c,cells=p=>[...p.w].map((ch,i)=>[p.r+(p.d?i:0),p.col+(p.d?0:i),ch]);
  cells(pl[0]).forEach(([r,c,ch])=>map.set(key(r,c),ch));
  const span=(extra)=>{const rs=[],cs=[];map.forEach((_,k)=>{const [r,c]=k.split(",").map(Number);rs.push(r);cs.push(c)});extra.forEach(([r,c])=>{rs.push(r);cs.push(c)});return[Math.max(...rs)-Math.min(...rs)+1,Math.max(...cs)-Math.min(...cs)+1]};
  const fits=p=>{const cs=cells(p),[dr,dc]=p.d?[1,0]:[0,1];let cross=0;
    const s=[p.r-dr,p.col-dc],e=[p.r+dr*p.w.length,p.col+dc*p.w.length];if(map.has(key(...s))||map.has(key(...e)))return 0;
    for(const [r,c,ch] of cs){const h=map.get(key(r,c));
      if(h!==undefined){if(h!==ch)return 0;cross++;continue}
      if(map.has(key(r+dc,c+dr))||map.has(key(r-dc,c-dr)))return 0}
    if(!cross)return 0;const [H,W]=span(cs);return H<=maxW&&W<=maxW?cross:0};
  const rest=words.slice(1);
  for(let more=true;more&&pl.length<n;){more=false;
    for(let i=0;i<rest.length&&pl.length<n;i++){const [w,c]=rest[i];let best=null;
      for(const o of pl)[...o.w].forEach((ch,oi)=>[...w].forEach((x,wi)=>{if(x!==ch)return;
        const d=o.d?0:1,r=o.r+(o.d?oi:0)-(d?wi:0),col=o.col+(o.d?0:oi)-(d?0:wi),p={w,c,r,col,d},s=fits(p);
        if(s&&(!best||s>best.s))best={p,s}}));
      if(best){pl.push(best.p);cells(best.p).forEach(([r,c2,ch])=>map.set(key(r,c2),ch));rest.splice(i--,1);more=true}
    }
  }
  return{pl,map};
}
function cwMake(pool,n){let best=null;for(let i=0;i<60;i++){const g=cwBuild(pool,n,9);if(!best||g.pl.length>best.pl.length)best=g;if(best.pl.length>=n)break}return best}
function miniCross(el){
  const L=LV[A.lv],{pl,map}=cwMake(WORD[A.lv],L.cw);
  let r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;map.forEach((_,k)=>{const [r,c]=k.split(",").map(Number);r0=Math.min(r0,r);c0=Math.min(c0,c);r1=Math.max(r1,r);c1=Math.max(c1,c)});
  const H=r1-r0+1,W=c1-c0+1,num=new Map();let no=0;
  pl.slice().sort((a,b)=>a.r-b.r||a.col-b.col).forEach(p=>{const k=p.r+","+p.col;if(!num.has(k))num.set(k,++no);p.no=num.get(k)});
  const at=p=>[...p.w].map((_,i)=>(p.r+(p.d?i:0))+","+(p.col+(p.d?0:i)));
  let sel=pl[0],T=L.cwT*1000,t0=performance.now(),over=false;
  let grid="";for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const k=r+","+c;grid+=map.has(k)?`<div class="bm-cc" data-k="${k}">${num.has(k)?`<sup>${num.get(k)}</sup>`:""}<span></span></div>`:`<div></div>`}
  const clue=d=>pl.filter(p=>p.d===d).sort((a,b)=>a.no-b.no).map(p=>`<button type="button" data-w="${pl.indexOf(p)}"><b class="num">${p.no}</b> ${esc(p.c)} <small class="num">(${p.w.length}글자)</small></button>`).join("");
  el.innerHTML=`<div class="bm-q bm-cw"><div class="bm-bar"><div id="bmBar"></div></div>
    <div class="bm-grid" style="grid-template-columns:repeat(${W},minmax(0,38px))">${grid}</div>
    <form class="bm-in" id="bmCwF"><input id="bmCwI" autocomplete="off" aria-label="낱말 입력"><button type="submit" class="btn primary">넣기</button></form>
    <div class="bm-clues"><h4>가로</h4>${clue(0)}<h4>세로</h4>${clue(1)}</div><button type="button" class="btn" id="bmCwEnd">그만하고 채점</button></div>`;
  const inp=el.querySelector("#bmCwI"),bar=el.querySelector("#bmBar");
  const paint=()=>{el.querySelectorAll(".bm-cc").forEach(x=>x.classList.remove("sel"));if(sel)at(sel).forEach(k=>el.querySelector(`[data-k="${k}"]`).classList.add("sel"));
    el.querySelectorAll("[data-w]").forEach(b=>{const p=pl[+b.dataset.w];b.classList.toggle("on",p===sel);b.classList.toggle("ok",!!p.ok)});
    inp.placeholder=sel?`${sel.no}번 ${sel.d?"세로":"가로"} ${sel.w.length}글자`:"";inp.value=""};
  const end=()=>{if(over)return;over=true;const ok=pl.filter(p=>p.ok).length,all=ok===pl.length,left=Math.max(0,T-(performance.now()-t0))/1000;
    finish(Math.min(45,ok*5+(all?10+Math.floor(left/15):0)),`${pl.length}낱말 가운데 ${ok}개를 찾았어요`+(all?" 완성 보너스!":""))};
  el.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const p=pl[+b.dataset.w];if(p.ok)return;sel=p;paint();inp.focus()});
  el.querySelectorAll(".bm-cc").forEach(x=>x.onclick=()=>{const hit=pl.filter(p=>!p.ok&&at(p).includes(x.dataset.k));if(!hit.length)return;sel=hit[(hit.indexOf(sel)+1)%hit.length];paint();inp.focus()});
  el.querySelector("#bmCwEnd").onclick=end;
  el.querySelector("#bmCwF").onsubmit=e=>{e.preventDefault();if(!sel||over)return;
    const v=inp.value.replace(/\s/g,"");if(!v)return;
    if(v===sel.w){sel.ok=true;at(sel).forEach((k,i)=>{const c=el.querySelector(`[data-k="${k}"]`);c.querySelector("span").textContent=sel.w[i];c.classList.add("ok")});
      sel=pl.find(p=>!p.ok)||null;paint();if(!sel)end()}
    else{T-=5000;inp.value="";inp.classList.add("no");setTimeout(()=>inp.classList.remove("no"),400)}};
  paint();
  every(200,()=>{const r=1-(performance.now()-t0)/T;bar.style.width=Math.max(0,r*100)+"%";q("#bmInfo").textContent=Math.max(0,Math.ceil(r*T/1000))+"초";if(r<=0)end()});
}

/* ---------- 스무고개 ---------- */
function miniTwenty(el){
  const [a]=pick("twenty",TWENTY[A.lv],1),kind=a[1][0],all=[1,2,3].flatMap(l=>TWENTY[l]).filter(x=>x[1][0]===kind&&x[0]!==a[0]);

}

/* ---------- 말씀 슈팅 : 빛의 배로 유혹의 낱말을 물리쳐요 ---------- */
const FOES=["욕심","미움","거짓","교만","시기","불평","게으름","두려움","다툼","원망"];
function miniShoot(el){
  el.innerHTML=`<canvas id="bmCv" class="bm-cv" aria-label="말씀 슈팅 게임 화면"></canvas>`;
  const cv=el.querySelector("#bmCv"),x=cv.getContext("2d"),P=LV[A.lv].sh,dpr=Math.min(2,window.devicePixelRatio||1);
  let w=0,h=0;const size=()=>{w=el.clientWidth;h=el.clientHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)};size();
  addEventListener("resize",size);V.off.push(()=>removeEventListener("resize",size));
  const stars=Array.from({length:40},()=>[Math.random(),Math.random(),.3+Math.random()*.7]);
  const ship={x:w/2},SY=()=>h-46;let bul=[],foes=[],shots=[],items=[],kills=0,lives=3,time=40,inv=0,fireT=0,pow=0,dropT=1.5,diveT=P.dive,t=0,last=performance.now(),over=false,keyV=0,info="";
  const wave=()=>{const cols=w<420?4:6,gap=(w-16)/cols;for(let r=0;r<3;r++)for(let c=0;c<cols;c++)foes.push({hx:8+gap*(c+.5),hy:34+r*38,x:8+gap*(c+.5),y:-40-r*40,l:FOES[rnd(FOES.length)],hp:r===0?P.hp:1,dv:0})};
  wave();
  const move=e=>{const b=cv.getBoundingClientRect();ship.x=Math.max(20,Math.min(w-20,e.clientX-b.left));e.preventDefault()};
  cv.addEventListener("pointerdown",move);cv.addEventListener("pointermove",move);
  const key=e=>{if(e.key==="ArrowLeft")keyV=e.type==="keydown"?-1:0;if(e.key==="ArrowRight")keyV=e.type==="keydown"?1:0};
  addEventListener("keydown",key);addEventListener("keyup",key);V.off.push(()=>{removeEventListener("keydown",key);removeEventListener("keyup",key)});
  const end=()=>{if(over)return;over=true;finish(Math.min(45,kills*2+(lives>0?5:0)),`유혹 ${kills}개를 물리쳤어요${lives>0?" 끝까지 버텨서 +5점!":""}`)};
  const hit=()=>{if(inv>0)return;lives--;inv=1.5;if(lives<=0)end()};
  const pill=(f)=>{x.font="700 13px sans-serif";const tw=x.measureText(f.l).width+16;f.w=tw;return tw};
  const frame=now=>{
    if(!live()||over)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;time-=dt;inv=Math.max(0,inv-dt);pow=Math.max(0,pow-dt);fireT-=dt;dropT-=dt;diveT-=dt;
    ship.x=Math.max(20,Math.min(w-20,ship.x+keyV*320*dt));
    if(fireT<=0){fireT=.24;const y=SY()-16;if(pow>0)bul.push({x:ship.x-9,y},{x:ship.x+9,y});else bul.push({x:ship.x,y})}
    if(!foes.length)wave();
    const sway=Math.sin(t*.9)*Math.min(26,w*.05);
    foes.forEach(f=>{if(f.dv){f.y+=(P.sp*1.9)*dt;f.x+=Math.sign(ship.x-f.x)*P.sp*.7*dt;if(f.y>h+30){f.dv=0;f.y=-30}}
      else{f.x+=(f.hx+sway-f.x)*Math.min(1,dt*5);f.y+=(f.hy-f.y)*Math.min(1,dt*2.4)}});
    if(diveT<=0&&foes.length){diveT=P.dive;foes[rnd(foes.length)].dv=1}
    if(dropT<=0&&foes.length){dropT=P.drop;const f=foes[rnd(foes.length)];if(f.y>0)shots.push({x:f.x,y:f.y+12})}
    bul.forEach(b=>b.y-=460*dt);shots.forEach(s=>s.y+=(P.sp+110)*dt);items.forEach(i=>i.y+=110*dt);
    bul=bul.filter(b=>{if(b.y<-10)return false;
      for(const f of foes){const fw=(f.w||50)/2;if(Math.abs(b.x-f.x)<fw&&Math.abs(b.y-f.y)<14){if(--f.hp<=0){f.dead=1;kills++;if(Math.random()<.12)items.push({x:f.x,y:f.y})}return false}}return true});
    foes=foes.filter(f=>!f.dead);
    const sy=SY();
    shots=shots.filter(s=>{if(s.y>h+10)return false;if(Math.abs(s.x-ship.x)<16&&Math.abs(s.y-sy)<16){hit();return false}return true});
    foes.forEach(f=>{if(f.dv&&Math.abs(f.x-ship.x)<(f.w||50)/2+12&&Math.abs(f.y-sy)<22){hit();f.dv=0;f.y=-30}});
    items=items.filter(i=>{if(i.y>h+10)return false;if(Math.abs(i.x-ship.x)<24&&Math.abs(i.y-sy)<24){pow=6;return false}return true});
    if(over)return;if(time<=0)return end();
    const s=`${"❤️".repeat(lives)} ${Math.ceil(time)}초 · ${kills}`;if(s!==info){info=s;q("#bmInfo").textContent=s}
    x.fillStyle="#0E1630";x.fillRect(0,0,w,h);
    x.fillStyle="#fff";stars.forEach(a=>{x.globalAlpha=a[2]*.7;x.fillRect(a[0]*w,(a[1]*h+t*30*a[2])%h,2,2)});x.globalAlpha=1;
    foes.forEach(f=>{const tw=pill(f);x.fillStyle=f.hp>1?"#A23BC4":f.dv?"#E0562F":"#5B4BC4";x.beginPath();x.roundRect(f.x-tw/2,f.y-13,tw,26,9);x.fill();x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";x.fillText(f.l,f.x,f.y+1)});
    x.fillStyle="#FFE27A";bul.forEach(b=>x.fillRect(b.x-2,b.y-8,4,14));
    x.fillStyle="#FF7A7A";shots.forEach(a=>{x.beginPath();x.arc(a.x,a.y,5,0,7);x.fill()});
    x.font="20px sans-serif";x.textAlign="center";items.forEach(i=>x.fillText("📜",i.x,i.y));
    if(!(inv>0&&Math.floor(t*10)%2)){x.fillStyle=pow>0?"#FFE27A":"#8FE3FF";x.beginPath();x.moveTo(ship.x,sy-18);x.lineTo(ship.x+17,sy+14);x.lineTo(ship.x,sy+7);x.lineTo(ship.x-17,sy+14);x.closePath();x.fill();x.fillStyle="#fff";x.beginPath();x.arc(ship.x,sy-1,4,0,7);x.fill()}
    V.raf=requestAnimationFrame(frame);
  };
  V.raf=requestAnimationFrame(frame);
}
})();

    navigator.serviceWorker.addEventListener('controllerchange', function () { if (had) refresh(); });
  }
  // 2) 버전 확인: version.json 은 캐시를 거치지 않고 읽어서, 내 화면과 다르면 새로 불러옴
  function busy() { return !!document.querySelector('.overlay') || (typeof pending !== 'undefined' && pending > 0); }
  function clearAll() {
    return (window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve()).catch(function () {});
  }
  function refresh(build) {
    if (busy()) { setTimeout(function () { refresh(build); }, 3000); return; }
    var n = Number(sessionStorage.getItem('ya-reload') || 0);
    if (n >= 3) return;                       // 무한 새로고침 방지
    sessionStorage.setItem('ya-reload', String(n + 1));
    clearAll().then(function () { location.replace(location.pathname + '?v=' + (build || Date.now())); });
  }
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.build && j.build !== BUILD) refresh(j.build); else sessionStorage.removeItem('ya-reload');
    }).catch(function () {});
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(function () { if (!document.hidden) check(); }, 60000);
})();
</script>
</body>
