.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px;transition:background .15s,border-color .15s}
.row.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.row.tch{background:var(--teacher);border-color:var(--teacher-line)}
.row.tch.on{background:var(--teacher);border-color:var(--teacher-line)}
.check{flex:none;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--ground);display:grid;place-items:center}
.check svg{width:26px;height:26px;opacity:0;transform:scale(.6);transition:.15s}
.row.on .check{background:var(--accent);border-color:var(--accent)}
.row.on .check svg{opacity:1;transform:none;stroke:var(--accent-ink)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;background:none;border:0;text-align:left;padding:0}
.who b{font-size:16px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who span{font-size:12px;color:var(--muted)}
.tag{white-space:nowrap;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;line-height:18px}
.tag.new{background:var(--new-soft);color:var(--new)}
.tag.bd{background:var(--gold-soft);color:var(--gold-ink)}
.tag.role{background:var(--sunk);color:var(--muted)}
.talent{flex:none;display:flex;align-items:center;gap:2px;background:var(--gold-soft);border-radius:10px;padding:2px 2px 2px 4px}
.talent-box{flex:none}
.talent .arrows{display:flex;flex-direction:column;gap:2px}
.talent .arrows button{width:34px;height:22px;border:0;background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold-ink);border-radius:6px;display:grid;place-items:center;padding:0}
.talent .arrows svg{width:16px;height:16px}
.talent .arrows button:active{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.talent input{width:40px;height:46px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:center;font-weight:700;color:var(--gold-ink);font-size:16px;padding:0;-moz-appearance:textfield}
.talent input::-webkit-outer-spin-button,.talent input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.talent input:focus{background:var(--surface);border-color:var(--gold);outline:none}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);overflow:hidden}
.avatar.lg{width:96px;height:96px;font-size:24px}
.who-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:0}
.photo-field{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.photo-field .btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-field input[type=file]{display:none}
.photo-field{border:2px dashed transparent;border-radius:14px;padding:4px;transition:border-color .15s,background .15s}
.photo-field.drop{border-color:var(--accent);background:var(--sunk)}
.photo-field .drop-hint{flex-basis:100%;font-size:12px}
.drop-zone{border:2px dashed transparent;border-radius:14px;transition:border-color .15s,background .15s}
.drop-zone.drop{border-color:var(--accent);background:var(--sunk)}
@media (hover:none){.drop-hint{display:none}}
.sheet-head{display:flex;align-items:center;gap:14px}
.check-box{flex:none;display:flex;flex-direction:column;align-items:center}
.check-lbl{font-size:11px;color:var(--accent);text-align:center;margin-top:2px;font-weight:600}
.talent-lbl{font-size:11px;color:var(--gold-ink);text-align:center;margin-top:-2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;margin-top:14px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:56px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.att-sum>div{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.att-sum .big{font-size:13px;line-height:1.4}
.att-sum .big em{font-size:12px}
/* 부서별 출석 현황 한 줄: 학생 빨강, 교사 파랑 */
.dept-line{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.dept-line em{font-style:normal;font-weight:500;opacity:.8}
.dept-line .st{color:#C62828}
.dept-line .tc{color:#1565C0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dept-line .st{color:#FF8A80}:root:not([data-theme="light"]) .dept-line .tc{color:#8AB4F8}}
:root[data-theme="dark"] .dept-line .st{color:#FF8A80}
:root[data-theme="dark"] .dept-line .tc{color:#8AB4F8}
td.num em{font-style:normal;color:var(--muted);font-size:12px}
.savebar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;margin:16px 0 4px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.savebar.sb-hide{display:none}
.savebar .sb-tx{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.savebar .sb-tx small{font-size:12px;color:var(--muted)}
.savebar .sb-ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;background:var(--accent)}
.savebar .sb-ic.err{background:var(--danger)}
.savebar .sb-ic.wait{background:none;border:2px dashed var(--accent)}
.savebar .sb-ic.spin{background:none;border:3px solid var(--line);border-top-color:var(--accent);animation:sbspin .8s linear infinite}
@keyframes sbspin{to{transform:rotate(360deg)}}
.savebar.sb-float{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;transform:translateX(-50%);z-index:30;margin:0;width:min(440px,calc(100% - 32px));transition:opacity .3s;animation:sbin .25s ease-out}
.savebar.sb-float.sb-out{opacity:0}
@keyframes sbin{from{opacity:0;transform:translate(-50%,-8px)}}
.pstat-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pstat-ctl .seg{margin-top:0;flex:1;min-width:220px}
.sd-list{display:flex;flex-direction:column;gap:6px}
.sd{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sd>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.sd>summary::-webkit-details-marker{display:none}
.sd>summary::before{content:"›";flex:none;color:var(--muted);font-size:18px;line-height:1;transition:transform .15s}
.sd[open]>summary::before{transform:rotate(90deg)}
.sd-l{min-width:72px;font-weight:600;display:flex;flex-direction:column}
.sd-l small,.sd-v small{font-size:11px;font-weight:500;color:var(--muted)}
.sd-bar{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.sd-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.sd-v{min-width:88px;text-align:right;display:flex;flex-direction:column}
.sd-v.one{display:block;white-space:nowrap;min-width:0}
.pp-tal{font-size:13px;color:var(--muted);padding:2px 0 4px}
.pp-tal b{color:var(--gold-ink)}
.pp-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;border-top:1px solid var(--line);padding-top:6px}
.pp-l{min-width:52px;font-weight:600;font-size:13px}
.pp-v{font-size:13px;font-weight:600;white-space:nowrap}
.pp-v em{font-style:normal;font-weight:500;font-size:12px;color:var(--muted)}
.pp-row .sd-names{margin-top:0}
.pp-days{font-size:13px;color:var(--muted);white-space:nowrap}
.pp-days b{color:var(--ink)}
.pp-gh{font-weight:700;font-size:14px;margin:10px 2px 2px}
/* 개인별 누적 제목줄: 좁으면 버튼들이 제목 아래 줄로 내려가요 */
.pp-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pp-head h2.sec{flex:1 0 auto;margin-bottom:0}
.pp-head .btn{flex:none}
.pp-sort{flex:none;display:flex;gap:4px}
.dept-stat td small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.dept-stat td em{font-style:normal;font-size:11px;color:var(--muted)}
.dept-stat th,.dept-stat td{white-space:nowrap;padding:8px 4px}
.dept-stat td b{font-size:15px}
.dept-stat tr.sum td{border-top:2px solid var(--line);border-bottom:0}
.dept-stat tr.grade td{padding-block:5px;font-size:13px;color:var(--muted)}
.dept-stat tr.grade td b{font-size:13px;color:var(--ink)}
.dept-stat tr.grade td:first-child{padding-left:10px}
.dept-stat tr.dr td{border-top:2px solid var(--line)}
.dept-stat .dg-btn{display:block;margin-top:4px;height:26px;padding:0 8px;font-size:11px;border-radius:8px}
/* 개인별 누적 제목줄 버튼은 모두 같은 크기 */
.pp-b{height:32px;padding:0 11px;font-size:13px;border-radius:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.pp-b[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.pp-gh:first-child{margin-top:0}
.att-tg{cursor:pointer}
.att-tg:hover{border-color:var(--accent)}
.tal-sum{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tal-sum .who{display:flex;flex-direction:column;min-width:0}
.tal-sum .who span{font-size:12px;color:var(--muted)}
.tal-tot{flex:none;min-width:56px;text-align:right;font-size:18px;font-weight:700}
.tal-chip b{color:var(--gold-ink);margin-left:3px}
.tal-ed{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 9px}
.tal-ed input{width:44px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--gold-ink);font-weight:700;text-align:center;font-size:13px;padding:0 2px}
.tal-ed input::placeholder{color:var(--muted);font-weight:400}

.sd-v.one em{font-style:normal;font-size:12px;color:var(--muted)}
.sd-in{padding:0 10px 10px 26px;display:flex;flex-direction:column;gap:6px}
.sd.day{border-radius:10px;background:var(--ground)}
.sd.day>summary{padding:8px 10px}
.sd-g{border-top:1px solid var(--line);padding-top:6px}
.sd-gh{display:flex;justify-content:space-between;font-size:13px}
.sd-names{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.sd-nm{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
.sd-nm.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.sd-ab{font-size:11px;color:var(--muted);margin:0 2px 0 6px}
h2.sec{font-family:var(--display);font-weight:400;font-size:19px;margin:22px 0 10px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
details.fold>summary h2.sec{margin-bottom:6px}
details.fold .fold-sum{font-size:13px;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"펼치기 ▾";margin-left:auto;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
details.fold[open]>summary::after{content:"접기 ▴"}
details.staff-grp{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 10px}
details.staff-grp>summary{align-items:center}
details.staff-grp>summary b{font-size:15px}
details.staff-grp .admin-list{margin-top:6px}
details.staff-grp .admin-row b{min-width:0}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;margin-top:14px}
.seg button{word-break:keep-all;flex:1;border:0;background:none;border-radius:8px;padding:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
:root[data-style] .seg button[aria-pressed="true"]{color:var(--accent);box-shadow:var(--shadow),inset 0 0 0 1px var(--accent)}

.brand .left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand h1{min-width:0;line-height:1.25} /* 제목이 길면 '교육팀 출석부'만 아랫줄로 (.tw 덩어리는 끊지 않음) */
.brand h1 .tw{white-space:nowrap;display:inline-block}
.brand small{flex:none;white-space:nowrap}
.brand-right{display:flex;align-items:center;gap:8px;flex:none}
.hdr-refresh{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
:root[data-style="navy"] header.top .hdr-refresh,:root[data-style="sunset"] header.top .hdr-refresh{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:var(--hdr-ink)}
.brand small.tight{font-size:10px;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center;flex:none}
.home-intro{margin-block:18px 12px}
.home-intro .yr{font-family:var(--display);font-size:30px;line-height:1.1;margin:0}
.home-intro p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dept-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.dept-grid{grid-template-columns:1fr}}
.dept{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 14px;min-height:132px;box-shadow:var(--shadow)}
.dept .top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.dept .name{font-family:var(--display);font-size:clamp(16px,4.6vw,20px);line-height:1.2;word-break:keep-all}
.dept .range{font-size:13px;color:var(--muted)}
.dept .stat{margin-top:auto;word-break:keep-all;font-size:13px;font-weight:600;color:var(--accent)}
.dept .lock{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:99px;padding:1px 7px}
/* 담임·팀 관리자처럼 부서 카드가 하나뿐이면 휴대폰 폭에 꽉 차고 화면 높이에 맞춰 크게 */
.dept-grid.solo{grid-template-columns:1fr}
.dept-grid.solo .dept{min-height:clamp(170px,34vh,300px);padding:22px 20px;gap:10px}
.dept-grid.solo .dept .name{font-size:clamp(24px,7vw,32px)}
.dept-grid.solo .dept .range{font-size:15px}
.dept-grid.solo .dept .stat{font-size:clamp(16px,4.6vw,20px)}
.dept-grid.solo .dept .lock{font-size:13px;padding:3px 10px}
.lock-ic{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.admin-list{display:flex;flex-direction:column;padding:4px 14px}
.admin-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:0}
.admin-row b{min-width:92px}
.admin-row .code{flex:1;font-size:17px;font-weight:700;letter-spacing:.12em;min-width:80px}
.admin-row .code.none{letter-spacing:0;font-size:13px;font-weight:500;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin:8px 0 0}
.promo-card{display:flex;flex-direction:column;gap:10px}
.promo-card .line{font-size:14px}
.promo-card .btns{display:flex;gap:8px;flex-wrap:wrap}
.move-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:46vh;overflow:auto}
.move{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 10px;background:var(--ground);border-radius:10px}
.move .arrow{color:var(--muted)}
.move .n{margin-left:auto;font-weight:700}
.move .names{flex-basis:100%;font-size:13px;color:var(--muted);line-height:1.6;word-break:keep-all}
.move{flex-wrap:wrap}
.move .names .pname{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0;font-size:13px;color:var(--ink);cursor:pointer}
.move .names .pname.off{text-decoration:line-through;color:var(--muted);background:transparent}
.move .names .pname small{font-size:11px;color:var(--muted)}
.move.skip{background:transparent;border:1px dashed var(--line)}
details.promo-team{border-bottom:1px solid var(--line);padding:10px 0}
details.promo-team>summary{align-items:center;gap:8px}
details.promo-team .move-list{max-height:none;margin-top:6px}
.run{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font:inherit;color:inherit;padding:10px 12px;background:var(--ground);border:2px solid transparent;border-radius:12px;cursor:pointer}
.run[aria-pressed="true"]{border-color:var(--danger);background:var(--surface)}
.run:disabled{cursor:default;opacity:.6}
.run .h{display:flex;gap:8px;align-items:center;font-weight:600}
.run .h .st{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.run .d{font-size:13px;color:var(--muted)}
.move.grad .to{color:var(--new);font-weight:600}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
body.home nav.tabs,body.home #datebar,body.home #chips{display:none}
body.home .app{padding-block-end:32px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[data-tab="prenew"]{letter-spacing:-.05em;min-width:0;font-size:10.5px}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,20,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pc-h{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form .name-sex{display:flex;gap:6px}
.form .name-sex input{flex:1;min-width:0}
.form .name-sex select{flex:none;width:72px;padding:0 6px}
.form input,.form select,.form textarea{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:0 10px;font-size:15px;font-weight:400;color:var(--ink)}
.form textarea{height:70px;padding:8px 10px;resize:vertical}
.form .inline{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.form .inline input{height:20px;width:20px}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.actions .spacer{flex:1}
.contact{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.contact div{display:flex;align-items:center;gap:8px;font-size:14px}
.contact .k{width:64px;color:var(--muted);font-size:12px;flex:none}
.contact .v{flex:1;user-select:text;word-break:break-all}

<body>

<script>
const TEAMS={
  infant:{label:"영아교육팀",short:"영아",unit:"영아",groups:[["0","0세"],["1","1세"],["2","2세"],["3","3세"],["4","4세"]]},
  toddler:{label:"유아교육팀",short:"유아",unit:"어린이",groups:[["5","5세"],["6","6세"],["7","7세"]]},
  youth:{label:"유소년교육팀",short:"유소년",unit:"학생",groups:[["1","1학년"],["2","2학년"],["3","3학년"],["4","4학년"],["5","5학년"],["6","6학년"]]},
  teen:{label:"중고등교육팀",short:"중고등",unit:"학생",groups:[["m1","중1"],["m2","중2"],["m3","중3"],["h1","고1"],["h2","고2"],["h3","고3"]]},
};
const teamOf=p=>p.team||"youth";
/* 영아교육팀은 나이와 관계없이 반을 편성해요. 반 목록은 부서 설정(classes), 나이는 사람마다 따로(age).
   아이는 늘 어느 한 반에 속해요(미배정 없음). 유아·유소년·중고등은 반 = 나이·학년 그대로. */
const FLEX_TEAMS=["infant"];
const isFlex=t=>FLEX_TEAMS.includes(t);
/* 반 이름: 영아는 반 목록 전체를, 나머지 부서는 나이·학년 순서는 그대로 두고 이름만 바꿔요 */
const classesOf=t=>{const c=((S.settings||{})[t]||{}).classes;
  if(isFlex(t))return Array.isArray(c)&&c.length?c:TEAMS[t].groups;
  const nm=Object.fromEntries((Array.isArray(c)?c:[]).filter(x=>x&&x[1]));return TEAMS[t].groups.map(([k,l])=>[k,nm[k]||l])};
const groupsOf=t=>[...classesOf(t),["T","교사"]];
const pickGroupsOf=groupsOf;
const isClassKey=g=>g!=="T";
const ageLabel=p=>isFlex(teamOf(p))&&p.group!=="T"&&p.age?(Object.fromEntries(TEAMS[teamOf(p)].groups.concat(...FLEX_TEAMS.map(t=>TEAMS[t].groups)))[p.age]||""):"";
let GROUPS,GL;
const S={promos:new Map(),view:"home",depts:new Map(),codes:{},isAdmin:false,people:new Map(),att:new Map(),classes:new Map(),date:null,team:"youth",group:"all",tab:"check",q:"",statMode:"year",db:null,ready:false,editable:true,fold:{}};
function setTeam(t){S.team=TEAMS[t]?t:"youth";const sc=(S.scope||{})[S.team];GROUPS=groupsOf(S.team).filter(([g])=>!sc||sc.level!=="grade"||sc.grades.includes(g));GL=Object.fromEntries(groupsOf(S.team));if(S.group!=="all"&&!GROUPS.some(x=>x[0]===S.group))S.group="all"}
const TL=(t=S.team)=>((S.settings||{})[t]||{}).talentLabel||"달란트";
const talentOn=(t=S.team)=>((S.settings||{})[t]||{}).talent!==false;
/* 대표전화: 학생마다 [수정]에서 체크한 번호. 정하지 않았으면 영아·유아는 부모, 그 외는 학생 */

const bdMD=v=>{const m=String(v||"").trim().match(/^(?:(\d{2})\/)?(\d{1,2})\/(\d{1,2})$/);return m?[Number(m[2]),Number(m[3])]:null};

function lunarMap(y){
  if(lunarCache[y])return lunarCache[y];

    const f=new Intl.DateTimeFormat("en-u-ca-chinese",{month:"numeric",day:"numeric"});
    for(let d=new Date(y,0,1);d.getFullYear()===y;d.setDate(d.getDate()+1)){

      f.formatToParts(d).forEach(x=>{if(x.type==="month")lm=x.value;else if(x.type==="day")ld=x.value});
      if(!lm||/[^0-9]/.test(lm))continue; /* 윤달은 건너뜀 */
      const key=Number(lm)+"/"+Number(ld);
      (map[key]=map[key]||[]).push([d.getMonth()+1,d.getDate()]);
    }
  }catch(_){}
  return lunarCache[y]=map;
}

/* 출석 체크는 바로 보내지 않고 잠깐(0.8초) 모았다가 한 번에 보낸다. 20명을 눌러도 서버 요청은 한두 번.

function sendAtt(k){

    <div class="check-box"><button class="check" data-toggle="${p.id}" aria-pressed="${on}" aria-label="${esc(p.name)} 출석">${CHECK_SVG}</button><div class="check-lbl">출석</div></div>
    ${p.group==="T"||!talentOn()?"":`<div class="talent-box"><div class="talent"><input class="num" type="number" inputmode="numeric" min="0" step="1" data-tv="${p.id}" value="${t}" aria-label="${esc(p.name)} 달란트"><div class="arrows"><button data-t="${p.id}" data-d="1" aria-label="${esc(p.name)} 달란트 1 올리기">${UP_SVG}</button><button data-t="${p.id}" data-d="-1" aria-label="${esc(p.name)} 달란트 1 내리기">${DOWN_SVG}</button></div></div><div class="talent-lbl">달란트</div></div>`}

const classKey=g=>S.team+"_"+g;
const SEC_LETTERS=["A","B","C","D"];
const classOfKey=(t,g)=>S.classes.get(t+"_"+g)||{};
const classOf=g=>classOfKey(S.team,g);
const sectionsOfKey=(t,g)=>{const x=classOfKey(t,g).sections;return Array.isArray(x)?x.filter(v=>SEC_LETTERS.includes(v)):[]};
const sectionsOf=g=>sectionsOfKey(S.team,g);
const secOf=p=>{const ss=sectionsOfKey(teamOf(p),p.group);return ss.includes(p.section)?p.section:""};
const classLabel=p=>(GL[p.group]||"")+(secOf(p)?" "+secOf(p)+"반":"");
/* 나이로 반을 나누는 부서(영아)는 명단에 "3세 · 2세반"처럼 나이 먼저, 반 이름 뒤에 "반" */
const banOf=p=>{const l=classLabel(p);return ageLabel(p)&&l&&!/반$/.test(l)?l+"반":l};
const ageClassLabel=p=>[ageLabel(p),banOf(p)].filter(Boolean).join(" · ");
const homeroomOf=(g,sec)=>{const c=classOf(g);return (sec?(c.teachers||{})[sec]:c.teacher)||""};
/* 담임은 여러 명일 수 있어요. 저장은 "김은혜, 박요한"처럼 쉼표로 이어서 한 칸에 */
/* 같은 사람 이름인지 (띄어쓰기 무시). '정나리(정미유)'는 '정나리'·'정미유'와도 같아요 */
const nameMatch=(a,b)=>{const s=String(a||"").replace(/\s+/g,""),t=String(b||"").replace(/\s+/g,"");if(!t)return false;if(s===t)return true;const m=s.match(/^(.+?)[(（](.+?)[)）]$/);return !!m&&(m[1]===t||m[2]===t)};
const sameName=(a,b)=>nameMatch(a,b)||nameMatch(b,a);
const hrNames=v=>[...new Set(String(v||"").split(/\s*[,，]\s*/).map(x=>x.trim()).filter(Boolean))];
const hrJoin=list=>hrNames(list.join(",")).join(", ");
const hrText=v=>hrNames(v).join("·");
function homeroomBar(g,sec=""){
  const t=hrNames(homeroomOf(g,sec));
  return `<div class="homeroom"><span class="lbl">${sec?sec+"반 담임":"담임"}</span>${t.length?`<b>${t.map(esc).join("·")} 선생님</b>`:`<span class="none">아직 지정 안 됨</span>`}<span class="spacer"></span>${S.editable&&myScope().level==="dept"?`<button data-homeroom="${g}" data-sec="${sec}">${t.length?"추가·삭제":"지정"}</button>`:""}</div>`;
}
/* 담임 선생님 출결: 각 반 담임 칸 바로 아래에서 체크 (교사 명단에 같은 이름이 있을 때) */
const hrPeople=(g,sec)=>{const ns=hrNames(homeroomOf(g,sec));return ns.length?[...S.people.values()].filter(p=>teamOf(p)===S.team&&p.group==="T"&&p.active!==false&&ns.some(n=>sameName(n,p.name))):[]};
const hrRows=(g,sec="")=>{const ts=hrPeople(g,sec);return ts.length?`<div class="list" style="margin-bottom:8px">${ts.map(personRow).join("")}</div>`:""};
function saveClass(g,patch){
  const key=classKey(g);const body={...classOf(g),team:S.team,group:g,...patch};
  S.classes.set(key,body);render();
  if(S.db)enqueue("classes/"+key,()=>S.db.doc("classes/"+key).set(body));
}
function openHomeroom(g,sec=""){
  if(myScope().level!=="dept"){toast("담임 지정은 팀 관리자 이상만 할 수 있어요");return}
  let list=hrNames(homeroomOf(g,sec));const orig=hrJoin(list);
  const names=[...S.people.values()].filter(p=>teamOf(p)===S.team&&p.group==="T"&&p.active!==false).map(p=>p.name).sort((a,b)=>a.localeCompare(b,"ko"));
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<form class="sheet" role="dialog" aria-label="담임교사 추가·삭제"><h3>${TEAMS[S.team].short} ${GL[g]}${sec?" "+sec+"반":""} 담임</h3>
    <p class="muted" style="margin:0;font-size:14px">담임을 여러 명 둘 수 있어요. 이름 옆 ×를 누르면 빠져요.</p>
    <div class="hr-list" id="hr-cur"></div>
    <div class="form"><label class="full">담임 추가<span class="hr-add"><input id="f-homeroom" list="hr-list" placeholder="예: 김은혜" autocomplete="off"><button type="button" class="btn" data-add>추가</button></span></label>
    <datalist id="hr-list">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>
    <div id="hr-pick"></div>
    <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button class="btn primary" type="submit">저장</button></div></form>`;
  document.body.appendChild(ov);
  const inp=ov.querySelector("#f-homeroom");
  const draw=()=>{
    ov.querySelector("#hr-cur").innerHTML=list.length?list.map((n,i)=>`<span class="hr-chip">${esc(n)}<button type="button" data-del="${i}" aria-label="${esc(n)} 담임에서 빼기">×</button></span>`).join(""):`<span class="muted" style="font-size:13px">아직 담임이 없어요</span>`;
    const rest=names.filter(n=>!list.includes(n));
    ov.querySelector("#hr-pick").innerHTML=rest.length?`<p class="muted" style="font-size:12px;margin:8px 0 4px">교사 명단에서 누르면 바로 추가돼요</p><div class="hr-list">${rest.map(n=>`<button type="button" class="hr-chip pick" data-pick="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>`:"";
  };
  const add=v=>{const add=hrNames(v).filter(n=>!list.includes(n));if(add.length){list=list.concat(add);draw()}inp.value="";inp.focus()};
  draw();
  ov.addEventListener("click",e=>{
    if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
    const d=e.target.closest("[data-del]");if(d){list.splice(Number(d.dataset.del),1);draw();return}
    const pk=e.target.closest("[data-pick]");if(pk)return add(pk.dataset.pick);
    if(e.target.closest("[data-add]"))add(inp.value);
  });
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add(inp.value)}});
  ov.querySelector("form").addEventListener("submit",e=>{e.preventDefault();
    if(inp.value.trim())add(inp.value);
    const v=hrJoin(list);ov.remove();if(v===orig)return;
    saveClass(g,sec?{teachers:{...(classOf(g).teachers||{}),[sec]:v}}:{teacher:v});
    toast(v?`담임을 저장했어요 (${list.length}명)`:"담임을 모두 지웠어요");
  });
  inp.focus();
}
function openSplit(g){
  if(!S.editable)return;
  if(myScope().level!=="dept"){toast("분반은 팀 관리자 이상만 할 수 있어요");return}
  const studs=activePeople(g);
  const cur=sectionsOf(g);let n=Math.max(1,cur.length);
  const assign=new Map(studs.map(p=>[p.id,secOf(p)]));
  const letters=()=>n>1?SEC_LETTERS.slice(0,n):[];
  const balance=all=>{const L=letters();if(!L.length){studs.forEach(p=>assign.set(p.id,""));return}
    const cnt=Object.fromEntries(L.map(l=>[l,0]));
    if(!all)studs.forEach(p=>{const v=assign.get(p.id);if(L.includes(v))cnt[v]++;else assign.set(p.id,"")});
    else studs.forEach(p=>assign.set(p.id,""));
    [...studs].sort((a,b)=>a.name.localeCompare(b.name,"ko")).forEach(p=>{if(assign.get(p.id))return;const l=L.reduce((m,x)=>cnt[x]<cnt[m]?x:m,L[0]);assign.set(p.id,l);cnt[l]++});
  };
  const ov=document.createElement("div");ov.className="overlay";
  const draw=()=>{
    const L=letters();const count=l=>studs.filter(p=>assign.get(p.id)===l).length;
    ov.innerHTML=`<div class="sheet" role="dialog" aria-label="분반 나누기와 합치기"><h3>${TEAMS[S.team].short} ${GL[g]} 분반</h3>
      <p class="muted" style="margin:0;font-size:14px">반 개수를 고르고 학생마다 반을 정하세요. "1개 반"을 고르면 분반을 합쳐요.</p>
      <div class="split-n">${[1,2,3,4].map(k=>`<button type="button" data-n="${k}" aria-pressed="${n===k}">${k===1?"1개 반":SEC_LETTERS.slice(0,k).join("·")}</button>`).join("")}</div>
      ${L.length?`<div class="split-tools"><button type="button" class="btn" data-balance>가나다순 골고루 나누기</button><span class="muted num">${L.map(l=>`${l}반 ${count(l)}명`).join(" · ")}</span></div>`:""}
      <div class="assign">${studs.length?studs.map(p=>`<div class="ar">${avatar(p)}<span class="nm">${esc(p.name)}</span>${L.length?`<span class="opts">${L.map(l=>`<button type="button" data-as="${p.id}" data-l="${l}" aria-pressed="${assign.get(p.id)===l}" aria-label="${esc(p.name)} ${l}반">${l}</button>`).join("")}</span>`:`<span class="muted" style="font-size:12px">한 반</span>`}</div>`).join(""):`<p class="muted">이 학년에 학생이 없어요.</p>`}</div>
      <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button type="button" class="btn primary" data-save>저장</button></div></div>`;
  };
  if(n>1)balance(false);
  draw();document.body.appendChild(ov);
  ov.addEventListener("click",async e=>{
    if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
    const nb=e.target.closest("[data-n]");if(nb){n=Number(nb.dataset.n);balance(false);draw();return}
    if(e.target.closest("[data-balance]")){balance(true);draw();return}
    const as=e.target.closest("[data-as]");if(as){assign.set(as.dataset.as,as.dataset.l);draw();return}
    if(!e.target.closest("[data-save]"))return;
    const L=letters();const c=classOf(g);
    const teachers=Object.fromEntries(Object.entries(c.teachers||{}).filter(([k])=>L.includes(k)));
    const patch={sections:L,teachers};
    if(!L.length)patch.teacher=hrJoin([c.teacher||""].concat(Object.values(c.teachers||{})));
    if(L.length&&!teachers.A&&c.teacher)patch.teachers={...teachers,A:c.teacher};
    const changed=studs.filter(p=>(p.section||"")!==(assign.get(p.id)||""));
    ov.remove();saveClass(g,patch);
    for(const p of changed){const v=assign.get(p.id)||"";S.people.set(p.id,{...S.people.get(p.id),section:v});
      if(S.db)enqueue("people/"+p.id,()=>writeWithRetry(S.db.doc("people/"+p.id),{section:v}));}
    render();toast(L.length?`${GL[g]}을(를) ${L.join("·")}반으로 나눴어요`:`${GL[g]} 분반을 합쳤어요`);
  });
}
function storeTCode(pid,code){S._tcodes={...(S._tcodes||{}),[pid]:code};if(S.remember===false)return;let c={};try{c=JSON.parse(localStorage.getItem("ya-tcodes")||"{}")}catch(_){}c[pid]=code;try{localStorage.setItem("ya-tcodes",JSON.stringify(c))}catch(_){}}

/* 사람 수정 창에서 연락처·주소를 같이 고칠 수 있는지 (주소록 권한이 있는 학년만) */

const telOf=v=>String(v||"").replace(/[^0-9+]/g,"");
function bookLine(k,v,tel,rep){
  const ic=rep==="rep"?`<span class="rep-tel on" title="대표전화" aria-label="대표전화">${PHONE_SVG}</span>`:rep?`<button class="rep-tel" data-rep-set="${esc(rep)}" data-rep-v="${k==="부모"?"parent":"student"}" title="대표전화로 정하기" aria-label="${k} 번호를 대표전화로 정하기">${PHONE_SVG}</button>`:"";
  if(!v)return `<div class="bline">${ic}<span class="k">${k}</span><span class="v none">없음</span></div>`;
  return `<div class="bline">${ic}<span class="k">${k}</span><span class="v num">${esc(v)}</span>${tel&&telOf(v).length>=9?`<a href="tel:${telOf(v)}">전화</a>`:""}<button data-copy-c="${esc(v)}">복사</button></div>`;
}
/* 생일은 MM/DD로 맞춰 저장해요 (3/5, 0305, 3월 5일 → 03/05) */
function normBirthday(v){
  v=String(v||"").trim();if(!v)return "";
  let y="",mm,dd,m;
  if(m=v.match(/^(\d{4}|\d{2})\s*[\/.\-년]\s*(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})\s*일?$/)||v.match(/^(\d{4})(\d{2})(\d{2})$/)||v.match(/^(\d{2})(\d{2})(\d{2})$/)){y=m[1].slice(-2);mm=Number(m[2]);dd=Number(m[3])}
  else if(m=v.match(/^(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})\s*일?$/)||v.match(/^(\d{2})(\d{2})$/)){mm=Number(m[1]);dd=Number(m[2])}
  else return null;
  if(mm<1||mm>12||dd<1||dd>31)return null;
  return (y?y+"/":"")+String(mm).padStart(2,"0")+"/"+String(dd).padStart(2,"0");
}
/* 명단 위쪽: 연락처를 볼 수 있는 범위와 잠긴 학년의 [번호 입력] (예전 주소록 탭) */

/* ---------- v2 도구 ---------- */
const MEMO_SVG='<svg viewBox="0 0 24 24"><path d="M5 4.5h11l3 3v12H5z"/><path d="M8 10h8M8 13.5h8M8 17h5"/></svg>';
const PHONE_SVG='<svg viewBox="0 0 24 24"><path d="M6.6 3.5h3l1.4 4-2 1.5a11 11 0 005.9 5.9l1.5-2 4 1.4v3a2 2 0 01-2.2 2A16 16 0 014.6 5.7a2 2 0 012-2.2z"/></svg>';
const rosterModeOf=p=>p.active!==false?"active":(p.leftType==="졸업"?"grad":"removed");

function telOfP(p){const B=S.book;if(!B||B.team!==S.team||!B.contacts)return "";const c=B.contacts[p.id]||{};const v=(p.group==="T"?[c.phone]:studentNums(c,S.team,p.group,p.id).map(x=>x[1])).map(x=>String(x||"").replace(/[^0-9+]/g,"")).find(x=>x.length>=9);return v||""}
function relabel(){
  const tb=document.querySelector('[data-tab="talent"]');
  if(tb){const n=[...tb.childNodes].filter(x=>x.nodeType===3).pop();if(n)n.nodeValue=S.view==="dept"?TL():"달란트"}
  const L=TL();if(L==="달란트"||S.view!=="dept")return;
  const root=document.querySelector("#view");if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode()))if(n.nodeValue.indexOf("달란트")>=0)n.nodeValue=n.nodeValue.split("달란트").join(L);
  root.querySelectorAll("[aria-label]").forEach(el=>{const a=el.getAttribute("aria-label");if(a.indexOf("달란트")>=0)el.setAttribute("aria-label",a.split("달란트").join(L))});
}
function alertBox(title,msg){

  ov.innerHTML=`<div class="sheet" role="alertdialog" aria-label="${esc(title)}" style="border-radius:20px;max-width:420px;margin:0 16px"><h3>${esc(title)}</h3><p style="margin:6px 0 0;font-size:15px;line-height:1.6">${esc(msg)}</p><div class="actions"><div class="spacer"></div><button class="btn primary" data-close>확인</button></div></div>`;
  document.body.appendChild(ov);ov.querySelector("[data-close]").focus();
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest("[data-close]"))ov.remove()});
}

function uploadRoster(){
  loadXLSX().catch(()=>{}); // 파일을 고르는 동안 엑셀 도구를 미리 받아 둔다
  const inp=document.createElement("input");inp.type="file";inp.accept=".xlsx,.xls,.csv";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;if(!await needXLSX())return;
    let rows=[];
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});const ws=wb.Sheets["명단"]||wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{defval:"",raw:false});
      const pick=(r,...keys)=>{for(const k of Object.keys(r)){const kk=k.replace(/\s/g,"");if(keys.some(x=>kk.indexOf(x)===0))return String(r[k]).trim()}return ""};
      rows=raw.map(r=>({name:pick(r,"이름"),gender:pick(r,"성별"),group:pick(r,"반","학년"),age:pick(r,"나이"),section:pick(r,"분반"),birthday:pick(r,"생일"),lunar:pick(r,"음력"),role:pick(r,"직분"),isNew:pick(r,"새친구"),note:pick(r,"메모"),guardian:pick(r,"보호자"),parentPhone:pick(r,"부모"),phone:pick(r,"연락처","학생연락처","학생"),address:pick(r,"주소")})).filter(r=>r.name||r.group);
      rows.forEach(r=>{const bd=normBirthday(r.birthday);if(bd!==null)r.birthday=bd;else r.badBd=true;const sx=r.gender.toUpperCase();r.gender=/^(남|남자|M|MALE)$/.test(sx)?"남":/^(여|여자|F|FEMALE)$/.test(sx)?"여":(r.gender?(r.badSex=true,r.gender):"")});
    }catch(e){alertBox("파일을 읽지 못했어요","엑셀(.xlsx) 파일인지 확인해 주세요. ("+e.message+")");return}
    if(!rows.length){alertBox("올릴 내용이 없어요","'명단' 시트에 이름과 반을 적었는지 확인해 주세요.");return}
    const C=await ensureContacts();
    const F=["name","gender","group","age","section","birthday","lunar","role","isNew","note","guardian","parentPhone","phone","address"];
    const ph=x=>[x.phone,x.parentPhone].map(v=>String(v||"").replace(/[^0-9]/g,"")).filter(v=>v.length>=7);
    const sh=(a,b)=>a.some(v=>b.includes(v));
    const sbd=(a,b)=>{a=String(a||"").trim();b=String(b||"").trim();if(!a||!b||a.slice(-5)!==b.slice(-5))return false;const ya=a.length>5?a.slice(0,2):"",yb=b.length>5?b.slice(0,2):"";return !ya||!yb||ya===yb};
    const key=x=>F.map(f=>String(x[f]==null?"":x[f]).replace(/\s/g,"")).join("\u0001");
    const sameR=(a,b)=>key(a)===key(b)||(!!a.name&&a.name===b.name&&sbd(a.birthday,b.birthday)&&sh(ph(a),ph(b)));
    const nBefore=rows.length;const merged=[];
    rows.forEach(r=>{const s=merged.find(u=>sameR(u,r));if(!s){merged.push({...r});return}F.forEach(f=>{if(String(r[f]==null?"":r[f]).trim()!=="")s[f]=r[f]})});
    rows=merged;const dupN=nBefore-rows.length;
    const mine=[...S.people.values()].filter(p=>teamOf(p)===S.team);
    const names=new Set(mine.map(p=>p.name+"|"+(GL[p.group]||"")));
    const upd=rows.filter(r=>mine.some(p=>p.name===r.name&&sbd(p.birthday,r.birthday)&&sh(ph(C[p.id]||{}),ph(r)))||names.has(r.name+"|"+String(r.group).replace(/\s/g,""))).length;
    const ov=document.createElement("div");ov.className="overlay";
    ov.innerHTML=`<div class="sheet" role="dialog" aria-label="엑셀 명단 올리기"><h3>${esc(TEAMS[S.team].label)} 명단 올리기</h3>
      <p style="margin:6px 0 0;font-size:15px">모두 <b>${rows.length}줄</b> · 새로 추가 약 <b>${rows.length-upd}명</b> · 고침 약 <b>${upd}명</b></p>
      ${dupN?`<p style="margin:6px 0 0;font-size:13px">이름·생일·연락처가 같은 중복 <b>${dupN}줄</b>은 한 사람으로 합쳐서 올려요.</p>`:""}
      ${rows.some(r=>r.badSex)?`<p class="err" style="font-size:13px;margin:6px 0 0">성별은 남 또는 여로 적어 주세요: ${rows.filter(r=>r.badSex).slice(0,5).map(r=>esc(r.name)+"("+esc(r.gender)+")").join(", ")}${rows.filter(r=>r.badSex).length>5?" …":""}. 이 줄들은 성별을 바꾸지 않아요.</p>`:""}
      ${rows.some(r=>r.badBd)?`<p class="err" style="font-size:13px;margin:6px 0 0">생일 형식이 15/03/15가 아닌 줄이 있어요: ${rows.filter(r=>r.badBd).slice(0,5).map(r=>esc(r.name)+"("+esc(r.birthday)+")").join(", ")}${rows.filter(r=>r.badBd).length>5?" …":""}. 그대로 저장되지만 생일 목록에는 안 나와요.</p>`:""}
      <p class="muted" style="font-size:13px;margin:6px 0 0">이름·생일·연락처가 같은 사람(없으면 이름과 반이 같은 사람)은 기존 정보 위에 덮어쓰고, 없으면 새로 추가해요. 성별·연락처·주소도 함께 저장돼요. 지우는 사람은 없어요.</p>
      <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button class="btn primary" id="impGo">적용</button></div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener("click",async e=>{
      if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
      const go=e.target.closest("#impGo");if(!go||go.disabled)return;go.disabled=true;go.textContent="적용 중…";
      try{const r=await tracked(call("importRoster",S.team,rows));ov.remove();S.book=null;await load();
        alertBox("명단을 적용했어요",`새로 추가 ${r.created}명, 고침 ${r.updated}명`+(r.duplicates?` · 같은 사람 중복 ${r.duplicates}줄은 하나로 합쳤어요`:"")+(r.skipped.length?` · 건너뜀 ${r.skipped.length}줄 (`+r.skipped.slice(0,5).map(x=>x.row+"번째 줄: "+x.reason).join(" / ")+(r.skipped.length>5?" …":"")+")":""))}
      catch(err){go.disabled=false;go.textContent="적용";alertBox("적용하지 못했어요",err.message)}
    });
  };
  inp.click();
}

      box.innerHTML=frame(`<div class="pv-doc" style="padding:14px 16px;font-size:14px;line-height:1.7">${r.value||"<p>(내용이 없어요)</p>"}</div>`)+`<p class="muted" style="font-size:12px;margin:6px 0 0">글꼴·쪽 나눔은 원본과 조금 다를 수 있어요.</p>`;
    }
    else box.innerHTML=`<p style="margin:0;font-size:14px">${ext==="hwp"||ext==="hwpx"?"한글(hwp) 파일은":ext==="pptx"||ext==="ppt"?"파워포인트 파일은":"이 형식("+esc(ext||"파일")+")은"} 앱에서 미리 볼 수 없어요. [내려받기]로 받아서 열어 주세요.</p><p class="muted" style="font-size:12px;margin:6px 0 0">미리 보고 싶다면 PDF로 저장해서 올려 주세요.</p>`;
  }catch(e){box.innerHTML=`<p style="margin:0;font-size:14px">미리보기를 만들지 못했어요. [내려받기]로 받아서 열어 주세요.</p><p class="muted" style="font-size:12px;margin:6px 0 0">${esc(e.message||"")}</p>`}
}
function openEvent(id,date){
  const E=S.ev;if(!E)return;const ev=id?E.list.find(x=>x.id===id):{id:"",date:date||S.date,title:"",memo:"",files:[]};if(!ev)return;
  const edit=E.canEdit;const ov=document.createElement("div");ov.className="overlay";
  const draw=()=>{ov.innerHTML=`<form class="sheet" role="dialog" aria-label="일정"><h3>${ev.id?(edit?"일정 수정":"일정"):"새 일정"}</h3>
    <div class="form"><label class="full">제목<input id="f-evt" maxlength="80" value="${esc(ev.title)}" ${edit?"":"readonly"} required></label>
    <label class="full">날짜<input id="f-evd" type="date" value="${esc(ev.date)}" ${edit?"":"readonly"} required></label>
    <label class="full">내용<textarea id="f-evm" maxlength="2000" ${edit?"":"readonly"}>${esc(ev.memo)}</textarea></label></div>
    <div class="actions">${ev.id&&edit?`<button type="button" class="btn danger" data-evdel>일정 삭제</button>`:""}<div class="spacer"></div><button type="button" class="btn" data-close>${edit?"취소":"닫기"}</button>${edit?`<button class="btn primary" type="submit">저장</button>`:""}</div></form>`};
  draw();document.body.appendChild(ov);
  ov.addEventListener("click",async e=>{
    if(e.target===ov||e.target.closest("[data-close]")){ov.remove();wrC("ya-ev-"+S.team,S.ev);render();return}
    const dv=e.target.closest("[data-evdel]");if(dv){if(!dv.dataset.armed){dv.dataset.armed="1";dv.textContent="한 번 더 누르면 삭제";return}
      try{await tracked(call("deleteEvent",S.team,ev.id));E.list=E.list.filter(y=>y.id!==ev.id);wrC("ya-ev-"+S.team,E);ov.remove();render();toast("일정을 삭제했어요")}catch(err){alertBox("삭제하지 못했어요",err.message)}}
  });
  ov.addEventListener("submit",async e=>{
    e.preventDefault();if(!edit)return;
    const body={id:ev.id,title:ov.querySelector("#f-evt").value.trim(),date:ov.querySelector("#f-evd").value,memo:ov.querySelector("#f-evm").value};
    if(!body.title||!body.date)return;
    try{const saved=await tracked(call("saveEvent",S.team,body));const i=E.list.findIndex(y=>y.id===saved.id);if(i>=0)E.list[i]=saved;else E.list.push(saved);
      Object.assign(ev,saved);S.calSel=saved.date;S.calMonth=saved.date.slice(0,7);wrC("ya-ev-"+S.team,E);toast("일정을 저장했어요");ov.remove();render()}
    catch(err){alertBox("저장하지 못했어요",err.message)}
  });
}

function openGuide(){
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet guide" role="dialog" aria-label="${guideName()}"><h3>${guideName()}</h3>
    <p class="muted" style="margin:0;font-size:14px">처음에는 팀 관리자에게 받은 <b>QR</b>로 들어오고, 바로 <b>내 비밀번호</b>를 만들어요. 그 뒤로는 앱을 열기만 하면 들어와요. 들어가면 <b>우리 반</b>만 보여요.</p>
    <h4>1. 앱 설치 (처음 한 번)</h4><ol><li>주소 <b class="guide-url">팀 관리자가 알려 준 앱 주소</b> 를 열어요. 팀 관리자가 보낸 링크를 눌러도 돼요.</li><li><b>안드로이드</b>: 크롬 오른쪽 위 <b>︙</b> → <b>홈 화면에 추가</b> (또는 앱 설치)</li><li><b>아이폰</b>: 사파리 아래 <b>공유 버튼</b> → <b>홈 화면에 추가</b></li><li>카카오톡에서 QR 링크를 누르면 <b>크롬(사파리)이 저절로 열려요</b>. 안 열리면 <b>⋮ → 다른 브라우저로 열기</b>를 눌러요.</li><li><b>아이폰 홈 화면 앱</b>은 사파리와 로그인이 따로예요. 홈 화면 앱에서는 [로그인]에서 이름과 내 비밀번호로 들어오거나, [QR 링크로 로그인]에 받은 링크를 붙여 넣어요.</li></ol>
    <h4>2. 들어가기</h4><ol><li><b>처음</b>에는 팀 관리자에게 받은 <b>QR</b>을 휴대폰 <b>기본 카메라</b>로 찍어요(카카오톡으로 받은 링크를 눌러도 돼요). 바로 로그인되고 <b>내 비밀번호</b>를 만들라는 창이 떠요. 영문과 숫자를 섞어 6자리 이상으로 만들어 두세요.</li><li>그 뒤로는 앱을 <b>열기만 하면 바로</b> 들어와요. 선생님은 휴대폰·PC 상관없이 <b>기기 1대</b>만 쓸 수 있어요. 새 기기에서 로그인하면 전에 쓰던 기기는 저절로 로그아웃돼요.</li><li>휴대폰을 바꿨거나 브라우저 기록을 지웠다면 메인 화면의 <b>[로그인]</b>을 눌러 <b>이름</b>과 <b>내 비밀번호</b>를 넣어요. 비밀번호를 잊었으면 팀 관리자에게 초기화와 새 QR을 부탁하세요.</li><li><b>처음 로그인할 때는 10초쯤 걸릴 수 있어요.</b> 화면 위에 "확인 중… 잠시만 기다려 주세요"가 떠 있는 동안은 버튼을 다시 누르지 말고 기다려요.</li><li>제목 옆에 "담임 · 2학년"처럼 보이면 성공! 활동 기록에도 내 이름이 남아요.</li><li>교사 명단의 <b>내 이름은 직접 고칠 수 없어요</b>(로그인과 담임 반이 이름으로 정해져요). 이름이 틀렸으면 팀 관리자에게 고쳐 달라고 말씀해 주세요.</li></ol>
    <h4>2-1. 내 비밀번호</h4><ol><li>QR로 처음 들어오면 <b>"내 비밀번호를 만들어 주세요"</b> 창이 떠요. 새 비밀번호(영문+숫자 6자리 이상, 대소문자 구분 없음)를 두 번 적고 <b>[만들기]</b>를 눌러요.</li><li>[나중에]를 눌렀다면 앱을 열 때마다 다시 물어요. 메인 화면 <b>내 비밀번호</b> 칸의 <b>[내 비밀번호 만들기]</b>에서도 만들 수 있어요.</li><li>바꿀 때는 같은 곳의 <b>[내 비밀번호 변경]</b>. QR로 등록된 기기에서는 지금 비밀번호를 몰라도 새로 정할 수 있어요.</li><li>잊어버렸고 등록된 기기도 없으면 팀 관리자에게 <b>비밀번호 초기화</b>와 <b>새 QR</b>을 부탁하세요.</li></ol><h4>2-2. 보조교사 (반 담임이 아닌 선생님)</h4><ol><li>교사 명단에 이름이 있으면 반 담임이 아니어도 들어올 수 있어요. 들어오는 방법은 담임과 똑같아요: <b>QR</b>로 처음 들어오고 <b>내 비밀번호</b>를 만들어요.</li><li>보조교사는 <b>일정 탭만</b> 보여요. 일정과 자료실 파일은 볼 수만 있어요.</li><li>나중에 반 담임으로 배치되면 따로 할 일 없이 그 반이 저절로 열려요.</li><li>내 이름은 직접 고칠 수 없어요. 이름이 틀렸으면 팀 관리자에게 부탁하세요.</li></ol>
    <h4>3. 출결메모 (주일 출석)</h4><ol><li>위쪽 날짜가 오늘 주일인지 확인해요. ‹ › 로 다른 주일로 가요.</li><li><b>체크 칸</b>: 누르면 출석, 다시 누르면 취소</li><li><b>메모</b>: 결석 이유 적기 ("감기·아픔" 같은 버튼도 있어요)</li><li><b>전화</b>: 누르면 그 학생의 <b>대표전화</b>로 바로 걸려요. 대표전화는 학생마다 명단 [수정]에서 <b>[대표]</b>에 체크한 번호예요. 체크하지 않았으면 영아·유아부는 부모님, 유소년·중고등부는 학생 번호예요 (없으면 다른 번호). 컴퓨터에서는 번호 창이 떠요.</li><li>숫자 칸(달란트 등): ▲▼ 를 누르거나 숫자를 눌러 적어요. 달란트는 여기서만 줘요.</li><li><b>담임 선생님 출석</b>: 우리 반 담임 줄 바로 아래에 선생님 이름이 <b>연보라색 줄</b>로 나와요. 거기서 선생님 출석·메모도 체크해요. (교사 명단의 이름과 담임 이름이 같아야 나와요)</li><li><b>저장</b>: 따로 저장 버튼을 누르지 않아도 체크하면 자동으로 저장돼요. 화면 아래 <b>저장 막대</b>에서 "저장 대기 → 저장 중… → ✓ 모두 저장됨"을 확인하세요. 다 저장되면 막대는 잠깐 뒤 저절로 사라져요. 바로 보내려면 <b>[지금 저장]</b>, 인터넷이 끊겨 못 했으면 <b>[다시 저장]</b>을 눌러요.</li></ol>
    <h4>4. 명단 (연락처 포함)</h4><ol><li><b>[+ 사람 추가]</b>로 새 학생을 넣어요. 연락처·주소도 같이 적을 수 있어요.</li><li>이름을 누르면 보호자·부모 연락처와 주소가 보여요. <b>[전화]</b>, <b>[복사]</b>도 여기서.</li><li><b>[수정]</b>: 사진·반·생일·메모·연락처·주소를 한 창에서 위에서 아래로 차례대로 고쳐요. 컴퓨터에서는 사진 파일을 창 위로 <b>끌어다 놓아도</b> 돼요.</li><li><b>[삭제]</b>: 이름을 누른 창에서 눌러요. 한 번 더 눌러야 지워지고, 되돌릴 수 없어요.</li><li>사람 정보는 <b>명단 탭에서만</b> 고칠 수 있어요. 다른 탭에서는 보기만 해요.</li><li><b>대표전화</b>: [수정]에서 부모 연락처·학생 연락처 옆 <b>[대표]</b> 중 하나에 체크하고 저장해요. 출결메모의 <b>[전화]</b>를 누르면 그 번호로 바로 걸려요. 이름을 누른 창에서 전화기 아이콘을 눌러 바꿀 수도 있어요.</li><li>명단에서 <b>연보라색</b> 줄은 선생님이에요.</li><li>담임은 <b>우리 반</b> 학생의 연락처·주소만 볼 수 있어요.</li></ol>
    <h4>4-1. 통계 (출석 한눈에 보기)</h4><ol><li><b>기간별 학생 출석</b>: <b>[이번 주] [최근 한 달] [연도별]</b> 중 하나를 골라요. 이번 주는 펼치면 반별 출석·결석 명단이 바로 보이고, 최근 한 달·연도별은 기간 → 주일 → 반별 명단 순서로 펼쳐져요. 처음에는 최근 기간과 이번 주일만 펼쳐져 있어요.</li><li><b>개인별 누적</b>: 이름 옆에 <b>출석 34/42 (달란트 120개)</b>처럼 올해 출석/전체 주일 수와 달란트가 나와요. 이름을 펼치면 주일마다 출석(●)·결석(○)이 보여요(위에서 이번 주를 골라도 여기는 최근 한 달).</li><li><b>지난 출석 고치기</b>: 개인별 누적의 <b>●/○를 누르면</b> 그 주일 출석이 바뀌어요. 잘못 눌렀으면 한 번 더 누르면 돼요.</li><li><b>[ㄱㄴ순] [출석순] [학년별]</b>로 순서를 바꾸고, <b>[창 접기]</b>는 사람 칸만, <b>[모두 접기]</b>는 개인별 누적 전체를 접어요.</li><li><b>[엑셀로 받기]</b>: 개인·학년·전체와 <b>개인 일자별</b>(주일마다 O/-) 시트가 한 파일에 담겨요.</li><li>펼치고 접은 상태와 고른 탭·순서는 이 기기에 기억돼요.</li></ol>
    <h4>5. 생일 · 달란트</h4><ol><li><b>생일</b>: 이번 주·이번 달·다음 달 생일. 생일이 없는 사람은 맨 아래에 모여요. 음력 생일은 [수정]에서 "음력 생일"에 체크하면 그 해 양력 날짜로 바꿔 보여 줘요. 연도 없이 3/15처럼 날짜만 적어도 되고, 학생은 학년에 맞는 출생연도가 자동으로 붙어요(교사는 연도 없이 날짜만).</li><li><b>달란트</b>: <b>[사람별]</b>은 누적 순위예요. 이름을 펼치면 주일마다 받은 달란트 칸이 나오고, <b>숫자를 고치면 지난 주일 달란트도 바로 바뀌어요</b>(비우면 0). <b>[학년별]</b>은 반마다 합계·1인 평균·학생 순위예요.</li><li>이번 주 달란트는 지금처럼 출결메모에서 줘요.</li><li>달란트·생일·일정 엑셀은 <b>통계</b> 탭의 <b>[엑셀로 내보내기]</b> 파일에 들어 있어요.</li></ol>
    <h4>6. 출석 · 제적 · 졸업</h4><ol><li>명단 위쪽 <b>[출석] [제적] [졸업]</b> 을 눌러 나눠 봐요.</li><li>더 이상 안 나오는 학생: 이름 → [수정] → 상태를 <b>제적</b>으로. 졸업한 학생은 <b>졸업</b>으로.</li><li>제적·졸업 학생은 출석 명단에서 빠지지만 기록은 그대로 남아요.</li><li>다시 나오면 [제적] 목록에서 <b>[출석으로]</b>를 눌러요.</li></ol>
    <h4>7. 엑셀로 한 번에 (명단 · 연락처)</h4><ol><li>명단 탭 <b>엑셀</b> 줄의 <b>[양식 받기]</b>로 파일을 받아요. 지금 명단이 채워져 있어요.</li><li>'명단' 시트에 이름·반·생일·연락처·주소를 적어요. 생일은 15/03/15 처럼(연도 생략 가능). 빈 칸은 원래 값을 그대로 둬요.</li><li><b>[올리기]</b>로 파일을 고르고 확인. 이름·생일·연락처가 같은 사람은 같은 사람으로 보고 기존 정보 위에 덮어써요(없으면 이름과 반이 같은 사람). 없는 사람은 새로 들어가요.</li><li>담임은 <b>우리 반</b> 학생만 올라가요. 파일에서 줄을 지워도 앱에서는 지워지지 않아요.</li><li>출석부 전체를 저장해 두려면 <b>통계</b> 탭의 <b>[엑셀로 내보내기]</b>를 눌러요.</li></ol>
    <h4>8. 일정 · 자료실</h4><ol><li><b>일정</b> 탭 <b>[달력]</b>: 날짜를 누르면 그날 일정과 내용이 보여요. 일정 등록과 수정은 팀 관리자가 해요(날짜를 두 번 누르면 바로 등록·수정 창이 열려요).</li><li><b>[자료실]</b>: 공과 교재·양식·연락망처럼 부서에서 함께 쓰는 파일이에요. 일정과는 따로예요.</li><li><b>[+ 파일 올리기]</b>: 담임도 올릴 수 있어요 (10MB까지). 컴퓨터에서는 파일을 자료실 위로 <b>끌어다 놓아도</b> 되고, 여러 개를 한 번에 놓을 수 있어요. 담임이 올린 파일은 부서의 담임 모두가 볼 수 있어요.</li><li><b>[삭제]</b>: 담임도 지울 수 있어요. 한 번 더 눌러야 지워지고, 되돌릴 수 없어요.</li><li><b>[미리보기]</b>: 받지 않고 바로 봐요 (PDF·엑셀·워드·사진·텍스트). 한글·파워포인트는 <b>[내려받기]</b>로 열어요.</li><li><b>[보내기]</b>: 자료실 파일을 메일로 전해요. 받는 주소는 쉼표로 5명까지 적을 수 있고, 전할 말도 함께 보낼 수 있어요.</li><li><b>[관리자만 보기]</b> 표시가 붙은 파일은 팀 관리자와 총관리자만 볼 수 있어서 담임 화면에는 나오지 않아요.</li><li><b>[온라인 작성]</b>과 <b>[열기/수정]</b>(팀 관리자): 엑셀·워드·파워포인트·텍스트·CSV 파일을 내려받지 않고 구글 시트·문서·슬라이드로 열어 고쳐요. 고친 내용은 미리보기·내려받기·메일에 바로 반영돼요. 이 버튼과 공개 범위 바꾸기는 팀 관리자만 쓸 수 있어요.</li><li>작성본 링크는 밖으로 알리지 마세요.</li></ol>
    <h4>9. 반 이름 · 반 편성 (팀 관리자)</h4><ol><li>화면 위쪽 반(학년) 칩을 <b>더블클릭</b>(휴대폰은 <b>두 번 톡톡</b>)하면 그 반 이름을 바꿀 수 있어요. 예: 1학년 → 1학년 사랑반</li><li>명단 탭 <b>[반 관리]</b>·<b>[이름 바꾸기]</b>와 같은 이름이라, 한쪽에서 바꾸면 다른 쪽에도 그대로 보여요.</li><li>이름만 바뀌고 출석·담임은 그대로 이어져요. 반 이름은 팀 관리자만 바꿀 수 있어요.</li><li><b>로그인 관리</b>: 메인 화면 <b>[로그인 관리] → [선생님 관리]</b>에서 선생님마다 <b>[QR]</b>을 만들어 줘요. 비밀번호가 있는지, 기기가 몇 대인지 보이고, 잊은 비밀번호는 <b>[비밀번호 초기화]</b> 뒤 새 QR을 주면 돼요. 새 QR을 만들면 전에 만든 QR은 쓸 수 없어요.</li><li>두 반을 맡은 선생님은 반 설정에서 두 반의 담임으로 넣으면 같은 로그인으로 두 반이 함께 열려요.</li><li><b>팀 관리자 본인</b>도 QR로 처음 들어와 <b>내 비밀번호</b>(영문+숫자 8자리 이상)를 만들어요. 다른 기기에서는 [로그인]에 <b>이메일</b>과 그 비밀번호를 넣어요. 연말 학년 등반 때도 이 비밀번호로 확인해요.</li><li>명단에서 선생님 이름을 고치면 반 담임 칸의 이름도 같이 바뀌어요.</li><li><b>통계 아래 표</b>: 팀 관리자는 우리 부서 <b>학년별 통계</b>, 공동관리자·총관리자는 <b>부서별 통계</b>(부서마다 [학년별 열기])를 볼 수 있어요. 이번 주·한 달·올해 출석률을 비교해요.</li><li><b>영아교육팀</b>은 나이와 관계없이 반을 만들어요. 명단 탭 <b>[반 관리]</b>에서 반 추가·삭제·순서, <b>[반 배정]</b>에서 아이마다 반을 골라요. 나이는 사람 [수정] 창에서 따로 적어요.</li></ol>
    <h4>10. 로그인이 안 될 때</h4><ol><li>비밀번호를 잊었으면 팀 관리자에게 <b>비밀번호 초기화</b>와 <b>새 QR</b>을 부탁하는 게 가장 빨라요.</li><li>QR이 "이미 사용했거나 무효가 된 QR"이라고 나오면 팀 관리자에게 <b>가장 최근 QR</b>을 다시 받아요.</li><li>그 밖에는 [로그인] 창 아래 <b>[로그인이 안 되나요? 관리자에게 요청하기]</b>를 눌러요.</li><li>부서·직책·이름·요청사항을 적어요. 답을 받을 <b>이메일이나 연락처</b>도 적어 주세요.</li><li><b>[메일로 보내기]</b>: 총관리자에게 메일과 휴대폰 알림으로 바로 전달되고, 적어 준 이메일이나 문자로 답이 와요.</li></ol>
    <h4>11. 지켜 주세요</h4><ol><li><b>내 비밀번호</b>와 받은 <b>QR(링크)</b>, 연락처, 자료실 파일은 다른 사람에게 알려 주지 마세요. QR은 단톡방에 올리지 말고 본인만 써요.</li><li>선생님은 휴대폰·PC 상관없이 <b>기기 1대</b>만 쓸 수 있어요. 새 기기에서 로그인하면 전에 쓰던 기기는 저절로 로그아웃돼요.</li><li>같이 쓰는 기기면 로그인할 때 <b>"이 기기에서 로그인 유지"</b>를 끄거나, 끝난 뒤 메인의 <b>로그아웃</b>을 눌러요.</li><li>휴대폰을 가로로 돌리면 위쪽 날짜·반 선택이 내용과 같이 올라가서 명단을 넓게 볼 수 있어요.</li><li>잘 안 되면 새로 고치거나 크롬·사파리에서 열어 보세요.</li></ol>
    <div class="actions"><div class="spacer"></div><button class="btn primary" data-close>닫기</button></div></div>`;
  document.body.appendChild(ov);
  getAppUrl().then(u=>{const b=ov.querySelector(".guide-url");if(b&&u)b.textContent=u.split(":"+"/"+"/").pop().replace(/[/]$/,"")});
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest("[data-close]"))ov.remove()});
}
/* ---------- 활동 기록 (총관리자·공동관리자1. 텔레그램 알림 종류·답장은 총관리자만) ---------- */
const activityCard=()=>`<details class="fold" data-fold="activity"${S.fold.activity?" open":""}><summary><h2 class="sec">활동 기록</h2></summary><div class="card admin-list"><div class="admin-row"><b>전체 부서</b><span class="code none">출석 체크(반별), 명단·반 이동, 번호 변경, 일정, 자료실, 설정, 요청 등 모든 기록 (로그인 포함 보기 가능)</span><button class="btn" id="actOpen">기록 보기</button></div>${S.isCo?"":`<div class="admin-row"><b>텔레그램 알림</b><span class="code none">휴대폰 텔레그램으로 받을 기록 종류</span><button class="btn" id="tgOpen">알림 종류</button></div>`}</div></details>`;
const bibleCard=()=>[["bibleMap","성경지도","시대별 지도, 성경사전, 사진","map","지도 보기"],["bibleGame","성경게임","퀴즈, 말씀 게임, 주사위판과 교사 랭킹","game","게임하기"]].map(([f,t,d,k,b])=>`<details class="fold" data-fold="${f}"${S.fold[f]!==false?" open":""}><summary><h2 class="sec">${t}</h2></summary><div class="card admin-list"><div class="admin-row"><span class="code none">${d}</span><button class="btn" data-bmhome="${k}">${b}</button></div></div></details>`).join("");
/* 텔레그램으로 받을 알림 종류 고르기 (총관리자 전용) */
async function openTgKinds(){
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="텔레그램 알림 종류"><h3>텔레그램 알림 종류</h3><div id="tgBody"><p class="muted">불러오는 중…</p></div>
    <p class="err" id="tgErr" hidden></p>
    <div class="actions"><div class="spacer"></div><button class="btn" data-close>닫기</button><button class="btn primary" id="tgSave" disabled>저장</button></div></div>`;
  document.body.appendChild(ov);
  const body=ov.querySelector("#tgBody"),er=ov.querySelector("#tgErr"),save=ov.querySelector("#tgSave");
  const draw=d=>{body.innerHTML=`<p class="muted" style="margin:0 0 8px;font-size:14px">${d.linked?"체크한 종류만 텔레그램으로 와요. 활동 기록 시트에는 종류와 상관없이 모두 남아요.":"<b>텔레그램이 아직 연결되지 않았어요.</b> 편집기에서 connectTelegram 을 먼저 실행해 주세요."}</p>
    <div class="card admin-list">${d.kinds.map(x=>`<label class="admin-row" style="cursor:pointer"><input type="checkbox" data-tk="${esc(x.k)}" ${x.on?"checked":""} style="width:20px;height:20px;accent-color:var(--accent)"><b>${esc(x.label)}</b></label>`).join("")}</div>
    <p style="margin:8px 0 0"><button type="button" class="btn" id="tgAll">모두 켜기</button> <button type="button" class="btn" id="tgNone">모두 끄기</button></p>`;save.disabled=false};
  ov.addEventListener("click",async e=>{
    if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
    const all=e.target.closest("#tgAll"),none=e.target.closest("#tgNone");
    if(all||none){ov.querySelectorAll("[data-tk]").forEach(c=>c.checked=!!all);return}
    if(!e.target.closest("#tgSave"))return;
    const on={};ov.querySelectorAll("[data-tk]").forEach(c=>on[c.dataset.tk]=c.checked);
    save.disabled=true;save.textContent="저장 중…";er.hidden=true;
    try{await call("tgKindsSet",on);ov.remove();toast("텔레그램 알림 종류를 저장했어요")}
    catch(x){er.textContent=x.message;er.hidden=false;save.disabled=false;save.textContent="저장"}
  });
  try{draw(await call("tgKinds"))}catch(x){body.innerHTML="";er.textContent=x.message;er.hidden=false}
}
async function openActivityLog(){
  if(!S.isAdmin||S.isCo2){toast("총관리자·공동관리자1만 볼 수 있어요");return}
  /* 거르기(부서·종류·검색)는 서버가 시트 전체에서 해요. 기본은 '로그인 빼고': 로그인 기록에 묻히지 않게 */
  const ov=document.createElement("div");ov.className="overlay";let all=null,tm="all",kd="nologin",q="",total=0,more=false,busy=false,upto=0,before=0,seq=0,qt=0,kinds=[];
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="활동 기록"><h3>활동 기록 <span class="muted" style="font-family:var(--body);font-size:14px" id="alCount"></span></h3>
    <div class="seg" id="alTeams"><button data-atm="all" aria-pressed="true">전체</button>${Object.entries(TEAMS).map(([k,x])=>`<button data-atm="${k}" aria-pressed="false">${esc(x.short)}</button>`).join("")}</div>
    <div class="form" style="grid-template-columns:1fr 1fr"><label>종류<select id="alKind"><option value="nologin">로그인 빼고 모두</option><option value="all">전체 (로그인 포함)</option></select></label><label>검색<input id="alQ" type="search" placeholder="이름·내용·바꾼 사람" autocomplete="off"></label></div>
    <div id="alList" style="margin-top:6px"><p class="muted">불러오는 중…</p></div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">최근 기록부터 200건씩 보여요. 아래로 내리면 더 불러와요. 종류·부서·검색은 지난 기록 전체에서 찾아요. 시트의 '이력' 탭에도 같은 내용이 있어요. 출석 체크·해제(달란트 해제 포함)는 그날 것을 모아 <b>오후 6시에 한 번</b>, 반마다 한 줄로 남고 텔레그램으로도 와요 (6시 뒤에 한 것은 다음 날 6시에).</p>
    <div class="actions"><div class="spacer"></div><button class="btn primary" data-close>닫기</button></div></div>`;
  document.body.appendChild(ov);
  const list=ov.querySelector("#alList");
  const draw=()=>{
    if(all===null){list.innerHTML=`<p class="muted">불러오는 중…</p>`;ov.querySelector("#alCount").textContent="";return}
    ov.querySelector("#alCount").textContent=`${all.length}${more?"+":""}건`+(tm==="all"&&kd==="all"&&!q.trim()?"":` (전체 ${total}건 중)`);
    list.innerHTML=all.length?all.map((x,i)=>`<div class="hist-item"><span class="when">${esc(x.at.slice(0,10))}<br>${esc(x.at.slice(11))}</span><span class="what"><span class="hist-kind ${x.kind==="교사"||x.kind==="담임"?"t":""}">${esc(x.kind)}</span>${x.team?`<span class="muted" style="font-size:12px">${esc(x.team.replace("교육팀",""))} </span>`:""}${x.name?`<b>${esc(x.name)}</b> `:""}${esc(x.text)}${askBack(x)&&!S.isCo?` <button class="btn" data-reply="${i}" style="font-size:12px;padding:2px 10px">답장</button>`:""}<span class="by">${esc(x.by==="번호 없음"?"확인 안 된 사용자":x.by)}</span></span></div>`).join(""):(more?"":`<p class="muted">기록이 없어요.</p>`);
    if(more)list.insertAdjacentHTML("beforeend",`<p style="text-align:center;margin:10px 0"><button class="btn" id="alMore" ${busy?"disabled":""}>${busy?"더 불러오는 중…":"더 보기"}</button></p>`);
  };
  const setKinds=ks=>{const sel=ov.querySelector("#alKind");kinds=[...new Set(kinds.concat(ks||[],(all||[]).map(x=>x.kind)))].filter(Boolean);
    const cur=sel.value;sel.innerHTML=`<option value="nologin">로그인 빼고 모두</option><option value="all">전체 (로그인 포함)</option>`+kinds.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join("");sel.value=cur};
  // 서버에서 최근 기록부터, 고른 조건에 맞는 것만 200건씩. 조건을 바꾸면 처음부터 다시 받는다 (늦게 온 예전 응답은 버림)
  const fetchMore=async(reset)=>{
    if(reset){all=null;before=0;more=false;busy=false}
    if(busy)return;busy=true;const my=++seq;draw();
    try{const r=await call("activity",before,upto,{kind:kd,team:tm==="all"?"":tm,q:q.trim()});
      if(my!==seq)return;
      all=(all||[]).concat(r.list);more=r.more;before=r.before;total=r.total;if(!upto)upto=r.upto;setKinds(r.kinds)}
    catch(e){if(my!==seq)return;if(all===null&&!before&&!total){ov.remove();alertBox("활동 기록을 불러오지 못했어요",e.message);return}toast("더 불러오지 못했어요");if(all===null)all=[]}
    finally{if(my===seq)busy=false}
    if(my===seq)draw();
  };
  const sheet=ov.querySelector(".sheet");
  const next=()=>{if(all!==null&&!busy&&more)fetchMore()};
  sheet.addEventListener("scroll",()=>{if(sheet.scrollTop+sheet.clientHeight>=sheet.scrollHeight-300)next()},{passive:true});
  ov.addEventListener("click",e=>{
    if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
    if(e.target.closest("#alMore"))return next();
    const rp=e.target.closest("[data-reply]");if(rp){const x=(all||[])[+rp.dataset.reply];if(x)openAskReply(x);return}
    const b=e.target.closest("[data-atm]");if(b){tm=b.dataset.atm;ov.querySelectorAll("[data-atm]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));fetchMore(true)}
  });
  ov.querySelector("#alKind").addEventListener("change",e=>{kd=e.target.value;fetchMore(true)});
  ov.querySelector("#alQ").addEventListener("input",e=>{q=e.target.value;clearTimeout(qt);qt=setTimeout(()=>fetchMore(true),400)});
  fetchMore();
}

function rptTidy(lines){

  const cell=a=>esc((a||[]).join("\n"));
  const team=t=>t==="support"?"교육지원":esc(TEAMS[t].label.replace("교육팀",""))+"<br>교육팀";
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="미리보기" style="max-width:900px"><h3>미리보기 <span class="muted" style="font-family:var(--body);font-size:14px">${esc(R.fileName)}</span></h3>
    <div class="rpt-paper"><div class="rpt-h1">${esc(R.heading)}</div><div class="rpt-h2">${esc(dateLabel(R.date))} 당회 보고 사항</div>
    <table class="rpt-tbl"><colgroup><col style="width:10%"><col style="width:45%"><col style="width:45%"></colgroup>
    <thead><tr><th>팀</th><th>${m} 월 보 고 내 용</th><th>계획, 예정사항</th></tr></thead>
    <tbody>${ts.map(t=>`<tr><td class="c">${team(t)}</td><td>${cell(R.teams[t].cur)}</td><td>${cell(R.teams[t].next)}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">실제 한글 파일은 휴먼고딕 10pt(본문)·HY견고딕(제목)으로 만들어져요. 줄 바꿈 위치는 한글에서 조금 다를 수 있어요.</p>
    <div class="actions"><div class="spacer"></div><button class="btn primary" data-close>닫기</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest("[data-close]"))ov.remove()});
}
function rptMailBox(R,ym,setR){

    if(e.target.closest("#mAdd")){const name=ov.querySelector("#mName").value.trim(),email=ov.querySelector("#mEmail").value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("메일 주소를 확인해 주세요");return}
      const msg=ov.querySelector("#mMsg").value;const hit=list.find(x=>x.email===email);if(hit){hit.on=true;if(name)hit.name=name}else list.unshift({name,email,on:true});draw();ov.querySelector("#mMsg").value=msg;return}
    const sd=e.target.closest("#mSend");if(!sd||sd.disabled)return;
    const to=list.filter(x=>x.on).map(x=>({name:x.name,email:x.email}));if(!to.length){toast("받는 사람을 골라 주세요");return}
    const fr=froms[fi]||froms[0];if(!fr){toast("보내는 사람을 추가해 주세요");return}const from={name:fr.name,email:fr.email};

    try{const r=await tracked(call("rptMail",ym,{to,from,msg:ov.querySelector("#mMsg").value}));ov.remove();setR(r);alertBox("메일을 보냈어요",to.map(x=>(x.name?x.name+" ":"")+"<"+x.email+">").join(", "))}
    catch(x){sd.disabled=false;sd.textContent="보내기";alertBox("보내지 못했어요",x.message)}
  });
}
/* 한글(.hwp) 읽기: 부서 보고서에서 표의 '이번 달 보고'·'다음 달 계획' 칸 글자만 꺼낸다 (브라우저에서) */
function cfbRead(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);const u32=o=>dv.getUint32(o,true);
  if(u32(0)!==0xE011CFD0)throw new Error("한글(.hwp) 파일이 아니에요. 한글에서 .hwp로 저장해 주세요");
  const ss=1<<dv.getUint16(30,true),mss=1<<dv.getUint16(32,true),E=0xFFFFFFFA;
  const sec=s=>u8.subarray(512+s*ss,512+(s+1)*ss);
  let difat=[];for(let i=0;i<109;i++)difat.push(u32(76+i*4));
  for(let s=u32(68),n=u32(72);n-->0&&s<E;){const b=sec(s),d=new DataView(b.buffer,b.byteOffset,ss);for(let i=0;i<ss/4-1;i++)difat.push(d.getUint32(i*4,true));s=d.getUint32(ss-4,true)}
  const fat=[];difat.slice(0,u32(44)).forEach(s=>{const d=new DataView(u8.buffer,u8.byteOffset+512+s*ss,ss);for(let i=0;i<ss/4;i++)fat.push(d.getUint32(i*4,true))});
  const chain=(s,t)=>{const o=[];while(s<E&&o.length<1e6){o.push(s);s=t[s]}return o};
  const cat=(parts,size)=>{const o=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let k=0;parts.forEach(p=>{o.set(p,k);k+=p.length});return size==null?o:o.subarray(0,size)};
  const big=(s,size)=>cat(chain(s,fat).map(sec),size);
  const dir=big(u32(48));const dd=new DataView(dir.buffer,dir.byteOffset,dir.byteLength);
  const ents=[];for(let o=0;o+128<=dir.length;o+=128){const nl=dd.getUint16(o+64,true);let nm="";for(let i=0;i<nl-2;i+=2)nm+=String.fromCharCode(dd.getUint16(o+i,true));
    ents.push({nm,t:dir[o+66],l:dd.getUint32(o+68,true),r:dd.getUint32(o+72,true),c:dd.getUint32(o+76,true),s:dd.getUint32(o+116,true),z:dd.getUint32(o+120,true)})}
  const root=ents[0],ms=big(root.s,root.z),mf=[];if(u32(64)){const b=big(u32(60));const d=new DataView(b.buffer,b.byteOffset,b.length);for(let i=0;i+4<=b.length;i+=4)mf.push(d.getUint32(i,true))}
  const files={};
  const walk=(i,pre)=>{if(i>=E||!ents[i])return;const e=ents[i];walk(e.l,pre);walk(e.r,pre);const p=pre+e.nm;
    if(e.t===2)files[p]=e.z<u32(56)?cat(chain(e.s,mf).map(x=>ms.subarray(x*mss,(x+1)*mss)),e.z):big(e.s,e.z);
    if(e.t===1)walk(e.c,p+"/")};
  walk(root.c,"");return files;
}
async function inflateRaw(u8){
  if(typeof DecompressionStream==="undefined")throw new Error("이 브라우저에서는 한글 파일을 읽을 수 없어요. Chrome이나 Safari 최신 버전으로 열어 주세요");
  /* 한글 파일은 압축 데이터 뒤에 남는 바이트가 있어 브라우저가 끝에서 오류를 낸다. 그때까지 풀린 내용을 쓴다 */
  const rd=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();const parts=[];let n=0;
  try{for(;;){const r=await rd.read();if(r.done)break;parts.push(r.value);n+=r.value.length}}catch(e){if(!n)throw new Error("한글 파일 내용을 풀지 못했어요")}
  const out=new Uint8Array(n);let k=0;parts.forEach(x=>{out.set(x,k);k+=x.length});return out;
}
/** 부서 보고서 .hwp → { cur:[줄], next:[줄] }. 표가 없으면 본문 전체를 cur 로 */
async function readHwpReport(buf){
  const f=cfbRead(new Uint8Array(buf));const fh=f.FileHeader;if(!fh)throw new Error("한글 파일 머리글이 없어요");
  const flags=new DataView(fh.buffer,fh.byteOffset,fh.length).getUint32(36,true);
  if(flags&2)throw new Error("암호가 걸린 한글 파일이에요. 암호를 풀고 다시 올려 주세요");
  if(flags&4)throw new Error("배포용 한글 문서는 읽을 수 없어요. 일반 문서로 저장해 주세요");
  const names=Object.keys(f).filter(k=>/^BodyText\/Section\d+$/.test(k)).sort((a,b)=>Number(a.slice(16))-Number(b.slice(16)));
  const paras=[];let cell=null;const cells=[];
  /* 문단 모양 중 '문단 번호'(1. 2. …)·'글머리표'(•)인 것: 번호는 글자로 들어 있지 않아서 직접 붙여 준다 */
  const head=[];if(f.DocInfo){const d=flags&1?await inflateRaw(f.DocInfo):f.DocInfo;const v=new DataView(d.buffer,d.byteOffset,d.length);let o=0;
    while(o+4<=d.length){const h=v.getUint32(o,true);let sz=h>>>20;o+=4;if(sz===4095){sz=v.getUint32(o,true);o+=4}if((h&1023)===25&&sz>=4)head.push((v.getUint32(o,true)>>>23)&3);o+=sz}}
  let ps=0,num=0;
  for(const k of names){
    const d=flags&1?await inflateRaw(f[k]):f[k];const v=new DataView(d.buffer,d.byteOffset,d.length);let o=0;
    while(o+4<=d.length){const h=v.getUint32(o,true);const tag=h&1023,lv=(h>>10)&1023;let sz=h>>>20;o+=4;if(sz===4095){sz=v.getUint32(o,true);o+=4}
      const p=d.subarray(o,o+sz),pv=new DataView(p.buffer,p.byteOffset,p.length);o+=sz;
      if(cell&&lv<cell.lv)cell=null; /* 표가 끝나면 칸 밖 */
      if(tag===72&&p.length>=16){cell={col:pv.getUint16(8,true),row:pv.getUint16(10,true),lv,lines:[]};cells.push(cell);num=0;continue}
      const to=cell?cell.lines:paras;
      if(tag===67){let t="";for(let i=0;i+1<p.length;i+=2){const c=pv.getUint16(i,true);if(c<32){if(c===10)t+="\n";else if(c===9)t+="\t";else if(c===24||c===30||c===31)t+=" ";if([0,10,13,24,25,26,27,28,29,30,31].indexOf(c)<0)i+=14}else t+=String.fromCharCode(c)}
        const kind=head[ps]||0;if(kind===2&&t.trim())t=(++num)+". "+t.replace(/^\s+/,"");else if(kind===3&&t.trim())t="• "+t.replace(/^\s+/,"");
        t.split("\n").forEach(x=>to.push(x));continue}
      if(tag===66){ps=pv.getUint16(8,true);if((pv.getUint32(0,true)&0x7fffffff)<=1)to.push("")}
    }
  }
  // 부서 보고서 표: 3칸(팀 | 이번 달 | 다음 달). 둘째 줄부터의 2·3번째 칸을 모은다
  const body=cells.filter(c=>c.row>=1&&(c.col===1||c.col===2));
  if(body.length){const pick=col=>body.filter(c=>c.col===col).sort((a,b)=>a.row-b.row).reduce((a,c)=>a.concat(c.lines),[]);return {cur:pick(1),next:pick(2),table:true}}
  return {cur:paras,next:[],table:false};
}

const histItem=x=>`<div class="hist-item"><span class="when">${esc(x.at.slice(0,10))}<br>${esc(x.at.slice(11))}</span><span class="what"><span class="hist-kind ${x.kind==="교사"||x.kind==="담임"?"t":""}">${esc(x.kind)}</span>${x.name?`<b>${esc(x.name)}</b> `:""}${esc(x.text)}<span class="by">${esc(x.by)}</span></span></div>`;
function yearSummary(p){
  const years={};
  for(const [k,a] of S.att.entries()){
    const y=k.slice(0,4);const rec=Object.keys(a.p||{}).some(id=>{const q=S.people.get(id);return q&&teamOf(q)===teamOf(p)});
    if(!rec)continue;const Y=years[y]||(years[y]={weeks:0,on:0,t:0,m:0});Y.weeks++;if((a.p||{})[p.id])Y.on++;Y.t+=Number((a.t||{})[p.id]||0);if((a.m||{})[p.id])Y.m++;
  }
  const ys=Object.keys(years).sort().reverse();
  return ys.length?ys.map(y=>{const Y=years[y];return `<div class="yr-row"><span>${y}년</span><span class="num">출석 <b>${Y.on}</b> / ${Y.weeks}주${Y.weeks?` (${Math.round(Y.on/Y.weeks*100)}%)`:""}${p.group!=="T"&&talentOn()&&Y.t?` · ${esc(TL())} ${Y.t}`:""}${Y.m?` · 메모 ${Y.m}`:""}</span></div>`}).join(""):`<p class="muted" style="margin:4px 0">아직 출석 기록이 없어요.</p>`;
}

async function openHistoryList(){

  const draw=()=>{

  return [...S.people.values()].filter(p=>teamOf(p)===t&&p.active!==false&&p.group!=="T"&&!promotedIn(p,y)&&(withSkipped||!skip.has(p.id)))
    .map(p=>({p,next:nextStep(t,stepFrom(t,p))})).filter(x=>x.next);
}
/* 등반에서 뺀 학생 (아직 이 부서 재적이고 등반 전인 사람만) */
const promoSkipped=t=>{const skip=new Set(promoSkip(t));return planPromotion(t,true).filter(x=>skip.has(x.p.id)).map(x=>x.p).sort((a,b)=>a.name.localeCompare(b.name,"ko"))};
const noAgeKids=t=>isFlex(t)?[...S.people.values()].filter(p=>teamOf(p)===t&&p.active!==false&&p.group!=="T"&&!promotedIn(p,promoYear())&&!p.age):[];
/* 등반 뒤 값: 영아 안에서는 나이만 올리고 반·분반은 그대로, 유아로 가면 5세반 */
const promoBody=(next,y)=>next==="grad"?null:isFlex(next[0])?{team:next[0],age:next[1],promotedYear:y}:{team:next[0],group:next[1],age:"",promotedYear:y,section:""};
const stepToLabel=next=>next==="grad"?"졸업":stepLabel(next[0],next[1]);
/* 등반 대상을 '어디서 → 어디로'로 묶고 이름을 모은다 (위 학년부터) */
function promoGroups(t,plan=planPromotion(t)){
  const groups=new Map();
  for(const {p,next} of plan){
    const from=stepLabel(t,stepFrom(t,p));const to=stepToLabel(next);const k=from+"|"+to;
    const g=groups.get(k)||{from,to,out:next==="grad"||next[0]!==t,grad:next==="grad",idx:SEQ.findIndex(([a,b])=>a===t&&b===stepFrom(t,p)),names:[]};
    g.names.push(p.name);(g.ids||(g.ids=[])).push(p.id);groups.set(k,g);
  }
  return [...groups.values()].map(g=>{const o=g.ids.map((id,i)=>[id,g.names[i]]).sort((a,b)=>a[1].localeCompare(b[1],"ko"));return {...g,n:o.length,ids:o.map(x=>x[0]),names:o.map(x=>x[1])}}).sort((a,b)=>b.idx-a.idx);
}
/* t 를 주면 이름을 눌러 등반에서 뺄 수 있다 */
const promoMoveRow=(m,t,attr="data-pskip")=>`<div class="move ${m.grad?"grad":""}"><span>${esc(m.from)}</span><span class="arrow">→</span><span class="to"${m.out&&!m.grad?' style="color:var(--accent);font-weight:600"':""}>${esc(m.to)}</span><span class="n num">${m.n}명</span>${m.names?`<span class="names">${t&&m.ids?m.names.map((n,i)=>`<button type="button" class="pname" ${attr}="${t}|${esc(m.ids[i])}" title="눌러서 등반에서 빼기">${esc(n)}</button>`).join(""):m.names.map(esc).join(", ")}</span>`:""}</div>`;
const promoSkipRow=t=>{const sk=promoSkipped(t);return sk.length?`<div class="move skip"><span>등반에서 뺌</span><span class="n num">${sk.length}명</span><span class="names">${sk.map(p=>`<button type="button" class="pname off" data-pskip="${t}|${esc(p.id)}" title="눌러서 다시 넣기">${esc(p.name)} <small>${esc(stepLabel(t,stepFrom(t,p)).slice(TEAMS[t].short.length+1))}</small></button>`).join("")}</span></div>`:""};
/* 이미 한 등반(되돌리지 않은 것)에서 올라간 학생: 등반 전 자리 → 올라간 자리 */
/** 등반 대상(남은 사람)과 이미 등반한 학생을 엑셀로. teams: 부서 목록 */
async function downloadPromoXlsx(teams){
  if(!await needXLSX())return;
  const y=promoYear();const H=["부서","반","분반","이름","성별","생일","등반 전","등반 후","메모"];
  const ord=(t,x)=>-SEQ.findIndex(([a,b])=>a===t&&b===x);
  const todo=teams.flatMap(t=>planPromotion(t).map(({p,next})=>({t,p,from:stepFrom(t,p),to:stepToLabel(next)})))
    .sort((a,b)=>PROMO_TEAMS.indexOf(a.t)-PROMO_TEAMS.indexOf(b.t)||ord(a.t,a.from)-ord(b.t,b.from)||a.p.name.localeCompare(b.p.name,"ko"))
    .map(({t,p,from,to})=>[TEAMS[t].label,classLabelOf(t,p.group),p.section||"",p.name,p.gender||"",p.birthday||"",stepLabel(t,from),to,p.note||""]);
  const done=teams.flatMap(t=>liveRuns(promoRec(t)).flatMap(x=>(x.moves||[]).map(m=>{const q=S.people.get(m.id)||{};const f=stepFrom(m.team,m);const nx=f?nextStep(m.team,f):null;
    return [TEAMS[t].label,q.name||"(지운 사람)",f?stepLabel(m.team,f):classLabelOf(m.team,m.group),nx?stepToLabel(nx):"?",new Date(x.at).toLocaleString("ko-KR")]})));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([H,...todo]);ws["!cols"]=[12,8,5,10,5,10,14,14,24].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,"등반 대상");
  if(done.length){const w2=XLSX.utils.aoa_to_sheet([["부서","이름","등반 전","등반 후","등반한 때"],...done]);w2["!cols"]=[12,10,14,14,22].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,w2,"등반 완료")}
  const skipped=teams.flatMap(t=>promoSkipped(t).map(p=>[TEAMS[t].label,classLabelOf(t,p.group),p.section||"",p.name,p.gender||"",p.birthday||"",stepLabel(t,stepFrom(t,p)),p.note||""]));
  if(skipped.length){const w3=XLSX.utils.aoa_to_sheet([["부서","반","분반","이름","성별","생일","지금","메모"],...skipped]);w3["!cols"]=[12,8,5,10,5,10,14,24].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,w3,"등반 제외")}
  if(!todo.length&&!done.length&&!skipped.length){toast("내려받을 등반 대상이 없어요");return}
  saveWorkbook(wb,`${y}년 연말 등반 대상${teams.length===1?"_"+TEAMS[teams[0]].short:""}.xlsx`);
}
/**
 * 올해 졸업 예정자 명단(모든 부서). 졸업 예정자 = 각 부서의 가장 마지막 학년·나이 (영아 4세, 유아 7세, 유소년 6학년, 중고등 고3)
 *  - 졸업 예정: 올해 연말 등반 전인 학생 (등반에서 뺀 학생 제외)
 *  - 졸업: 올해 연말 등반으로 이미 다음 부서로 올라갔거나 졸업 처리된 학생 (등반 기록에서 찾음)
 */
const lastStep=t=>TEAMS[t].groups[TEAMS[t].groups.length-1][0];
async function downloadGradXlsx(){
  const y=promoYear();
  const soon=PROMO_TEAMS.flatMap(t=>planPromotion(t).filter(x=>stepFrom(t,x.p)===lastStep(t))
    .map(x=>({t,kind:"졸업 예정",p:x.p,group:x.p.group,section:x.p.section||"",to:stepToLabel(x.next)})));
  const done=PROMO_TEAMS.flatMap(t=>liveRuns(promoRec(t)).flatMap(r=>(r.moves||[]).filter(m=>m.team===t&&stepFrom(t,m)===lastStep(t))
    .map(m=>({t,kind:"졸업",p:S.people.get(m.id)||{name:"(지운 사람)"},group:m.group,section:m.section||"",to:stepToLabel(nextStep(t,lastStep(t)))}))));
  if(!soon.length&&!done.length){toast(`${y}년 졸업 예정자가 없어요`);return}
  if(!await needXLSX())return;
  const rows=soon.concat(done).sort((a,b)=>(a.kind===b.kind?0:a.kind==="졸업 예정"?-1:1)||PROMO_TEAMS.indexOf(a.t)-PROMO_TEAMS.indexOf(b.t)||String(a.group).localeCompare(String(b.group))||String(a.p.name).localeCompare(String(b.p.name),"ko"))
    .map(x=>[x.kind,y,TEAMS[x.t].label,stepLabel(x.t,lastStep(x.t)).slice(TEAMS[x.t].short.length+1),classLabelOf(x.t,x.group),x.section,x.p.name,x.p.gender||"",x.p.birthday||"",x.to,x.p.note||""]);
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([["구분","졸업 연도","부서","학년·나이","반","분반","이름","성별","생일","올라갈 곳","메모"],...rows]);ws["!cols"]=[9,9,12,9,8,5,10,5,10,14,30].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,`${y}년 졸업 예정자`);
  saveWorkbook(wb,`${y}년 졸업 예정자 명단.xlsx`);
}
function promoDoneGroups(t){
  const g=new Map();
  for(const x of liveRuns(promoRec(t)))for(const m of x.moves||[]){
    const f=stepFrom(m.team,m);const nx=f?nextStep(m.team,f):null;const from=f?stepLabel(m.team,f):classLabelOf(m.team,m.group),to=nx?stepToLabel(nx):"?";const k=from+"|"+to;
    const r=g.get(k)||{from,to,grad:nx==="grad",out:nx==="grad"||(nx&&nx[0]!==t),idx:SEQ.findIndex(([a,b])=>a===m.team&&b===f),names:[]};
    r.names.push((S.people.get(m.id)||{}).name||"(지운 사람)");(r.ids||(r.ids=[])).push(m.id);g.set(k,r);
  }
  return [...g.values()].map(r=>{const o=r.ids.map((id,i)=>[id,r.names[i]]).sort((a,b)=>a[1].localeCompare(b[1],"ko"));return {...r,n:o.length,ids:o.map(x=>x[0]),names:o.map(x=>x[1])}}).sort((a,b)=>b.idx-a.idx);
}
async function writeWithRetry(ref,body){return ref.update(body)}
async function applyMoves(list,onProgress){
  for(const [id,body] of list){const p=S.people.get(id);if(p)S.people.set(id,{...p,...body})}
  onProgress(0,Math.max(1,list.length));
  try{await S.db.batch(list.map(([id,body])=>["people/"+id,body]));onProgress(list.length,Math.max(1,list.length));return []}
  catch(e){console.error(e);toast(e.message);await load();return list.map(x=>x[0])}
}
/* 큰 작업(연말 등반) 전 확인: 팀 관리자는 본인 개인 비밀번호 */
const needsCode=t=>!S.isAdmin;
async function codeOk(t,ov){
  if(!needsCode(t))return true;
  const inp=ov.querySelector("#f-pcode"),er=ov.querySelector("#pcodeErr");const code=inp.value.trim();
  if(!code){er.textContent="내 비밀번호를 넣어 주세요.";er.hidden=false;inp.focus();return false}
  let ok=false;
  try{ok=await call("checkMyPw",code)}catch(x){er.textContent=x.message;er.hidden=false;inp.select();return false}
  er.textContent="비밀번호가 맞지 않아요.";
  er.hidden=ok;if(!ok)inp.select();return ok;
}
function sheetShell(title,intro,body,goLabel,goCls,t){
  return `<div class="sheet" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>
    <p class="muted" style="margin:0;font-size:14px">${intro}</p>${body}
    ${needsCode(t)?`<div class="form"><label class="full">확인을 위해 내 비밀번호<input id="f-pcode" type="password" autocomplete="current-password" maxlength="30"></label></div><p class="err" id="pcodeErr" hidden>비밀번호가 맞지 않아요.</p>`:""}
    <div class="progress" hidden><div></div></div><p class="muted num" id="pMsg" style="font-size:13px;margin:8px 0 0"></p>
    <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button>${goLabel?`<button type="button" class="btn ${goCls}" id="pGo">${goLabel}</button>`:""}</div></div>`;
}
function runSheet(ov,armText,work){
  let running=false;
  ov.addEventListener("click",async e=>{
    if(!running&&(e.target===ov||e.target.closest("[data-close]")))return ov.remove();
    const go=e.target.closest("#pGo");if(!go||running)return;
    if(!go.dataset.armed){go.dataset.armed="1";go.textContent=armText;return}
    running=true;go.disabled=true;
    const t=ov.dataset.team;if(!(await codeOk(t,ov))){running=false;go.disabled=false;return}
    ov.querySelector("[data-close]").disabled=true;
    const bar=ov.querySelector(".progress");bar.hidden=false;const msg=ov.querySelector("#pMsg");
    await work((d,n,label)=>{bar.firstElementChild.style.width=(d/n*100)+"%";msg.textContent=`${d} / ${n}명 ${label}`});
    ov.remove();render();
  });
}
/* 등반하면 그 부서 반 담임 지정을 비운다(새 학년도에 다시 지정). 비운 값은 되돌리기용으로 돌려준다 */
function clearHomerooms(t){
  const hr={};
  S.classes.forEach((c,k)=>{if(k.indexOf(t+"_")!==0||!c.teacher&&!Object.values(c.teachers||{}).some(Boolean))return;
    hr[k]={teacher:c.teacher||"",teachers:c.teachers||{}};const body={...c,teacher:"",teachers:{}};
    S.classes.set(k,body);if(S.db)enqueue("classes/"+k,()=>S.db.doc("classes/"+k).set(body))});
  return hr;
}
/* 되돌릴 때 담임을 다시 넣는다. 그 사이 새로 지정한 반은 건드리지 않는다 */
function restoreHomerooms(hr){
  Object.keys(hr||{}).forEach(k=>{const c=S.classes.get(k)||{};if(c.teacher||Object.values(c.teachers||{}).some(Boolean))return;
    const [t,...g]=k.split("_");const body={...c,team:t,group:g.join("_"),teacher:hr[k].teacher||"",teachers:hr[k].teachers||{}};
    S.classes.set(k,body);if(S.db)enqueue("classes/"+k,()=>S.db.doc("classes/"+k).set(body))});
}
const canPromote=t=>S.isAdmin||((S.scope||{})[t]||{}).level==="dept";
function openPromotion(t){
  if(!S.db||!S.editable)return;if(!canPromote(t)){toast("연말 등반은 팀 관리자 이상만 할 수 있어요");return}
  let plan=planPromotion(t);const y=promoYear();
  const order=promoGroups(t,plan);
  const last=TEAMS[t].groups[TEAMS[t].groups.length-1].slice();last[1]=stepLabel(t,last[0]).slice(TEAMS[t].short.length+1);const nx=nextStep(t,last[0]);
  const dest=nx==="grad"?"졸업 처리되어 명단에서 숨겨져요":`<b>${esc(TEAMS[nx[0]].label)} ${esc(stepLabel(nx[0],nx[1]).slice(TEAMS[nx[0]].short.length+1))}</b>(으)로 올라가요`;
