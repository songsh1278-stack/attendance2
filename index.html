.tag.role{background:var(--sunk);color:var(--muted)}
.talent{flex:none;display:flex;align-items:center;gap:2px;background:var(--gold-soft);border-radius:10px;padding:2px 2px 2px 4px}
.talent-box{flex:none}
.talent .arrows{display:flex;flex-direction:column;gap:2px}
.talent .arrows button{width:34px;height:22px;border:0;background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold-ink);border-radius:6px;display:grid;place-items:center;padding:0}
.talent .arrows svg{width:16px;height:16px}
.talent .arrows button:active{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.talent input{width:40px;height:46px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:center;font-weight:700;color:var(--gold-ink);font-size:16px;padding:0;-moz-appearance:textfield}
.talent input::-webkit-outer-spin-button,.talent input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.talent input:focus{background:var(--surface);border-color:var(--gold);outline:none}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);overflow:hidden}
.avatar.lg{width:96px;height:96px;font-size:24px}
.who-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:0}
.photo-field{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.photo-field .btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-field input[type=file]{display:none}
.sheet-head{display:flex;align-items:center;gap:14px}
.check-box{flex:none;display:flex;flex-direction:column;align-items:center}
.check-lbl{font-size:11px;color:var(--accent);text-align:center;margin-top:2px;font-weight:600}
.talent-lbl{font-size:11px;color:var(--gold-ink);text-align:center;margin-top:-2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;margin-top:14px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:56px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
h2.sec{font-family:var(--display);font-weight:400;font-size:19px;margin:22px 0 10px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
details.fold>summary h2.sec{margin-bottom:6px}
details.fold .fold-sum{font-size:13px;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"펼치기 ▾";margin-left:auto;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
details.fold[open]>summary::after{content:"접기 ▴"}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
:root[data-style] .seg button[aria-pressed="true"]{color:var(--accent);box-shadow:var(--shadow),inset 0 0 0 1px var(--accent)}

.brand .left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand h1{min-width:0;line-height:1.25} /* 제목이 길면 '교육팀 출석부'만 아랫줄로 (.tw 덩어리는 끊지 않음) */
.brand h1 .tw{white-space:nowrap;display:inline-block}
.brand small{flex:none;white-space:nowrap}
.brand-right{display:flex;align-items:center;gap:8px;flex:none}
.hdr-refresh{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
:root[data-style="navy"] header.top .hdr-refresh,:root[data-style="sunset"] header.top .hdr-refresh{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:var(--hdr-ink)}
.brand small.tight{font-size:10px;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center;flex:none}
.home-intro{margin-block:18px 12px}
.home-intro .yr{font-family:var(--display);font-size:30px;line-height:1.1;margin:0}
.home-intro p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dept-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.dept-grid{grid-template-columns:1fr}}
.dept{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 14px;min-height:132px;box-shadow:var(--shadow)}
.dept .top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.dept .name{font-family:var(--display);font-size:clamp(16px,4.6vw,20px);line-height:1.2;word-break:keep-all}
.dept .range{font-size:13px;color:var(--muted)}
.dept .stat{margin-top:auto;word-break:keep-all;font-size:13px;font-weight:600;color:var(--accent)}
.dept .lock{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:99px;padding:1px 7px}
.lock-ic{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.admin-list{display:flex;flex-direction:column;padding:4px 14px}
.admin-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:0}
.admin-row b{min-width:92px}
.admin-row .code{flex:1;font-size:17px;font-weight:700;letter-spacing:.12em;min-width:80px}
.admin-row .code.none{letter-spacing:0;font-size:13px;font-weight:500;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin:8px 0 0}
.promo-card{display:flex;flex-direction:column;gap:10px}
.promo-card .line{font-size:14px}
.promo-card .btns{display:flex;gap:8px;flex-wrap:wrap}
.move-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:46vh;overflow:auto}
.move{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 10px;background:var(--ground);border-radius:10px}
.move .arrow{color:var(--muted)}
.move .n{margin-left:auto;font-weight:700}
.move .names{flex-basis:100%;font-size:13px;color:var(--muted);line-height:1.6;word-break:keep-all}
.move{flex-wrap:wrap}
.move .names .pname{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0;font-size:13px;color:var(--ink);cursor:pointer}
.move .names .pname.off{text-decoration:line-through;color:var(--muted);background:transparent}
.move .names .pname small{font-size:11px;color:var(--muted)}
.move.skip{background:transparent;border:1px dashed var(--line)}
details.promo-team{border-bottom:1px solid var(--line);padding:10px 0}
details.promo-team>summary{align-items:center;gap:8px}
details.promo-team .move-list{max-height:none;margin-top:6px}
.run{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font:inherit;color:inherit;padding:10px 12px;background:var(--ground);border:2px solid transparent;border-radius:12px;cursor:pointer}
.run[aria-pressed="true"]{border-color:var(--danger);background:var(--surface)}
.run:disabled{cursor:default;opacity:.6}
.run .h{display:flex;gap:8px;align-items:center;font-weight:600}
.run .h .st{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.run .d{font-size:13px;color:var(--muted)}
.move.grad .to{color:var(--new);font-weight:600}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
body.home nav.tabs,body.home #datebar,body.home #chips{display:none}
body.home .app{padding-block-end:32px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,20,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pc-h{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form .name-sex{display:flex;gap:6px}
.form .name-sex input{flex:1;min-width:0}
.form .name-sex select{flex:none;width:72px;padding:0 6px}
.form input,.form select,.form textarea{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:0 10px;font-size:15px;font-weight:400;color:var(--ink)}
.form textarea{height:70px;padding:8px 10px;resize:vertical}
.form .inline{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.form .inline input{height:20px;width:20px}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.actions .spacer{flex:1}
.contact{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.contact div{display:flex;align-items:center;gap:8px;font-size:14px}
.contact .k{width:64px;color:var(--muted);font-size:12px;flex:none}
.contact .v{flex:1;user-select:text;word-break:break-all}
.boot-loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ground);color:var(--ink);text-align:center;padding:16px;transition:opacity .25s}
.boot-loader.out{opacity:0;pointer-events:none}
.boot-loader .spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:bootspin .9s linear infinite}
.boot-loader b{font-family:var(--display);font-size:24px;font-weight:400}
.boot-loader span{color:var(--muted);font-size:14px}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.boot-loader .spin{animation-duration:2.5s}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:99px;font-size:13px;z-index:30}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
#pform .form{grid-template-columns:minmax(0,1fr)}
/* 창 안의 칸이 화면 폭보다 넓어지지 않게 (긴 선택지·날짜 칸이 창을 밀어내지 않게) */
.sheet{overflow-x:hidden}
.form>*{min-width:0}
.form input:not([type=checkbox]):not([type=radio]):not([type=file]),.form select,.form textarea{width:100%;min-width:0;max-width:100%}
.form .name-sex select{width:72px}
#pform .form label.full{grid-column:auto}
/* 휴대폰 가로 화면: 창을 가운데 넓게, 칸은 한 줄에 3개, 저장 버튼은 아래에 고정 */
@media (orientation:landscape) and (max-height:520px){
  .overlay{align-items:center;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
  .sheet{max-width:min(960px,100%);max-height:100%;border-radius:16px;padding:12px 16px 0}
  .sheet h3{font-size:18px}
  .sheet .actions{position:sticky;bottom:0;background:var(--surface);margin-top:10px;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:1}
  #pform .form{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin-top:8px}
  #pform .form .photo-field{grid-column:1/-1}
  #pform .form label:has(textarea),#pform .form label.inline{grid-column:span 3}
  #pform .form input,#pform .form select{height:38px}
}
.form label .rep-chk{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:12px;font-weight:600;color:var(--accent)}
.form label .rep-chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.form .pc-rep{justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== 배경색 (메인화면 맨 아래에서 고름, 밝은 화면에서만) ===== */
@media (prefers-color-scheme: light){:root[data-bg="custom"]:not([data-theme="dark"]){--ground:var(--custom-bg)}:root[data-bg="ivory"]:not([data-theme="dark"]){--ground:#F6F1E7}:root[data-bg="sky"]:not([data-theme="dark"]){--ground:#EAF1F8}:root[data-bg="pink"]:not([data-theme="dark"]){--ground:#F8ECEE}:root[data-bg="lilac"]:not([data-theme="dark"]){--ground:#F0ECF7}:root[data-bg="mint"]:not([data-theme="dark"]){--ground:#EEF4E6}:root[data-bg="gray"]:not([data-theme="dark"]){--ground:#F0F0EE}:root[data-bg="white"]:not([data-theme="dark"]){--ground:#FFFFFF}}
:root[data-bg="ivory"][data-theme="light"]{--ground:#F6F1E7}:root[data-bg="sky"][data-theme="light"]{--ground:#EAF1F8}:root[data-bg="pink"][data-theme="light"]{--ground:#F8ECEE}:root[data-bg="lilac"][data-theme="light"]{--ground:#F0ECF7}:root[data-bg="mint"][data-theme="light"]{--ground:#EEF4E6}:root[data-bg="gray"][data-theme="light"]{--ground:#F0F0EE}:root[data-bg="white"][data-theme="light"]{--ground:#FFFFFF}
:root[data-bg="custom"][data-theme="light"]{--ground:var(--custom-bg)}
.bg-pick label.custom{position:relative;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;background:conic-gradient(#f88,#fd8,#8e8,#8df,#a8f,#f8c,#f88);overflow:hidden}
.bg-pick label.custom.on{outline:2px solid var(--accent);outline-offset:2px}
.bg-pick label.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .dept.tinted{background:var(--dept-bg)}}
:root[data-theme="light"] .dept.tinted{background:var(--dept-bg)}
.bg-pick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.bg-pick button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;font-size:9px;padding:0;white-space:nowrap;letter-spacing:-.05em;color:var(--muted)}
.bg-pick button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 네이비 디자인 ===== */
:root[data-style="navy"]{
  --ground:#EEF1F6; --surface:#FFFFFF; --sunk:#E3E8F0; --line:#D3DAE6;
  --ink:#1B2433; --muted:#4D596C; --accent:#1F3A5F; --accent-ink:#FFFFFF; --accent-soft:#DDE6F2;
  --gold:#B08D57; --gold-ink:#7A5D30; --gold-soft:#F3EBDD; --teacher:#EFEAF7; --teacher-line:#D6CCE9; --new:#9A3B5C; --new-soft:#F6E3EA; --danger:#B3261E;
  --shadow:0 1px 2px rgba(20,35,60,.06),0 6px 20px rgba(20,35,60,.07);
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --hdr:#1F3A5F; --hdr-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root[data-style="navy"]:not([data-theme="light"]){
    --ground:#0E1420; --surface:#162032; --sunk:#1C2940; --line:#2A3A55;
    --ink:#E6ECF5; --muted:#9AA8BE; --accent:#8FB3E6; --accent-ink:#0B1626; --accent-soft:#1E3352;
    --gold:#D6B67A; --gold-ink:#D6B67A; --gold-soft:#3A3122; --teacher:#231F33; --teacher-line:#3E3558; --new:#E58FAE; --new-soft:#3D1D29; --danger:#F2867E;
    --shadow:0 1px 2px rgba(0,0,0,.35); --hdr:#15243D; --hdr-ink:#E6ECF5;
  }
}
:root[data-style="navy"][data-theme="dark"]{--hdr:#15243D; --hdr-ink:#E6ECF5;
  --ground:#0E1420; --surface:#162032; --sunk:#1C2940; --line:#2A3A55;
  --ink:#E6ECF5; --muted:#9AA8BE; --accent:#8FB3E6; --accent-ink:#0B1626; --accent-soft:#1E3352;
  --gold:#D6B67A; --gold-ink:#D6B67A; --gold-soft:#3A3122; --teacher:#231F33; --teacher-line:#3E3558; --new:#E58FAE; --new-soft:#3D1D29; --danger:#F2867E;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
:root[data-style="navy"] header.top{background:var(--hdr);border-bottom:2px solid #B9A8F0} /* 머리 아랫줄: 연보라 */
:root[data-style="navy"] header.top .brand,:root[data-style="navy"] header.top .brand *{color:var(--hdr-ink)}
/* 남색 머리 안의 날짜 칸·반 칩은 흰 바탕이므로 원래 글씨색 */
:root[data-style="navy"] header.top .datebar,:root[data-style="navy"] header.top .chips{color:var(--ink)}
:root[data-style="navy"] header.top .datebar .arrow,:root[data-style="navy"] header.top .datebar .date{border-color:rgba(255,255,255,.18)}
:root[data-style="navy"] header.top .chip[aria-pressed="true"]{background:#B9A8F0;border-color:#B9A8F0;color:#1B2433} /* 선택된 학년: 연보라 */
:root[data-style="navy"] header.top .back{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:var(--hdr-ink)}
:root[data-style="navy"] header.top .role-badge{background:#B9A8F0;color:#1B2433} /* 권한 표시: 연보라 */
:root[data-style="navy"] header.top .teams{background:rgba(255,255,255,.12);border:0}
:root[data-style="navy"] header.top .teams button{color:rgba(255,255,255,.75)}
:root[data-style="navy"] header.top .teams button[aria-selected="true"]{color:var(--accent)}
:root[data-style="navy"] .brand h1{font-weight:700;letter-spacing:.02em}
:root[data-style="navy"] h2.sec{font-weight:700;padding-left:10px;border-left:3px solid #9B87E6;line-height:1.2} /* 섹션 제목 세로줄: 보라 */
:root[data-style="navy"] .sheet h3,:root[data-style="navy"] .group-h{font-weight:700}
:root[data-style="navy"] .dept{border:0;box-shadow:var(--shadow);border-bottom:3px solid var(--accent)}
:root[data-style="navy"] .card{border-color:transparent;box-shadow:var(--shadow)}
:root[data-style="navy"] nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* ===== 노을 디자인 (산호·주황 그라데이션 머리, 둥근 카드, 굵은 제목) ===== */
:root[data-style="sunset"]{
  --ground:#FFF4EE; --surface:#FFFFFF; --sunk:#FBE6DC; --line:#F3D6C8;

<script>
const TEAMS={
  infant:{label:"영아교육팀",short:"영아",unit:"영아",groups:[["0","0세"],["1","1세"],["2","2세"],["3","3세"],["4","4세"]]},
  toddler:{label:"유아교육팀",short:"유아",unit:"어린이",groups:[["5","5세"],["6","6세"],["7","7세"]]},
  youth:{label:"유소년교육팀",short:"유소년",unit:"학생",groups:[["1","1학년"],["2","2학년"],["3","3학년"],["4","4학년"],["5","5학년"],["6","6학년"]]},
  teen:{label:"중고등교육팀",short:"중고등",unit:"학생",groups:[["m1","중1"],["m2","중2"],["m3","중3"],["h1","고1"],["h2","고2"],["h3","고3"]]},
};
const teamOf=p=>p.team||"youth";
/* 영아교육팀은 나이와 관계없이 반을 편성해요. 반 목록은 부서 설정(classes), 나이는 사람마다 따로(age).
   아이는 늘 어느 한 반에 속해요(미배정 없음). 유아·유소년·중고등은 반 = 나이·학년 그대로. */
const FLEX_TEAMS=["infant"];
const isFlex=t=>FLEX_TEAMS.includes(t);
/* 반 이름: 영아는 반 목록 전체를, 나머지 부서는 나이·학년 순서는 그대로 두고 이름만 바꿔요 */
const classesOf=t=>{const c=((S.settings||{})[t]||{}).classes;
  if(isFlex(t))return Array.isArray(c)&&c.length?c:TEAMS[t].groups;
  const nm=Object.fromEntries((Array.isArray(c)?c:[]).filter(x=>x&&x[1]));return TEAMS[t].groups.map(([k,l])=>[k,nm[k]||l])};
const groupsOf=t=>[...classesOf(t),["T","교사"]];
const pickGroupsOf=groupsOf;
const isClassKey=g=>g!=="T";
const ageLabel=p=>isFlex(teamOf(p))&&p.group!=="T"&&p.age?(Object.fromEntries(TEAMS[teamOf(p)].groups.concat(...FLEX_TEAMS.map(t=>TEAMS[t].groups)))[p.age]||""):"";
let GROUPS,GL;
const S={promos:new Map(),view:"home",depts:new Map(),codes:{},isAdmin:false,people:new Map(),att:new Map(),classes:new Map(),date:null,team:"youth",group:"all",tab:"check",q:"",statMode:"week",db:null,ready:false,editable:true,fold:{}};
function setTeam(t){S.team=TEAMS[t]?t:"youth";const sc=(S.scope||{})[S.team];GROUPS=groupsOf(S.team).filter(([g])=>!sc||sc.level!=="grade"||sc.grades.includes(g));GL=Object.fromEntries(groupsOf(S.team));if(S.group!=="all"&&!GROUPS.some(x=>x[0]===S.group))S.group="all"}
const TL=(t=S.team)=>((S.settings||{})[t]||{}).talentLabel||"달란트";
const talentOn=(t=S.team)=>((S.settings||{})[t]||{}).talent!==false;
/* 대표전화: 학생마다 [수정]에서 체크한 번호. 정하지 않았으면 영아·유아는 부모, 그 외는 학생 */
const CALL_CHOICE_TEAMS=["youth"];
const callChoiceOn=(t=S.team)=>CALL_CHOICE_TEAMS.includes(t);
const callFirst=(t=S.team)=>{if(t==="infant"||t==="toddler")return "parent";if(!callChoiceOn(t))return "student";const v=((S.settings||{})[t]||{}).callFirst;return v==="parent"||v==="student"?v:"student"};
const classCallFirst=(g,t=S.team)=>{if(!callChoiceOn(t))return "";const v=(((S.settings||{})[t]||{}).callFirstByClass||{})[g];return v==="parent"||v==="student"?v:""};
const personCallOn=()=>true;
const personCallFirst=(id,t=S.team)=>{if(!id||!personCallOn(t))return "";const v=(((S.settings||{})[t]||{}).callFirstByPerson||{})[id];return v==="parent"||v==="student"?v:""};
const callFirstOf=(g,t=S.team,id)=>personCallFirst(id,t)||classCallFirst(g,t)||callFirst(t);
const studentNums=(c,t=S.team,g,id)=>{const P=["부모",c.parentPhone],K=["학생",c.phone];return callFirstOf(g,t,id)==="parent"?[P,K]:[K,P]};
/* 번호 순서는 늘 부모 → 학생, 대표전화 쪽에 전화기 아이콘이 가요 */
const fixedNums=c=>[["부모",c.parentPhone,"parent"],["학생",c.phone,"student"]];
function setPersonCall(p,next){const t=teamOf(p);const cur=(S.settings||{})[t]||{};
  S.settings={...(S.settings||{}),[t]:{...cur,callFirstByPerson:{...(cur.callFirstByPerson||{}),[p.id]:next}}};
  return tracked(call("setPersonCallFirst",p.id,next))}
const myScope=()=>(S.scope||{})[S.team]||{level:"dept",grades:[]};
const isHomeroom=()=>myScope().level==="grade";
const canManageGrades=()=>S.isAdmin||(myScope().level==="dept"&&deptLocked(S.team));
function roleLabel(){if(S.isAdmin)return S.isCo?(S.isCo2?"공동관리자(보기권한)":"공동관리자(수정권한)"):"총관리자";const sc=myScope();if(sc.level==="grade")return "담임 · "+sc.grades.map(g=>GL[g]).join(", ");return deptLocked(S.team)?"팀 관리자":""}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const START_KEY="2026-01-04";const START=new Date(2026,0,4);
function realSunday(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d}
function lastSunday(){const d=realSunday();return d<START?new Date(START):d}
function toSunday(d){d=new Date(d);d.setDate(d.getDate()-d.getDay());return d<START?new Date(START):d}
S.date=keyOf(lastSunday());
/* 속도: 출석은 올해(1~2월엔 작년도)만 받고, 사진은 따로 받아 이 기기에 저장해 둬요 */
{const _n=new Date(),_y=_n.getFullYear();S.years=new Set(_n.getMonth()<2?[_y-1,_y]:[_y]);S.years.add(Number(S.date.slice(0,4)));S.allYears=[];S.photos=new Map();S.ver="";S.vers={};S.lastBoot=0;
 try{const j=JSON.parse(localStorage.getItem("ya-photos")||"null");if(j)S.photos=new Map(Object.entries(j))}catch(_){}}
try{const t=localStorage.getItem("ya-team");if(t)S.team=t;const g=localStorage.getItem("ya-group");if(g)S.group=g}catch(e){}
setTeam(S.team);

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ---------- derived ---------- */
function activePeople(group){
  return [...S.people.values()].filter(p=>teamOf(p)===S.team&&p.active!==false&&(group==="all"||!group||p.group===group))
    .sort((a,b)=>GROUPS.findIndex(g=>g[0]===a.group)-GROUPS.findIndex(g=>g[0]===b.group)||String(a.group).localeCompare(String(b.group))||a.name.localeCompare(b.name,"ko")); /* 반 안에서는 학생·교사 모두 가나다순 */
}
const attOf=k=>S.att.get(k)||{p:{},t:{}};
const isOn=(k,id)=>!!(attOf(k).p||{})[id];
const talentOf=(k,id)=>Number((attOf(k).t||{})[id]||0);
/* 생일은 "YY/MM/DD" 또는 연도 없는 "MM/DD" 둘 다 받아요. [월,일]만 꺼내요 */
const bdMD=v=>{const m=String(v||"").trim().match(/^(?:(\d{2})\/)?(\d{1,2})\/(\d{1,2})$/);return m?[Number(m[2]),Number(m[3])]:null};
const lunarCache={};
function lunarMap(y){
  if(lunarCache[y])return lunarCache[y];
  const map={};
  try{
    const f=new Intl.DateTimeFormat("en-u-ca-chinese",{month:"numeric",day:"numeric"});
    for(let d=new Date(y,0,1);d.getFullYear()===y;d.setDate(d.getDate()+1)){
      let lm="",ld="";
      f.formatToParts(d).forEach(x=>{if(x.type==="month")lm=x.value;else if(x.type==="day")ld=x.value});
      if(!lm||/[^0-9]/.test(lm))continue; /* 윤달은 건너뜀 */
      const key=Number(lm)+"/"+Number(ld);
      (map[key]=map[key]||[]).push([d.getMonth()+1,d.getDate()]);
    }
  }catch(_){}
  return lunarCache[y]=map;
}
/* y년에 생일이 오는 양력 [월,일] 목록 (양력 생일은 하나, 음력 생일은 달력으로 계산) */
function bdDates(p,y){
  const md=bdMD(p.birthday);if(!md)return [];
  if(!p.lunar)return [md];
  const M=lunarMap(y);
  return M[md[0]+"/"+md[1]]||(md[1]===30?M[md[0]+"/29"]:null)||[];
}
/* 생일 표시: 연도 없이 적었으면 날짜만, 음력이면 앞에 "음력" */
/* 학생은 생일에 연도가 없으면 반(학년·나이)에 맞는 출생연도를 자동으로 붙여서 보여줘요 (저장된 값은 그대로 두어요).
   기준: 초N = 학년도-6-N, 중N = 학년도-12-N, 고N = 학년도-15-N, 유아·영아 N세 = 한국 나이(학년도-N+1, 0세는 올해생).
   학년도는 선택한 날짜의 해이고, 그해 연말 등반을 이미 마친 학생은 다음 해 기준으로 계산해요. */
function bdRefYear(p){const y=Number(S.date.slice(0,4));return Number(p.promotedYear)===y?y+1:y}
function bdBirthYear(p){
  if(p.group==="T")return 0;const ref=bdRefYear(p),t=teamOf(p);
  if(t==="youth"){const n=Number(p.group);return n>=1&&n<=6?ref-6-n:0}
  if(t==="teen"){const m=/^([mh])([1-3])$/.exec(String(p.group));if(!m)return 0;const n=Number(m[2]);return m[1]==="m"?ref-12-n:ref-15-n}
  if(t==="toddler"){const n=Number(p.group);return n>=5&&n<=7?ref-n+1:0}
  if(t==="infant"){if(p.age===""||p.age==null||isNaN(p.age))return 0;const n=Number(p.age);return n<=0?ref:ref-n+1}
  return 0;
}
function bdFull(p){
  const b=String(p.birthday||"").trim();if(!b)return "";
  const m=/^(\d{1,2})\/(\d{1,2})$/.exec(b);if(!m)return b;
  const y=bdBirthYear(p);return y?String(y).slice(-2)+"/"+m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0"):b;
}
const bdText=p=>(p.lunar?"음력 ":"")+bdFull(p);
function bdWeekHit(p,k){
  if(!bdMD(p.birthday))return null;
  const s=parseKey(k);
  for(let i=0;i<7;i++){const x=new Date(s);x.setDate(s.getDate()+i);
    const hit=bdDates(p,x.getFullYear()).find(([m,d])=>m===x.getMonth()+1&&d===x.getDate());
    if(hit)return [hit[0],hit[1],i]}
  return null;
}
const bdInWeek=(p,k)=>!!bdWeekHit(p,k);

const queues={};
function enqueue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(onWriteError);return queues[key]}
function onWriteError(e){

/* 출석 체크는 바로 보내지 않고 잠깐(0.8초) 모았다가 한 번에 보낸다. 20명을 눌러도 서버 요청은 한두 번 */
const attBuf={};let attTimer=null;
function mergeAtt(cur,body){return {...cur,p:{...cur.p,...(body.p||{})},t:{...cur.t,...(body.t||{})},m:{...(cur.m||{}),...(body.m||{})}}}
function writeAtt(k,body){
  S.att.set(k,mergeAtt(S.att.get(k)||{date:k,p:{},t:{}},body));render();
  if(!S.db)return;
  attBuf[k]=mergeAtt(attBuf[k]||{p:{},t:{}},body);
  if(attTimer)return;
  pending++;$("#sync").textContent="저장 중…";
  attTimer=setTimeout(flushAtt,800);
}
function flushAtt(){
  if(!attTimer)return;clearTimeout(attTimer);attTimer=null;
  const jobs=Object.keys(attBuf).map(k=>{const b=attBuf[k];delete attBuf[k];
    const body={};["p","t","m"].forEach(f=>{if(b[f]&&Object.keys(b[f]).length)body[f]=b[f]});
    return enqueue("att/"+k,()=>S.db.doc("att/"+k).update(body))});
  Promise.allSettled(jobs).then(()=>{pending--;if(!pending)$("#sync").textContent="저장됨"});
}

function resizeImage(file,max=120){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);

function normBirthday(v){
  v=String(v||"").trim();if(!v)return "";
  let y="",mm,dd,m;
  if(m=v.match(/^(\d{4}|\d{2})\s*[\/.\-년]\s*(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})\s*일?$/)||v.match(/^(\d{4})(\d{2})(\d{2})$/)||v.match(/^(\d{2})(\d{2})(\d{2})$/)){y=m[1].slice(-2);mm=Number(m[2]);dd=Number(m[3])}
  else if(m=v.match(/^(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})\s*일?$/)||v.match(/^(\d{2})(\d{2})$/)){mm=Number(m[1]);dd=Number(m[2])}
  else return null;
  if(mm<1||mm>12||dd<1||dd>31)return null;
  return (y?y+"/":"")+String(mm).padStart(2,"0")+"/"+String(dd).padStart(2,"0");
}

function renderSchedule(){
  const segHtml=`<div class="seg" style="margin-top:14px"><button data-smode="cal" aria-pressed="${!S.schedMode||S.schedMode==="cal"}">달력</button><button data-smode="lib" aria-pressed="${S.schedMode==="lib"}">자료실</button></div>`;

  if(E.error)return `<div class="notice">${esc(E.error)}</div>`;

  const first=new Date(Y,M-1,1);const start=new Date(first);start.setDate(1-first.getDay());
  const byDate={};E.list.forEach(ev=>{(byDate[ev.date]=byDate[ev.date]||[]).push(ev)});
  const today=keyOf(new Date());const sel=S.calSel||"";
  let cells=["일","월","화","수","목","금","토"].map((w,i)=>`<div class="wd ${i===0?"sun":""}">${w}</div>`).join("");

    const d=new Date(start);d.setDate(start.getDate()+i);

  }
  const monthList=E.list.filter(ev=>ev.date.slice(0,7)===ym).sort((a,b)=>a.date<b.date?-1:1);
  const selList=sel?(byDate[sel]||[]):[];
  const card=ev=>`<button class="ev-card" data-evopen="${ev.id}"><b>${esc(ev.title)}</b><span>${Number(ev.date.slice(5,7))}월 ${Number(ev.date.slice(8))}일${ev.memo?" · "+esc(ev.memo.slice(0,40)):""}</span></button>`;
  let h=segHtml+`<div class="cal-head"><button class="arrow btn" data-calmonth="-1" aria-label="지난달">‹</button><b>${Y}년 ${M}월</b><button class="arrow btn" data-calmonth="1" aria-label="다음 달">›</button></div>
    <div class="cal">${cells}</div>`;
  if(sel){const sd=parseKey(sel);h+=`<h2 class="sec">${sd.getMonth()+1}월 ${sd.getDate()}일 일정</h2><div class="list">${selList.map(card).join("")||`<p class="muted" style="margin:0">일정이 없어요.</p>`}</div>`}
  if(E.canEdit)h+=`<div style="margin-top:12px"><button class="btn primary" id="evAdd">+ ${sel?`${parseKey(sel).getMonth()+1}월 ${parseKey(sel).getDate()}일에 `:""}일정 추가</button></div>`;
  h+=`<h2 class="sec">${M}월 전체 일정</h2><div class="list">${monthList.map(card).join("")||`<p class="muted" style="margin:0">이번 달 일정이 없어요.</p>`}</div>`;
  if(!E.canEdit)h+=`<p class="muted" style="font-size:12px;margin-top:14px">일정 추가와 수정은 팀 관리자가 할 수 있어요.</p>`;
  return h;
}
function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const s=String(r.result);res(s.slice(s.indexOf(",")+1))};r.readAsDataURL(f)})}
async function downloadShared(fid){
  try{toast("내려받는 중…");const d=await call("downloadFile",S.team,fid);const bin=atob(d.b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:d.mime||"application/octet-stream"}));const a=document.createElement("a");a.href=url;a.download=d.name||"문서";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
  catch(e){alertBox("내려받지 못했어요",e.message)}
}
const CDN=()=>"https:"+"/"+"/cdn.jsdelivr.net/npm/";
const scriptCache={};
function loadScript(path){
  if(scriptCache[path])return scriptCache[path];
  scriptCache[path]=new Promise((res,rej)=>{const el=document.createElement("script");el.src=CDN()+path;el.onload=()=>res();el.onerror=()=>{delete scriptCache[path];rej(new Error("미리보기 도구를 불러오지 못했어요"))};document.head.appendChild(el)});
  return scriptCache[path];
}
async function pdfLib(){
  await loadScript("pdfjs-dist@3.11.174/build/pdf.min.js");
  const lib=window.pdfjsLib;
  if(!lib.GlobalWorkerOptions.workerSrc){
    try{const code=await (await fetch(CDN()+"pdfjs-dist@3.11.174/build/pdf.worker.min.js")).text();lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:"text/javascript"}))}
    catch(_){lib.GlobalWorkerOptions.workerSrc=CDN()+"pdfjs-dist@3.11.174/build/pdf.worker.min.js"}
  }
  return lib;
}
async function viewShared(fid){

  ov.innerHTML=`<div class="sheet guide" role="dialog" aria-label="반 담임 사용 설명서"><h3>반 담임 사용 설명서</h3>
    <p class="muted" style="margin:0;font-size:14px">팀 관리자에게 받은 <b>담임 번호</b>로 들어가면 우리 반만 보여요.</p>
    <h4>1. 앱 설치 (처음 한 번)</h4><ol><li>주소 <b class="guide-url">팀 관리자가 알려 준 앱 주소</b> 를 열어요. 팀 관리자가 보낸 링크를 눌러도 돼요.</li><li><b>안드로이드</b>: 크롬 오른쪽 위 <b>︙</b> → <b>홈 화면에 추가</b> (또는 앱 설치)</li><li><b>아이폰</b>: 사파리 아래 <b>공유 버튼</b> → <b>홈 화면에 추가</b></li><li>카카오톡에서 열었다면 먼저 <b>다른 브라우저로 열기</b>를 눌러요.</li></ol>
    <h4>2. 들어가기</h4><ol><li>메인에서 <b>우리 부서</b> 카드 → <b>담임 번호</b> 넣기</li><li>제목 옆에 "담임 · 2학년"처럼 보이면 성공!</li><li>내 휴대폰이면 "이 기기에서 번호 기억하기"를 켜 두세요. 다음부터 바로 들어가요.</li></ol>
    <h4>3. 출결메모 (주일 출석)</h4><ol><li>위쪽 날짜가 오늘 주일인지 확인해요. ‹ › 로 다른 주일로 가요.</li><li><b>체크 칸</b>: 누르면 출석, 다시 누르면 취소</li><li><b>메모</b>: 결석 이유 적기 ("감기·아픔" 같은 버튼도 있어요)</li><li><b>전화</b>: 누르면 그 학생의 <b>대표전화</b>로 바로 걸려요. 대표전화는 학생마다 명단 [수정]에서 <b>[대표]</b>에 체크한 번호예요. 체크하지 않았으면 영아·유아부는 부모님, 유소년·중고등부는 학생 번호예요 (없으면 다른 번호). 컴퓨터에서는 번호 창이 떠요.</li><li>숫자 칸(달란트 등): ▲▼ 를 누르거나 숫자를 눌러 적어요. 달란트는 여기서만 줘요.</li><li><b>담임 선생님 출석</b>: 우리 반 담임 줄 바로 아래에 선생님 이름이 <b>연보라색 줄</b>로 나와요. 거기서 선생님 출석·메모도 체크해요. (교사 명단의 이름과 담임 이름이 같아야 나와요)</li></ol>
    <h4>4. 명단 (연락처 포함)</h4><ol><li><b>[+ 사람 추가]</b>로 새 학생을 넣어요. 연락처·주소도 같이 적을 수 있어요.</li><li>이름을 누르면 보호자·부모 연락처와 주소가 보여요. <b>[전화]</b>, <b>[복사]</b>도 여기서.</li><li><b>[수정]</b>: 사진·반·생일·메모·연락처·주소를 한 창에서 위에서 아래로 차례대로 고쳐요.</li><li><b>[삭제]</b>: 이름을 누른 창에서 눌러요. 한 번 더 눌러야 지워지고, 되돌릴 수 없어요.</li><li>사람 정보는 <b>명단 탭에서만</b> 고칠 수 있어요. 다른 탭에서는 보기만 해요.</li><li><b>대표전화</b>: [수정]에서 부모 연락처·학생 연락처 옆 <b>[대표]</b> 중 하나에 체크하고 저장해요. 출결메모의 <b>[전화]</b>를 누르면 그 번호로 바로 걸려요. 이름을 누른 창에서 전화기 아이콘을 눌러 바꿀 수도 있어요.</li><li>명단에서 <b>연보라색</b> 줄은 선생님이에요.</li><li>연락처가 잠겨 있으면 명단 위쪽 <b>연락처</b> 줄의 <b>[번호 입력]</b>에 담임 번호를 넣어요.</li></ol>
    <h4>5. 생일 · 달란트</h4><ol><li><b>생일</b>: 이번 주·이번 달·다음 달 생일. 생일이 없는 사람은 맨 아래에 모여요. 음력 생일은 [수정]에서 "음력 생일"에 체크하면 그 해 양력 날짜로 바꿔 보여 줘요. 연도 없이 3/15처럼 날짜만 적어도 되고, 학생은 학년에 맞는 출생연도가 자동으로 붙어요(교사는 연도 없이 날짜만).</li><li><b>달란트</b>: 올해 누적 순위를 보는 화면이에요 (고치기는 출결메모에서).</li><li>달란트·생일·일정 엑셀은 <b>통계</b> 탭의 <b>[엑셀로 내보내기]</b> 파일에 들어 있어요.</li></ol>
    <h4>6. 출석 · 제적 · 졸업</h4><ol><li>명단 위쪽 <b>[출석] [제적] [졸업]</b> 을 눌러 나눠 봐요.</li><li>더 이상 안 나오는 학생: 이름 → [수정] → 상태를 <b>제적</b>으로. 졸업한 학생은 <b>졸업</b>으로.</li><li>제적·졸업 학생은 출석 명단에서 빠지지만 기록은 그대로 남아요.</li><li>다시 나오면 [제적] 목록에서 <b>[출석으로]</b>를 눌러요.</li></ol>
    <h4>7. 엑셀로 한 번에 (명단 · 연락처)</h4><ol><li>명단 탭 <b>엑셀</b> 줄의 <b>[양식 받기]</b>로 파일을 받아요. 지금 명단이 채워져 있어요.</li><li>'명단' 시트에 이름·반·생일·연락처·주소를 적어요. 생일은 15/03/15 처럼(연도 생략 가능). 빈 칸은 원래 값을 그대로 둬요.</li><li><b>[올리기]</b>로 파일을 고르고 확인. 이름·생일·연락처가 같은 사람은 같은 사람으로 보고 기존 정보 위에 덮어써요(없으면 이름과 반이 같은 사람). 없는 사람은 새로 들어가요.</li><li>담임은 <b>우리 반</b> 학생만 올라가요. 파일에서 줄을 지워도 앱에서는 지워지지 않아요.</li><li>출석부 전체를 저장해 두려면 <b>통계</b> 탭의 <b>[엑셀로 내보내기]</b>를 눌러요.</li></ol>
    <h4>8. 일정 · 자료실</h4><ol><li><b>일정</b> 탭 <b>[달력]</b>: 날짜를 누르면 그날 일정과 내용이 보여요. 일정 등록과 수정은 팀 관리자가 해요(날짜를 두 번 누르면 바로 등록·수정 창이 열려요).</li><li><b>[자료실]</b>: 공과 교재·양식·연락망처럼 부서에서 함께 쓰는 파일이에요. 일정과는 따로예요.</li><li><b>[+ 파일 올리기]</b>: 담임도 올릴 수 있어요 (10MB까지). 담임이 올린 파일은 부서의 담임 모두가 볼 수 있어요.</li><li><b>[삭제]</b>: 담임도 지울 수 있어요. 한 번 더 눌러야 지워지고, 되돌릴 수 없어요.</li><li><b>[미리보기]</b>: 받지 않고 바로 봐요 (PDF·엑셀·워드·사진·텍스트). 한글·파워포인트는 <b>[내려받기]</b>로 열어요.</li><li><b>[보내기]</b>: 자료실 파일을 메일로 전해요. 받는 주소는 쉼표로 5명까지 적을 수 있고, 전할 말도 함께 보낼 수 있어요.</li><li><b>[관리자만 보기]</b> 표시가 붙은 파일은 팀 관리자와 총관리자만 볼 수 있어서 담임 화면에는 나오지 않아요.</li><li><b>[온라인 작성]</b>과 <b>[열기/수정]</b>(팀 관리자): 엑셀·워드·파워포인트·텍스트·CSV 파일을 내려받지 않고 구글 시트·문서·슬라이드로 열어 고쳐요. 고친 내용은 미리보기·내려받기·메일에 바로 반영돼요. 이 버튼과 공개 범위 바꾸기는 팀 관리자만 쓸 수 있어요.</li><li>작성본 링크는 밖으로 알리지 마세요.</li></ol>
    <h4>9. 반 이름 · 반 편성 (팀 관리자)</h4><ol><li>화면 위쪽 반(학년) 칩을 <b>더블클릭</b>(휴대폰은 <b>두 번 톡톡</b>)하면 그 반 이름을 바꿀 수 있어요. 예: 1학년 → 1학년 사랑반</li><li>명단 탭 <b>[반 관리]</b>·<b>[이름 바꾸기]</b>와 같은 이름이라, 한쪽에서 바꾸면 다른 쪽에도 그대로 보여요.</li><li>이름만 바뀌고 출석·담임·담임 번호는 그대로 이어져요. 담임 번호로 들어오면 바꿀 수 없어요.</li><li><b>영아교육팀</b>은 나이와 관계없이 반을 만들어요. 명단 탭 <b>[반 관리]</b>에서 반 추가·삭제·순서, <b>[반 배정]</b>에서 아이마다 반을 골라요. 나이는 사람 [수정] 창에서 따로 적어요.</li></ol>
    <h4>10. 지켜 주세요</h4><ol><li>담임 번호와 연락처, 자료실 파일은 다른 사람에게 알려 주지 마세요.</li><li>같이 쓰는 기기면 끝난 뒤 메인의 <b>이 기기 번호 지우기</b>를 눌러요.</li><li>잘 안 되면 새로 고치거나 크롬·사파리에서 열어 보세요.</li></ol>
    <div class="actions"><div class="spacer"></div><button class="btn primary" data-close>닫기</button></div></div>`;
  document.body.appendChild(ov);
  getAppUrl().then(u=>{const b=ov.querySelector(".guide-url");if(b&&u)b.textContent=u.split(":"+"/"+"/").pop().replace(/[/]$/,"")});
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest("[data-close]"))ov.remove()});
}
/* ---------- 활동 기록 (총관리자 전용) ---------- */
const activityCard=()=>`<h2 class="sec">활동 기록</h2><div class="card admin-list"><div class="admin-row"><b>전체 부서</b><span class="code none">로그인, 번호 변경, 명단·반 이동, 일정, 자료실, 설정 기록</span><button class="btn" id="actOpen">기록 보기</button></div></div>`;
async function openActivityLog(){
  if(!S.isAdmin){toast("총관리자만 볼 수 있어요");return}
  const ov=document.createElement("div");ov.className="overlay";let all=null,tm="all",kd="all",q="",total=0,more=false,busy=false,shown=200;
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="활동 기록"><h3>활동 기록 <span class="muted" style="font-family:var(--body);font-size:14px" id="alCount"></span></h3>
    <div class="seg" id="alTeams"><button data-atm="all" aria-pressed="true">전체</button>${Object.entries(TEAMS).map(([k,x])=>`<button data-atm="${k}" aria-pressed="false">${esc(x.short)}</button>`).join("")}</div>
    <div class="form" style="grid-template-columns:1fr 1fr"><label>종류<select id="alKind"><option value="all">전체</option></select></label><label>검색<input id="alQ" type="search" placeholder="이름·내용·바꾼 사람" autocomplete="off"></label></div>
    <div id="alList" style="margin-top:6px"><p class="muted">불러오는 중…</p></div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">최근 기록부터 200건씩 보여요. 아래로 내리면 더 불러와요. 시트의 '이력' 탭에도 같은 내용이 있어요. 출석 체크 하나하나는 기록하지 않아요.</p>
    <div class="actions"><div class="spacer"></div><button class="btn primary" data-close>닫기</button></div></div>`;
  document.body.appendChild(ov);
  const list=ov.querySelector("#alList");
  const draw=()=>{
    if(all===null)return;
    const lab=tm==="all"?"":TEAMS[tm].label;const qq=q.trim();
    const f=all.filter(x=>(!lab||x.team===lab)&&(kd==="all"||x.kind===kd)&&(!qq||[x.name,x.text,x.by,x.kind].some(v=>(v||"").includes(qq))));
    ov.querySelector("#alCount").textContent=(lab||kd!=="all"||qq?`${f.length}건 / `:"")+`${all.length}${more?"/"+total:""}건`;
    list.innerHTML=f.length?f.slice(0,shown).map(x=>`<div class="hist-item"><span class="when">${esc(x.at.slice(0,10))}<br>${esc(x.at.slice(11))}</span><span class="what"><span class="hist-kind ${x.kind==="교사"||x.kind==="담임"?"t":""}">${esc(x.kind)}</span>${x.team?`<span class="muted" style="font-size:12px">${esc(x.team.replace("교육팀",""))} </span>`:""}${x.name?`<b>${esc(x.name)}</b> `:""}${esc(x.text)}<span class="by">${esc(x.by)}</span></span></div>`).join(""):`<p class="muted">${more?"불러온 기록 중에는 없어요.":"기록이 없어요."}</p>`;
    if(f.length>shown||more)list.insertAdjacentHTML("beforeend",`<p style="text-align:center;margin:10px 0"><button class="btn" id="alMore" ${busy?"disabled":""}>${busy?"더 불러오는 중…":"더 보기"}</button></p>`);
  };
  const setKinds=()=>{const sel=ov.querySelector("#alKind");const kinds=[...new Set(all.map(x=>x.kind))].sort((a,b)=>a.localeCompare(b,"ko"));
    sel.innerHTML=`<option value="all">전체</option>`+kinds.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join("");sel.value=kinds.includes(kd)?kd:"all"};
  // 서버에서 최근 기록부터 200건씩. 화면에는 다 그리지 않고 200건씩 늘려 그린다
  const fetchMore=async()=>{
    if(busy)return;busy=true;draw();
    try{const r=await call("activity",all?all.length:0,total);
      if(Array.isArray(r)){all=r;more=false;total=r.length}else{all=(all||[]).concat(r.list);more=r.more;total=r.total}
      setKinds()}
    catch(e){if(all===null){ov.remove();alertBox("활동 기록을 불러오지 못했어요",e.message);return}toast("더 불러오지 못했어요")}
    finally{busy=false}
    draw();
  };
  const sheet=ov.querySelector(".sheet");
  const next=()=>{
    if(all===null||busy)return;
    const lab=tm==="all"?"":TEAMS[tm].label;const qq=q.trim();
    const n=all.filter(x=>(!lab||x.team===lab)&&(kd==="all"||x.kind===kd)&&(!qq||[x.name,x.text,x.by,x.kind].some(v=>(v||"").includes(qq)))).length;
    if(n>shown){shown+=200;draw()}else if(more){shown+=200;fetchMore()}
  };
  sheet.addEventListener("scroll",()=>{if(sheet.scrollTop+sheet.clientHeight>=sheet.scrollHeight-300)next()},{passive:true});
  ov.addEventListener("click",e=>{
    if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();
    if(e.target.closest("#alMore"))return next();
    const b=e.target.closest("[data-atm]");if(b){tm=b.dataset.atm;shown=200;ov.querySelectorAll("[data-atm]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw()}
  });
  ov.querySelector("#alKind").addEventListener("change",e=>{kd=e.target.value;shown=200;draw()});
  ov.querySelector("#alQ").addEventListener("input",e=>{q=e.target.value;shown=200;draw()});
  fetchMore();
}

/** 그달 넷째 주일 */
function fourthSun(ym){const y=Number(ym.slice(0,4)),m=Number(ym.slice(5,7));return ym+"-"+String(1+(7-new Date(y,m-1,1).getDay())%7+21)}
/** 그달 셋째 주 화요일 (부서 보고서 제출 기한) */
function thirdTue(ym){const y=Number(ym.slice(0,4)),m=Number(ym.slice(5,7));return 1+(9-new Date(y,m-1,1).getDay())%7+14}
/** 기본으로 여는 달: 이번 달 넷째 주일이 지났으면 다음 달 */
function rptDefaultYm(){const n=new Date();let y=n.getFullYear(),m=n.getMonth()+1;const ym=()=>y+"-"+String(m).padStart(2,"0");
  const today=ym()+"-"+String(n.getDate()).padStart(2,"0");if(today>fourthSun(ym())){m++;if(m>12){m=1;y++}}return ym()}
const ymShift=(ym,d)=>{let y=Number(ym.slice(0,4)),m=Number(ym.slice(5,7))+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")};

const dateLabel=k=>{const d=parseKey(k);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`};
/** 기본 정리: 줄 끝 공백, 겹친 띄어쓰기, 괄호·쉼표 앞뒤 띄어쓰기, 들여쓰기(두 칸), 빈 줄 겹침을 맞춘다 */
function rptTidy(lines){
  let a=(lines||[]).map(x=>{let s=String(x==null?"":x).replace(/ /g," ").replace(/\t/g," ").replace(/\s+$/,"");const lead=/^\s/.test(s);
    s=s.trim().replace(/\s{2,}/g," ").replace(/\s+([,.)\]])/g,"$1").replace(/([(\[])\s+/g,"$1").replace(/,(?!\s)/g,(m,i,x)=>/\d/.test(x[i-1]||"")&&/\d/.test(x[i+1]||"")?",":", ");return s?(lead?"  ":"")+s:""});
  a=a.filter((x,i)=>x||(i>0&&a[i-1]));while(a.length&&!a[0])a.shift();while(a.length&&!a[a.length-1])a.pop();return a;
}
function saveB64(name,b64,mime){
  const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:mime||"application/octet-stream"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* 한글(.hwp) 읽기: 부서 보고서에서 표의 '이번 달 보고'·'다음 달 계획' 칸 글자만 꺼낸다 (브라우저에서) */
function cfbRead(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);const u32=o=>dv.getUint32(o,true);
  if(u32(0)!==0xE011CFD0)throw new Error("한글(.hwp) 파일이 아니에요. 한글에서 .hwp로 저장해 주세요");
  const ss=1<<dv.getUint16(30,true),mss=1<<dv.getUint16(32,true),E=0xFFFFFFFA;
  const sec=s=>u8.subarray(512+s*ss,512+(s+1)*ss);
  let difat=[];for(let i=0;i<109;i++)difat.push(u32(76+i*4));
  for(let s=u32(68),n=u32(72);n-->0&&s<E;){const b=sec(s),d=new DataView(b.buffer,b.byteOffset,ss);for(let i=0;i<ss/4-1;i++)difat.push(d.getUint32(i*4,true));s=d.getUint32(ss-4,true)}
  const fat=[];difat.slice(0,u32(44)).forEach(s=>{const d=new DataView(u8.buffer,u8.byteOffset+512+s*ss,ss);for(let i=0;i<ss/4;i++)fat.push(d.getUint32(i*4,true))});
  const chain=(s,t)=>{const o=[];while(s<E&&o.length<1e6){o.push(s);s=t[s]}return o};
  const cat=(parts,size)=>{const o=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let k=0;parts.forEach(p=>{o.set(p,k);k+=p.length});return size==null?o:o.subarray(0,size)};
  const big=(s,size)=>cat(chain(s,fat).map(sec),size);
  const dir=big(u32(48));const dd=new DataView(dir.buffer,dir.byteOffset,dir.byteLength);

async function applyMoves(list,onProgress){
  for(const [id,body] of list){const p=S.people.get(id);if(p)S.people.set(id,{...p,...body})}
  onProgress(0,Math.max(1,list.length));
  try{await S.db.batch(list.map(([id,body])=>["people/"+id,body]));onProgress(list.length,Math.max(1,list.length));return []}
  catch(e){console.error(e);toast(e.message);await load();return list.map(x=>x[0])}
}
const needsCode=t=>deptLocked(t)&&!S.isAdmin;
async function codeOk(t,ov){
  if(!needsCode(t))return true;
  const inp=ov.querySelector("#f-pcode");const code=inp.value.trim();
  let ok=false;try{ok=await call("verifyCode",t,code,AUTH().email)}catch(_){}
  if(ok)storeCode(t,code);
  ov.querySelector("#pcodeErr").hidden=ok;if(!ok)inp.select();return ok;
}
function sheetShell(title,intro,body,goLabel,goCls,t){
  return `<div class="sheet" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>
    <p class="muted" style="margin:0;font-size:14px">${intro}</p>${body}
    ${needsCode(t)?`<div class="form"><label class="full">${esc(TEAMS[t].label)} 고유번호 확인<input id="f-pcode" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label></div><p class="err" id="pcodeErr" hidden>고유번호가 맞지 않아요.</p>`:""}
    <div class="progress" hidden><div></div></div><p class="muted num" id="pMsg" style="font-size:13px;margin:8px 0 0"></p>
    <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button>${goLabel?`<button type="button" class="btn ${goCls}" id="pGo">${goLabel}</button>`:""}</div></div>`;
}
function runSheet(ov,armText,work){
  let running=false;
  ov.addEventListener("click",async e=>{
    if(!running&&(e.target===ov||e.target.closest("[data-close]")))return ov.remove();
    const go=e.target.closest("#pGo");if(!go||running)return;
    if(!go.dataset.armed){go.dataset.armed="1";go.textContent=armText;return}
    running=true;go.disabled=true;
    const t=ov.dataset.team;if(!(await codeOk(t,ov))){running=false;go.disabled=false;return}
    ov.querySelector("[data-close]").disabled=true;
    const bar=ov.querySelector(".progress");bar.hidden=false;const msg=ov.querySelector("#pMsg");
    await work((d,n,label)=>{bar.firstElementChild.style.width=(d/n*100)+"%";msg.textContent=`${d} / ${n}명 ${label}`});
    ov.remove();render();
  });
}
const canPromote=t=>S.isAdmin||(((S.scope||{})[t]||{}).level==="dept"&&deptLocked(t));
function openPromotion(t){
  if(!S.db||!S.editable)return;if(!canPromote(t)){toast("연말 등반은 팀 관리자 이상만 할 수 있어요");return}
  let plan=planPromotion(t);const y=promoYear();
  const order=promoGroups(t,plan);
  const last=TEAMS[t].groups[TEAMS[t].groups.length-1].slice();last[1]=stepLabel(t,last[0]).slice(TEAMS[t].short.length+1);const nx=nextStep(t,last[0]);
  const dest=nx==="grad"?"졸업 처리되어 명단에서 숨겨져요":`<b>${esc(TEAMS[nx[0]].label)} ${esc(stepLabel(nx[0],nx[1]).slice(TEAMS[nx[0]].short.length+1))}</b>(으)로 올라가요`;
  const intro=`${esc(TEAMS[t].label)} 재적 <b id="pCount">${plan.length}</b>명이 ${isFlex(t)?"한 살씩":"한 학년씩"} 올라가요. ${esc(last[1])}은(는) ${dest}. 교사와 담임 지정은 그대로예요.`
    +(isFlex(t)?`<br>반은 그대로예요. 새 반이 필요하면 등반 뒤 [명단 → 반 배정]에서 옮겨 주세요.`:"");
  const na=noAgeKids(t);
  const warn=(na.length?`<p class="err">나이가 적혀 있지 않은 ${na.length}명은 등반에서 빠져요: ${na.slice(0,6).map(p=>esc(p.name)).join(", ")}${na.length>6?" …":""}. 명단에서 나이를 먼저 적어 주세요.</p>`:"")+(promoDone(t)?`<p class="err">이미 ${y}년 연말 ${esc(TEAMS[t].short)} 등반을 했어요. 지금 남은 대상은 그 뒤에 들어온 학생들이에요.</p>`:"");
  const listHtml=()=>{const o=promoGroups(t);return o.map(m=>promoMoveRow(m,t)).join("")+promoSkipRow(t)||`<p class="muted">등반할 학생이 없어요. 이번 연말에 이미 등반한 학생은 다시 올라가지 않아요.</p>`};
  const list=`<p class="muted" style="font-size:12px;margin:10px 0 0">이름을 누르면 이번 등반에서 빼요. 뺀 학생을 다시 누르면 넣어요.</p><div class="move-list" id="pList">${listHtml()}</div>`;
  const ov=document.createElement("div");ov.className="overlay";ov.dataset.team=t;
  ov.innerHTML=sheetShell(`${TEAMS[t].label} ${y}년 연말 학년 등반`,intro,warn+list,plan.length||promoSkipped(t).length?"등반 실행":"","primary",t);
  document.body.appendChild(ov);
  const refresh=()=>{if(!ov.isConnected){document.removeEventListener("promo-skip",refresh);return}
    plan=planPromotion(t);ov.querySelector("#pList").innerHTML=listHtml();ov.querySelector("#pCount").textContent=plan.length;
    const go=ov.querySelector("#pGo");if(go&&!go.disabled){delete go.dataset.armed;go.textContent=plan.length?"등반 실행":"등반할 학생 없음";go.disabled=false}};
  document.addEventListener("promo-skip",refresh);
  runSheet(ov,"한 번 더 누르면 실행",async prog=>{
    plan=planPromotion(t);if(!plan.length){toast("등반할 학생이 없어요");return}
    const moves=[],list=[];
    for(const {p,next} of plan){
      moves.push({id:p.id,team:t,group:p.group,age:p.age||"",section:p.section||"",active:p.active!==false,leftType:p.leftType||"",note:p.note||"",promotedYear:p.promotedYear??null});
      list.push([p.id,next==="grad"?{active:false,leftType:"졸업",note:(p.note?p.note+" · ":"")+`${y}년 졸업`,promotedYear:y,section:""}:promoBody(next,y)]);
    }
    const failed=await applyMoves(list,(d,n)=>prog(d,n,"올리는 중…"));
    const done=moves.filter(m=>!failed.includes(m.id));
    const runs=runsOfRec(promoRec(t)).concat(done.length?[{id:"r"+Date.now(),at:new Date().toISOString(),count:done.length,moves:done,undone:false}]:[]);
    const rec=recOf(t,y,runs);
    S.promos.set(promoKey(t),rec);
    try{await S.db.doc("promotions/"+promoKey(t)).set(rec)}catch(e){console.error(e);toast("등반 기록을 저장하지 못해 되돌리기를 쓸 수 없어요")}
    toast(failed.length?`${plan.length-failed.length}명 등반, ${failed.length}명은 저장하지 못했어요. 다시 누르면 남은 학생만 올라가요`:`${TEAMS[t].short} ${plan.length}명 등반을 마쳤어요`);
  });
}
function openUndoPromotion(t){
  if(!S.db||!S.editable)return;if(!S.isAdmin){toast("등반 되돌리기는 총관리자·공동관리자만 할 수 있어요");return}
  const hist=promoHistory(t).slice(0,10);
  /* 같은 학생을 그 뒤에 다시 올린 등반이 남아 있으면, 나중 것부터 되돌려야 해요 */
  const blocked=x=>hist.some(o=>!o.undone&&String(o.at)>String(x.at)&&(o.moves||[]).some(m=>(x.moves||[]).some(n=>n.id===m.id)));
  const runRow=x=>{
    const g=new Map();for(const m of x.moves||[]){const f=stepFrom(m.team,m);const nx=f?nextStep(m.team,f):null;const k=(f?stepLabel(m.team,f):classLabelOf(m.team,m.group))+" → "+(nx?stepToLabel(nx):"?");g.set(k,(g.get(k)||0)+1)}
    const names=(x.moves||[]).map(m=>(S.people.get(m.id)||{}).name).filter(Boolean);
    const st=x.undone?"되돌림":blocked(x)?"나중 등반을 먼저 되돌려 주세요":"";
    return `<button type="button" class="run" data-run="${esc(x.key+"|"+x.id)}" aria-pressed="false"${x.undone||blocked(x)?" disabled":""}>
      <span class="h"><span class="num">${new Date(x.at).toLocaleString("ko-KR",{year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})}</span><span class="num">${x.count}명</span><span class="st">${esc(st)}</span></span>
      <span class="d">${[...g].map(([k,n])=>esc(k)+" "+n+"명").join(" · ")}</span>
      ${names.length?`<span class="d">${esc(names.slice(0,6).join(", "))}${names.length>6?` 외 ${names.length-6}명`:""}</span>`:""}</button>`;
  };
  const body=hist.length?`<div class="move-list">${hist.map(runRow).join("")}</div>`:`<p class="muted" style="margin-top:12px">되돌릴 등반 기록이 없어요.</p>`;
  const ov=document.createElement("div");ov.className="overlay";ov.dataset.team=t;
  ov.innerHTML=sheetShell(`${TEAMS[t].label} 등반 되돌리기`,`최근 등반 내역에서 되돌릴 것을 골라 주세요. 그때 올린 학생들만 등반 전 반으로 돌아가요(다른 부서로 올라간 학생, 졸업 처리한 학생도 돌아와요). 등반 뒤 고친 반 정보는 등반 전 값으로 바뀌어요.`,body,hist.some(x=>!x.undone)?"되돌리기":"","danger",t);
  document.body.appendChild(ov);
  const go=ov.querySelector("#pGo");if(go)go.disabled=true;
  let pick=null;
  ov.addEventListener("click",e=>{const b=e.target.closest("[data-run]");if(!b||b.disabled||go.dataset.armed&&go.disabled)return;
    ov.querySelectorAll("[data-run]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    const [key,id]=b.dataset.run.split("|");pick=hist.find(x=>x.key===key&&x.id===id);
    go.disabled=false;delete go.dataset.armed;go.textContent=`${pick.count}명 되돌리기`});
  runSheet(ov,"한 번 더 누르면 되돌리기",async prog=>{
    if(!pick)return;
    const list=(pick.moves||[]).filter(m=>S.people.has(m.id)).map(m=>[m.id,{team:m.team,group:m.group,...("age" in m?{age:m.age}:{}),section:m.section||"",active:m.active,leftType:m.leftType||"",note:m.note,promotedYear:m.promotedYear??null}]);
    const failed=await applyMoves(list,(d,n)=>prog(d,n,"되돌리는 중…"));
    const r=S.promos.get(pick.key);const runs=runsOfRec(r).map(x=>x.id===pick.id?{...x,undone:true,undoneAt:new Date().toISOString()}:x);
    const rec=recOf(t,pick.year,runs);S.promos.set(pick.key,rec);
    try{await S.db.doc("promotions/"+pick.key).set(rec)}catch(e){console.error(e);toast("되돌린 기록을 저장하지 못했어요")}
    toast(failed.length?`${failed.length}명은 되돌리지 못했어요. 명단에서 확인해 주세요`:`${pick.count}명 등반을 되돌렸어요`);
  });
}
function promoStatus(t){
  const r=promoRec(t),y=promoYear();
  const live=liveRuns(r);const n=live.reduce((a,x)=>a+(x.count||0),0);
  return r&&runsOfRec(r).length?`${y}년 연말 등반 ${live.length?"완료":"되돌림"} · ${new Date(r.at).toLocaleDateString("ko-KR")}${live.length?` · ${n}명`:""}`:`${y}년 연말 등반 전 · 대상 ${planPromotion(t).length}명${promoSkipped(t).length?` · 뺌 ${promoSkipped(t).length}명`:""}`;
}

    <div class="admin-list card" style="margin-top:12px">${list.map(([k,l],i)=>`<div class="admin-row">${FX?"":`<span class="muted" style="font-size:12px;min-width:40px">${esc(orig[k]||"")}</span>`}<input data-ci="${i}" value="${esc(l)}" maxlength="12" aria-label="${i+1}번째 반 이름" style="flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font:inherit"><span class="muted num" style="font-size:12px;min-width:34px;text-align:right">${k?cnt(k)+"명":"새 반"}</span>${FX?`<button type="button" class="btn" data-cup="${i}" aria-label="위로" ${i?"":"disabled"}>↑</button><button type="button" class="btn" data-cdel="${i}" aria-label="${esc(l)} 없애기" style="color:var(--danger)">×</button>`:""}</div>`).join("")}</div>

function AUTH(){let tk={...(S._tk||{})},admin=S._admin||"",codes={...(S._codes||{})},gcodes={...(S._gcodes||{})},email=S._email||"",copw=S._copw||"";try{admin=localStorage.getItem("ya-admin")||admin;email=localStorage.getItem("ya-email")||email;copw=localStorage.getItem("ya-copw")||copw;tk={...tk,...(JSON.parse(localStorage.getItem("ya-tk")||"null")||{})};codes={...codes,...(JSON.parse(localStorage.getItem("ya-codes")||"null")||{})};gcodes={...gcodes,...(JSON.parse(localStorage.getItem("ya-gcodes")||"null")||{})}}catch(_){}return{admin,codes,gcodes,email,copw,tk}}

// GitHub 페이지에서 열면 google.script.run 이 없으므로 웹앱 주소(doPost)로 직접 보낸다.
const API_URL="https:"+"/"+"/script.google.com/macros/s/AKfycbxAIzrJ4PjqNm4lo-1iC88RjRV56JTSkug5moMo_a-x7Im4v98XxCZ0Z-Gm0Y2FaUGt/exec";
const CLIENT_V=2; /* 서버(MIN_CLIENT)보다 낮으면 예전 화면으로 보고 거절해요 */
const HAS_GS=typeof google!=="undefined"&&!!(google.script&&google.script.run);
/* 읽기만 하는 요청은 연결이 끊기면 자동으로 두 번 더 시도해요 (저장 요청은 중복될 수 있어 다시 보내지 않아요) */
const READ_OPS=new Set(["boot","photos","events","libList","contacts","appUrl","history","activity","gradeCodes","verifyCode","findGradeCode","verifyGradeCode","downloadFile","rptGet","rptHwp","rptOrig"]);
async function callFetch(op,args){
  let t;const ac=typeof AbortController!=="undefined"?new AbortController():null;const tm=ac?setTimeout(()=>ac.abort(),60000):0;
  try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op,auth:AUTH(),args,cv:CLIENT_V}),redirect:"follow",signal:ac?ac.signal:undefined});
    if(!r.ok)throw new Error("HTTP "+r.status);t=await r.text()}
  catch(e){const er=new Error(navigator.onLine===false?"인터넷에 연결되어 있지 않아요. 연결을 확인해 주세요":"서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요");er.net=true;throw er}
  finally{clearTimeout(tm)}
  let x;try{x=JSON.parse(t)}catch(_){const er=new Error("서버 응답을 읽지 못했어요");er.net=true;throw er}
  if(!x.ok)throw new Error(x.error);noteVer(op,x);return x.data;
}
async function callFetchRetry(op,args){
  for(let i=0;;i++){try{return await callFetch(op,args)}catch(e){if(!e.net||!READ_OPS.has(op)||i>=2)throw e;await new Promise(r=>setTimeout(r,1500*(i+1)))}}
}
function call(op,...args){
  if(!HAS_GS)return callFetchRetry(op,args);
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(r=>{let x;try{x=JSON.parse(r)}catch(_){return rej(new Error("서버 응답을 읽지 못했어요"))}if(x.ok)noteVer(op,x);x.ok?res(x.data):rej(new Error(x.error))})
      .withFailureHandler(e=>rej(new Error((e&&e.message)||"연결하지 못했어요. 인터넷 연결을 확인해 주세요")))
      .api(op,AUTH(),...args);
  });
}

/* 버전은 부서·반별로 따로예요. 화면은 자기가 보는 부서·반의 버전만 물어봐요 (다른 반 출석 체크로 전체를 다시 받지 않게) */
function noteVer(op,x){
  if(!WRITE_OPS.has(op)||!x.v)return;
  if(typeof x.v==="string"){if(x.pv===S.ver)S.ver=x.v;return}
  Object.keys(x.v).forEach(k=>{if(k in S.vers&&S.vers[k]===(x.pv||{})[k])S.vers[k]=x.v[k]});
}
async function checkUpdate(){
  if(loading||pending||!S.ready)return;
  try{const keys=Object.keys(S.vers||{});let changed;
    if(keys.length){const m=await call("ping",keys)||{};changed=keys.some(k=>(m[k]||"0")!==S.vers[k])}
    else changed=(await call("ping"))!==S.ver;
    if(S.needFull||changed||Date.now()-S.lastBoot>600000){S.needFull=false;load(true)}}catch(_){}
}
function needYear(){const y=Number(S.date.slice(0,4));if(S.years.has(y))return;S.years.add(y);if(loading)S.needFull=true;else load(true)}
async function ensureYears(list){const add=list.filter(y=>!S.years.has(y));if(!add.length)return;add.forEach(y=>S.years.add(y));if(loading)await loading.catch(()=>{});await load(true)}
/* ---- 사진: 따로 받아서 이 기기에 저장해 둬요 ---- */
let photoBusy=false;
function savePhotoCache(){
  if(S.remember===false)return;
  for(const id of [...S.photos.keys()])if(!S.people.has(id))S.photos.delete(id);
  try{localStorage.setItem("ya-photos",JSON.stringify(Object.fromEntries(S.photos)))}catch(_){try{localStorage.removeItem("ya-photos")}catch(__){}}
}
async function loadPhotos(){
  if(photoBusy)return;
  const need=[...S.people.values()].filter(p=>{const c=S.photos.get(p.id);return !c||(Number(p.photoV)||0)!==(c[0]||0)}).map(p=>p.id);
  if(!need.length)return;
  photoBusy=true;
  try{
    for(let i=0;i<need.length;i+=100){
      const ids=need.slice(i,i+100);const r=await call("photos",ids)||{};let got=false;
      ids.forEach(id=>{const p=S.people.get(id);const d=safePhoto(r[id]||"");S.photos.set(id,[Number(p&&p.photoV)||0,d]);if(d)got=true});
      if(got&&!document.querySelector(".overlay"))render();
    }
    savePhotoCache();
  }catch(_){}
  photoBusy=false;
}
function applyBoot(d){
  if(d.tk){S._tk=d.tk;if(S.remember!==false)try{localStorage.setItem("ya-tk",JSON.stringify(d.tk))}catch(_){}}
  S.isAdmin=!!d.isAdmin;S.isCo=!!d.isCo;S.isCo2=!!d.isCo2;S.me=d.me||"";S.adminSet=!!d.adminSet;S.locked=d.locked||{};S.access=d.access||{};S.counts=d.counts||{};S.codes=d.codes||{};
  S.staff=d.staff||[];S.scope=d.scope||{};S.settings=d.settings||{};S.people=new Map((d.people||[]).map(p=>[p.id,p]));setTeam(S.team);
  S.att=new Map(Object.entries(d.att||{}));
  Object.keys(attBuf).forEach(k=>S.att.set(k,mergeAtt(S.att.get(k)||{date:k,p:{},t:{}},attBuf[k]))); // 아직 안 보낸 체크는 유지
  S.classes=new Map(Object.entries(d.classes||{}));
  S.promos=new Map(Object.entries(d.promos||{}));
  if(autoDate&&realSunday()<START&&S.date===START_KEY){autoDate=false;const ks=[...S.att.keys()].filter(k=>k>=START_KEY&&Object.keys(S.att.get(k).p||{}).length).sort();if(ks.length)S.date=ks.pop()}
  if(d.years)S.years=new Set(d.years);S.allYears=d.allYears||[];if(d.v!==undefined)S.ver=d.v;S.vers=d.vers||{};
  S.ready=true;
}
const BOOT_KEY="ya-boot-v1";
function saveBootCache(d){if(S.remember===false)return;try{localStorage.setItem(BOOT_KEY,JSON.stringify(d))}catch(_){try{localStorage.removeItem(BOOT_KEY)}catch(__){}}}
function useBootCache(){try{const d=JSON.parse(localStorage.getItem(BOOT_KEY)||"null");if(!d)return;applyBoot(d);render();hideBootLoader();$("#sync").textContent="최신 내용 확인 중…"}catch(_){}}
function hideBootLoader(){const el=$("#bootLoader");if(!el)return;el.classList.add("out");setTimeout(()=>el.remove(),300)}
function slowNotice(show,msg){
  let el=document.getElementById("slowBox");
  if(!show){if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.id="slowBox";el.className="notice";el.style.cssText="margin:12px 16px;max-width:608px";document.querySelector(".app").insertBefore(el,document.querySelector("#view"))}
  el.innerHTML=`<b>${esc(msg)}</b><br>· 처음 열 때는 10초쯤 걸릴 수 있어요.<br>· 카카오톡 안에서 열었다면 Chrome이나 Safari로 열어 보세요.<br>· 구글 계정 여러 개에 로그인된 브라우저라면 시크릿 창에서 열어 보세요.<div style="margin-top:8px"><button class="btn" id="retryLoad">다시 시도</button></div>`;
}
async function load(quiet){
  if(loading)return loading;
  const slow=setTimeout(()=>{if(!S.ready){slowNotice(true,"구글 시트에서 불러오는 데 시간이 걸리고 있어요.");hideBootLoader()}},12000);
  const slowMsg=setTimeout(()=>{if(!S.ready&&$("#bootMsg"))$("#bootMsg").textContent="조금만 기다려 주세요. 처음 열 때는 시간이 걸려요…"},5000);
  loading=call("boot",[...S.years]).then(d=>{applyBoot(d);saveBootCache(d);S.lastBoot=Date.now();slowNotice(false);$("#sync").textContent="저장됨";render();hideBootLoader();loadPhotos()})
    .catch(e=>{console.error(e);$("#sync").textContent=S.ready?"연결 안 됨 · 자동 재시도":"연결 안 됨";if(!S.ready){slowNotice(true,"불러오지 못했어요: "+e.message);hideBootLoader()}else if(!quiet)toast(e.message)})
    .finally(()=>{clearTimeout(slow);clearTimeout(slowMsg);loading=null});
  return loading;
}
document.addEventListener("click",e=>{if(e.target.closest("#retryLoad")){$("#sync").textContent="불러오는 중…";loading=null;load()}});
render();useBootCache();load();
if(S.view==="dept")setTimeout(()=>{preloadSched()},1500);
setInterval(()=>{
  if(document.hidden||pending||document.querySelector(".overlay"))return;
  const a=document.activeElement;if(a&&a.dataset&&(a.dataset.tv||a.dataset.total))return;
  if(a&&a.id==="q")return; // 이름 검색 중에는 새로 불러오지 않아요 (한글 입력이 끊기지 않게)
  checkUpdate();
},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!pending)checkUpdate()});
</script>

<script>
(function () {
  var BUILD = '20261014183150';
  // 1) 서비스워커: 항상 최신 sw.js 를 확인하고, 새 버전이 잡히면 자동으로 새로고침
  if ('serviceWorker' in navigator) {
    var had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      reg.update();
      document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update(); });
    }).catch(function () {});
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (had) refresh(); });
  }
  // 2) 버전 확인: version.json 은 캐시를 거치지 않고 읽어서, 내 화면과 다르면 새로 불러옴
  function busy() { return !!document.querySelector('.overlay') || (typeof pending !== 'undefined' && pending > 0); }
  function clearAll() {
    return (window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve()).catch(function () {});
  }
  function refresh(build) {
    if (busy()) { setTimeout(function () { refresh(build); }, 3000); return; }
    var n = Number(sessionStorage.getItem('ya-reload') || 0);
    if (n >= 3) return;                       // 무한 새로고침 방지
    sessionStorage.setItem('ya-reload', String(n + 1));
    clearAll().then(function () { location.replace(location.pathname + '?v=' + (build || Date.now())); });
  }
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.build && j.build !== BUILD) refresh(j.build); else sessionStorage.removeItem('ya-reload');
    }).catch(function () {});
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(function () { if (!document.hidden) check(); }, 60000);
})();
</script>
